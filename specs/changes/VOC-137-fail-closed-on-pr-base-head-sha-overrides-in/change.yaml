requirement_source: 'GitHub issue #1083 (Fail closed on PR base/head SHA overrides
  in every scannable caller executable), including its original body. VOC-136 implementation
  PR #1080 merged exact reviewed head 5d0c2350ab9a20ace586eaadd1169203140ffad0 as
  develop merge 0cee20c87e0411a95f368d2b7d39ac2bb118dfb8. In tooling/governance/tests/voc136_bypass_scan.py,
  PR_SHA_SET_PATTERN is evaluated only when the relative filename contains validate-workspace
  or ends in .test.mjs, so an added file such as scripts/arbitrary-wrapper.sh that
  exports PR_BASE_SHA before pnpm test is accepted instead of failing closed. Pre-merge
  supervisor evidence: https://github.com/KARSIFT/vocanova-platform-sandbox/pull/1080#issuecomment-5444745877.
  Reviewer verdict that missed the blocking gap: https://github.com/KARSIFT/vocanova-platform-sandbox/pull/1080#issuecomment-5444825638.
  Post-merge audit: https://github.com/KARSIFT/vocanova-platform-sandbox/pull/1080#issuecomment-5444861382.
  Automatic release was stopped before main changed. Release runs 33113425829 and
  33113547909 were canceled and release PR #1082 was converted to draft. At issue
  creation, develop is 0cee20c87e0411a95f368d2b7d39ac2bb118dfb8 and main remains 0d0b0cdf0692d0349f380e9cae3285b4c7916b05.
  Live PINNED_SHA.txt already equals infrastructure #167 merge b263c0c110591cc798b89277dfc35542abb1597b.
  Preserve VOC-136 merge/completion/review records as audit evidence. Do not rewrite
  or manufacture them. This draft package does not adopt or authorize itself.'
