dependencies:
- id: VOC-085-DEP-00
  status: 'resolved at drafting time by issue #702 verified evidence and drafting-time
    repo read. Root cause is intentional deferral of the VOC-052 production seed mirror
    (VOC-052-T02 closed out-of-scope-for-now) plus production smoke that accepts HTTP
    200 with an empty journey-situations list. Staging already builds/runs apps/api/cmd/seed
    as p1-content-seed after migrations and synthetic-user seed; production does not.'
- id: VOC-085-DEP-01
  status: resolved at drafting time. Reuse the existing apps/api/cmd/seed binary and
    embedded voc026-p1.json; do not replace or redesign the canonical dataset. Seed
    semantics remain idempotent upsert-by-fixed-primary-key.
- id: VOC-085-DEP-02
  status: unresolved at drafting time only as an implementer shape choice (not a requirement
    gap). Exact harness for the authenticated non-mutating route sweep (extend smoke-test-production.sh,
    add a sibling script invoked by deploy-production.yml, or a narrowly scoped browser
    harness) must preserve read-only checks, reuse the workflow-minted synthetic session,
    and cover the ten fixed routes plus one real situation and one real word route
    derived from the API. See specification.md open question 1.
- id: VOC-052
  status: Adopted predecessor. Seeded staging via deploy-staging.yml; production mirror
    (T02) was deferred. This package completes the production half and adds fail-closed
    content/route gates.
- id: VOC-050
  status: Adopted predecessor. Synthetic smoke-user seed, session mint, and production
    smoke cookie plumbing this package reuses without inventing a parallel identity.
- id: VOC-067
  status: Adopted predecessor for staging/production isolation and shared-edge topology.
    This package must preserve secret, directory, deploy-user, database, and Docker-network
    isolation and the single shared-edge nginx architecture (no 8081/8443 regression).
affected_areas:
- .github/workflows/deploy-production.yml (build/bundle/run existing P1 content seed
  after migrations and synthetic-user seed, before docker compose up -d; invoke strengthened
  smoke/route gates)
- infra/scripts/smoke-test-production.sh (fail closed on empty journey-situations;
  validate at least one situation detail and one word detail from live identifiers)
- infra/scripts/smoke-test-production.selftest.sh (and/or sibling production functional-gate
  selftests for empty-content rejection, response parsing, route coverage, auth-cookie
  handling, failure behavior)
- scripts/foundation/ or equivalent deterministic tests for production deploy seed
  ordering/bundling and fail-closed seed failure before up -d
- Optional narrowly scoped production route-sweep script under infra/scripts/ if not
  folded into smoke-test-production.sh (VOC-085-DEP-02)
- apps/api/cmd/seed and apps/api/scripts/seed-synthetic-smoke-user.* as reuse/read-confirm
  only (no dataset redesign; no manual live DB edits)
