requirement_source: 'GitHub issue #702 ("Seed canonical P1 content in production and
  gate real learning routes"), including the fully populated issue body. Fresh 2026-08-16
  evidence: promoted revision 62e381575d2585d2f02d69031b8e0119987d3757; read-only
  production database reports journey_situations=0 while staging reports 7; production
  public health and the latest deployment smoke suite are green, so present smoke
  can pass with zero canonical learning content; deploy-staging.yml builds and runs
  the existing idempotent apps/api/cmd/seed P1 content seed after migrations and the
  synthetic account seed, before application convergence; deploy-production.yml bundles
  migrations and the synthetic smoke-user seed but does not bundle or run the canonical
  P1 content seed; production smoke only checks HTTP 200 for /api/v1/journey-situations
  and does not assert a non-empty response, validate situation/word details, or sweep
  real page routes; the synthetic-user SQL already deterministically refreshes onboarding_status=completed.
  Founder/user remediation directive dated 2026-08-16 authorizes issue creation, package
  adoption/implementation, PRs, workflow execution, deployment, live verification,
  remediation, and closure without routine approval. This draft package still does
  not adopt or authorize itself.'
