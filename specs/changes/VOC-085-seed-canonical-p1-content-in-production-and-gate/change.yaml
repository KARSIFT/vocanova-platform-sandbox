production_impact: expected. Production deploy will upsert repository-owned canonical
  P1 content into the production-private database via the existing idempotent seed,
  and production smoke/route gates will fail closed on empty or missing learning content
  and missing authenticated learning routes. No schema migration. No intentional change
  to staging/production isolation, shared-edge topology, or Cloudflare configuration.
  Mis-scoped destructive reseeding or real-user mutation is out of scope and must
  not occur.
