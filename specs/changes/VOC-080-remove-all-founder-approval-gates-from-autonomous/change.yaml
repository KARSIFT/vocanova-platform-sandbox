  \ (R4), docs/governance/a003-transition-state.yaml (R4), docs/operations/15-\u2026\
  \ (DOC-15, R4), scripts/governance/ and/or tooling/governance/ (R4 if tests/lints\
  \ land there), AGENTS.md / CLAUDE.md / specs/templates/ / docs/governance/ (R3),\
  \ and .github/workflows/pipeline.yml (R3). Semantic elevation to R4 is required\
  \ because this package replaces governance authority for autonomous merge, package\
  \ adoption, R4 progression, release, and production-deploy control, and because\
  \ governance replacements cannot authorize their own adoption. Path classifier and\
  \ independent verifier must re-measure each task's real file list.\n"
canonical_path: specs/changes/VOC-080-remove-all-founder-approval-gates-from-autonomous
authority_model: a003-active
requirement_source: 'GitHub issue #627 ("Remove all founder approval gates from autonomous
  engineering workflows"), effective request date 2026-08-15. Founder `m-e-h-r-d-a-a-d`
  directs that VocaNova''s governed engineering system must no longer require founder
  approval under any risk class or workflow condition. Agents and workflows progress
  when deterministic checks, independent verification, scope, and other non-founder
  gates pass. Supersedes the VOC-075 / issue #573 "approve only R4" policy for engineering-workflow
  gates. Does not remove independent verification, CI, risk classification, protected-path
  checks, rollback, secrets isolation, least-privilege credentials, builder/verifier
  separation, or the requirement to ask when product requirements are genuinely ambiguous.
  Transition authority: evaluated under pre-transition (A-003) authority; this package
  cannot authorize its own adoption; one final founder approval under current policy
  is required for the exact transition revision, after which no later founder approval
  gate remains.'
requirement_approval_status: "not-approved \u2014 draft package only; adoption, exact-revision\
  \ transition approval under pre-A-004 authority, and implementation authorization\
  \ remain human decisions."
base_branch: develop
base_sha: unknown - not recorded by this draft; the adopting human/workflow should
  set this to the actual base_sha at adoption time, consistent with recent packages'
  convention.
target_branch: develop
approved_candidate_sha: null
owners:
  decision: unassigned
  package_preparation: planner (drafting only; adoption remains a human decision)
  implementation: unassigned
  independent_verification: unassigned
approval_status: not-approved
implementation_authorized: false
automatic_merge_allowed: false
production_impact: 'expected for governance and automation behavior across this repository
  and KARSIFT/karsift-ai-infra consumers. No direct application-feature change. Removes
  founder `approved`-comment dependence from plan adoption, R4 merge, unparseable-risk
  handling, recovery, release promotion, and residual deploy/retry gates. Failed checks
  remain fail-closed. Production deploy continues to follow push-to-main after auto-promotion;
  residual environment-reviewer or comment gates in repository-controlled paths must
  be removed or neutralized per acceptance criteria.

  '
rollback_required: true
artifacts:
