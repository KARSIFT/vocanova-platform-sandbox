dependencies:
- id: VOC-080-DEP-00
  status: 'resolved at adoption: create A-004 as a successor that supersedes A-003
    only where A-003 (and VOC-075) require founder approval for engineering-workflow
    gates; keep A-003 historical and effective until A-004 activation evidence is
    recorded.

    '
- id: VOC-080-DEP-01
  status: 'resolved at adoption: remove all workflow gates that wait on a founder
    `approved` comment, including product/legal/strategy implementation workflows;
    retain the obligation to ask the founder when product requirements are genuinely
    ambiguous before drafting stable acceptance criteria. That is clarification, not
    approval.

    '
- id: VOC-080-DEP-02
  status: 'resolved at adoption: neutralize `automatic_merge_allowed` as a founder-attention
    mechanism. New packages use true and merge-gate ignores historical false values;
    missing or failed CI/review gates still fail closed.

    '
- id: VOC-080-DEP-03
  status: 'resolved at adoption: land reusable-workflow behavior in karsift-ai-infra
    first, prove on this sandbox, then activate calling-repo policy/docs and remove
    `founder_username` / comment-gate wiring from pipeline.yml. Infra changes are
    specified by this package; PRs land in the infra repository under that repo''s
    process. See specification.md open question 4.

    '
- id: VOC-080-DEP-04
  status: 'resolved at adoption: use this sandbox repository and karsift-ai-infra
    self-ci / smoke harness as the non-production rehearsal; require recorded dry-run
    evidence for adopt, R4 merge, reconcile-dispatch, release, and fail-closed unparseable-risk
    paths before activation task closes. See specification.md open question 5.

    '
- id: VOC-080-DEP-05
  status: 'resolved at adoption: Dependabot and other explicitly recognized dependency
    bots require green deterministic CI and a parseable risk declaration but no founder
    approval. They retain the documented no-agent-authored-code review exception;
    unknown bot identities fail closed for correction.'
- id: VOC-075
  status: 'Adopted predecessor establishing approve-only-R4 drafting. This package
    supersedes that policy for engineering-workflow founder gates per issue #627;
    it does not rewrite VOC-075 historical evidence.

    '
- id: VOC-040
  status: 'Documents the merged-but-unadopted recovery gap (no workflow_dispatch on
    adopt.yml). This package''s reconciliation/dispatch requirement closes that gap
    structurally in karsift-ai-infra rather than relying on gh run rerun alone.

    '
- id: VOC-079
  status: 'Sibling R4 package (issue #624) currently subject to founder-approval architecture;
    acceptance requires it can resume through the post-transition no-founder-approval
    path after VOC-080 activation. Not implemented by this package.

    '
