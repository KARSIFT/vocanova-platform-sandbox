requirement_source: 'GitHub issue #627 ("Remove all founder approval gates from autonomous
  engineering workflows"), effective request date 2026-08-15. Founder `m-e-h-r-d-a-a-d`
  directs that VocaNova''s governed engineering system must no longer require founder
  approval under any risk class or workflow condition. Agents and workflows progress
  when deterministic checks, independent verification, scope, and other non-founder
  gates pass. Supersedes the VOC-075 / issue #573 "approve only R4" policy for engineering-workflow
  gates. Does not remove independent verification, CI, risk classification, protected-path
  checks, rollback, secrets isolation, least-privilege credentials, builder/verifier
  separation, or the requirement to ask when product requirements are genuinely ambiguous.
  Transition authority: evaluated under pre-transition (A-003) authority; this package
  cannot authorize its own adoption. Superseding issue comment #5301333790 explicitly
  revokes the earlier one-time transition-approval clause. Exact-revision independent
  verification and deterministic gates remain required; founder approval does not.'
requirement_approval_status: approved requirement; package adopted automatically after
  exact-revision independent verification
