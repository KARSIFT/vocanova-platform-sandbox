  release_plan: release-plan.md
dependencies:
- id: VOC-080-DEP-00
  status: 'unresolved at drafting time. Amendment vehicle: new A-004 successor vs
    in-place A-003 edit. Recommended default: A-004 that supersedes A-003 only where
    A-003 (and VOC-075) require founder approval for engineering-workflow gates; keep
    A-003 historical and effective until A-004 activation evidence is recorded. See
    specification.md open question 1.

    '
- id: VOC-080-DEP-01
  status: "unresolved at drafting time. Scope of \"no founder approval\" for product/legal/strategy\
    \ R4 *decisions* (pricing, privacy policy, initial public launch go/no-go) versus\
    \ engineering-workflow gates (adopt/merge/release/deploy/retry). Recommended default:\
    \ remove all workflow gates that wait on a founder `approved` comment; retain\
    \ the obligation to ask the founder when product requirements are genuinely ambiguous\
    \ before drafting stable acceptance criteria \u2014 that ask is product clarification,\
    \ not a merge/adopt/release approval gate. See specification.md open question\
    \ 2.\n"
- id: VOC-080-DEP-02
  status: "unresolved at drafting time. Disposition of `automatic_merge_allowed`:\
    \ (a) neutralize so R0\u2013R4 all draft `true` and merge-gate ignores `false`\
    \ as a founder gate; (b) retire the field from new packages and stop reading it\
    \ in merge-gate; (c) keep residual mechanical honor of historical `false` until\
    \ a backfill. Recommended default: (a) with optional historical backfill, matching\
    \ issue #627 \"retire or neutralize \u2026 as a founder-attention mechanism.\"\
    \ See specification.md open question 3.\n"
- id: VOC-080-DEP-03
  status: 'unresolved at drafting time. Cross-repo sequencing for KARSIFT/karsift-ai-infra
    vs this calling repository. Recommended default: land reusable-workflow behavior
    in karsift-ai-infra first (or in lockstep), prove on this sandbox, then activate
    calling-repo policy/docs and remove `founder_username` / comment-gate wiring from
    pipeline.yml. Infra changes are specified by this package; PRs land in the infra
    repository under that repo''s process. See specification.md open question 4.

    '
- id: VOC-080-DEP-04
  status: 'unresolved at drafting time. Rehearsal venue and proof bar before declaring
    the transition effective on VocaNova production consumers. Recommended default:
    use this sandbox repository (and/or karsift-ai-infra self-ci / smoke harness)
    as the non-production rehearsal; require recorded dry-run evidence for adopt,
    R4 merge, reconcile-dispatch, release, and fail-closed unparseable-risk paths
    before activation task closes. See specification.md open question 5.

    '
- id: VOC-075
  status: 'Adopted predecessor establishing approve-only-R4 drafting. This package
    supersedes that policy for engineering-workflow founder gates per issue #627;
    it does not rewrite VOC-075 historical evidence.

    '
- id: VOC-040
  status: 'Documents the merged-but-unadopted recovery gap (no workflow_dispatch on
    adopt.yml). This package''s reconciliation/dispatch requirement closes that gap
    structurally in karsift-ai-infra rather than relying on gh run rerun alone.

    '
- id: VOC-079
  status: 'Sibling R4 package (issue #624) currently subject to founder-approval architecture;
    acceptance requires it can resume through the post-transition no-founder-approval
    path after VOC-080 activation. Not implemented by this package.

    '
