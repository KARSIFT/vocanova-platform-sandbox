production_impact: 'expected for governance and automation behavior across this repository
  and KARSIFT/karsift-ai-infra consumers. No direct application-feature change. Removes
  founder `approved`-comment dependence from plan adoption, R4 merge, unparseable-risk
  handling, recovery, release promotion, and residual deploy/retry gates. Failed checks
  remain fail-closed. Production deploy continues to follow push-to-main after auto-promotion;
  residual environment-reviewer or comment gates in repository-controlled paths must
  be removed or neutralized per acceptance criteria.

  '
