canonical_path: specs/changes/VOC-092-automate-controlled-google-signup-callback-e2e
authority_model: a004-active
requirement_source: 'GitHub issue #769 (Automate controlled Google signup callback
  E2E safely). VOC-088 required two manual Google sign-in checks because automation
  verifies only OAuth start, canonical callback wiring, and controlled_signup_ready.
  The repository needs repeatable E2E coverage of the application-owned OAuth callback
  and controlled-signup policy path without storing or replaying real Google credentials,
  cookies, authorization codes, OAuth state, or identity data. This draft package
  does not adopt or authorize itself.'
requirement_approval_status: approved requirement from issue
base_branch: develop
base_sha: unknown - not recorded by this draft; set at adoption time
target_branch: develop
owners:
  decision: unassigned
  package_preparation: planner (drafting only)
  implementation: unassigned
  independent_verification: unassigned
approval_status: not-approved
implementation_authorized: false
automatic_merge_allowed: true
production_impact: No production signup-policy change. No production secret, database,
  or runtime authentication bypass. Adds repository-managed CI-only and ephemeral
  local E2E coverage using synthetic @synthetic.vocanova.invalid identities and a
  local fake Google OAuth HTTP boundary. Staging and production deploy behavior unchanged
  except documentation and VOC-088 evidence remediation.
rollback_required: true
monitoring_impact:
  state: none
  rationale: 'Adds CI-only OAuth callback E2E coverage without changing infra/monitoring/monitors.yaml
    or infra/monitoring/synthetics.yaml inventory. Existing synthetic.staging.oauth-expected-state
    and its harness verify-staging-oauth-start.sh are retained unchanged per issue
    #769 requirement 6.'
dependencies:
- id: VOC-092-DEP-00
  status: Resolved at drafting time. VOC-088 is merged; staging controlled signup,
    controlled_signup_ready on /healthz, verify-staging-oauth-start.sh, and synthetic.staging.oauth-expected-state
    exist. Human sign-in evidence in VOC-088-T03 confirms allowlisted and unlisted
    outcomes but is not repeatable automation.
- id: VOC-092-DEP-01
  status: Resolved at drafting time. GoogleOAuthProvider supports injectable TokenURL
    and UserInfoURL (apps/api/business/auth/google_oauth.go). Existing httptest-based
    provider tests and auth HTTP tests (auth_test.go, service_test.go) provide patterns.
    FakeOAuthProvider exists for unit tests but does not exercise the real GoogleOAuthProvider
    HTTP boundary or full start-to-callback HTTP path with database persistence.
- id: VOC-092-DEP-02
  status: Resolved at drafting time. Disposable Postgres integration test patterns
    exist (atlas_apply_integration_test.go, repository_postgres_integration_test.go).
    The harness must reuse an ephemeral database and must not connect to staging or
    production databases.
- id: VOC-092-DEP-03
  status: Resolved at drafting time. VOC-088-T02 operational-failure-monitoring.yml
    observes failed CI workflows when wired into the repository CI path. New CI jobs
    must fail closed and surface through existing operational-failure coverage where
    applicable without weakening deduplication or sanitization.
affected_areas:
- apps/api/app/api/ (OAuth start and callback HTTP handlers; integration harness)
- apps/api/business/auth/ (GoogleOAuthProvider boundary; controlled-signup policy)
- infra/scripts/ (optional thin wrapper to run harness locally; no staging bypass)
- .github/workflows/ (CI job wiring for deterministic harness execution)
- scripts/foundation/ (voc092 deterministic structure and redaction tests)
- docs/operations/staging-controlled-signup.md (harness boundary and human audit)
- specs/changes/VOC-088-persist-controlled-staging-oauth-signup-and-auto/t03-evidence.md
  (non-blocking review findings remediation only)
- specs/changes/VOC-092-automate-controlled-google-signup-callback-e2e/
