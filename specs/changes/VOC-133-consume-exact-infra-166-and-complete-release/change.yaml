requirement_source: 'GitHub issue #1061 (Consume exact infra #166 and complete release
  repair after VOC-132 infrastructure failure). VOC-132 was adopted to pin exact infrastructure
  #165 (8ce2b77a09a729e458a9f4cbea1ca26eb114d398). Its first implementation run 33079499176
  produced correct caller work but failed before commit/publication because the implementer
  removed the untracked nested karsift-ai-infra/ checkout and the later shared commit
  step still copied helpers from that deleted directory. No caller branch, PR, or
  completion marker was created. The lifecycle defect is fixed in directly reviewed
  infrastructure PR KARSIFT/karsift-ai-infra#166. Exact independent Terra review failed
  initial head ce86f5d77c733e0e9f30397c167fbd1dfc7c5a8f; remediation landed on reviewed
  PASS head 1488619d0d37aaa179d8e739bfe931881d6c51aa; all 433 policy tests and hosted
  actionlint/shellcheck/YAML checks passed; authoritative merge is f3d79177bf8a9abe0dae550f39502165d494c576.
  VOC-132 cannot silently change its exact pin from #165 to #166. Do not redispatch
  VOC-132-T00 (#1059). Do not manufacture a VOC-132 completion marker. This package
  is the governed replacement authority for consuming #166 directly. The complete
  VOC-112 no-change boundary that must remain byte-identical to the new carrier develop
  base and absent from the implementation diff is: scripts/foundation/fixtures/voc112-navigation-benchmark-traces.json,
  scripts/foundation/fixtures/voc112-skill-discovery-evidence.json, scripts/foundation/voc112-navigation-benchmark.test.mjs,
  AGENTS.md, and .agents/skills/vocanova-repo-navigator/SKILL.md. At current develop
  the JSON subject_revision values remain f9d11e232a07c7d7a9c433d02c9267912543ba10.
  Do not retarget, recapture, or weaken provenance behavior. This draft package does
  not adopt or authorize itself. '
