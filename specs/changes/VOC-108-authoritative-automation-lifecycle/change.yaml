requirement_source: 'GitHub issue #903. During VOC-107, historical failed check runs
  on an exact SHA poisoned later successful evidence, an upstream cross-repository
  closing reference prematurely closed caller task #893, issue closure alone opened
  release state before caller evidence merged, and overlapping release/check paths
  emitted contradictory decisions around promotion PR #902. Required: latest authoritative
  exact-SHA evidence, non-closing cross-repository references, caller-merge-bound
  task completion, one idempotent release merge authority, terminal-check re-evaluation
  without unchanged-SHA CI reruns, and deterministic race fixtures. This draft neither
  adopts nor authorizes itself.'
requirement_approval_status: approved requirement; package adopted automatically after
  exact-revision independent verification
