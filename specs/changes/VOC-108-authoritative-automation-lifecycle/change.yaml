dependencies:
- id: VOC-108-DEP-00
  status: 'resolved at drafting time. Issue #903 records sanitized live observations
    from plan PR #892, caller task #893, and release PR #902 without logs, credentials,
    OAuth material, or user identifiers.'
- id: VOC-108-DEP-01
  status: resolved at drafting time. Current shared adopt.yml aggregates every check
    run attached to the exact head and therefore lets obsolete failures poison later
    successful reruns. Current merge-gate/reuse and release consumers likewise evaluate
    raw or multi-attempt check history instead of selecting one authoritative run
    per logical gate.
- id: VOC-108-DEP-02
  status: resolved at drafting time. Current release.yml derives package completion
    from roster issue CLOSED state; merge-gate explicitly closes the linked issue
    after a caller PR merge, but a cross-repository closing reference can independently
    create the same CLOSED state without caller evidence.
- id: VOC-108-DEP-03
  status: resolved at drafting time. Shared workflow changes land in KARSIFT/karsift-ai-infra
    and callers consume reusable workflows at @main. Caller contract fixtures/evidence
    land here only if required.
