    does not currently receive a time.Time/"now" parameter in scope the way apps/api/business/users/postgres.go's
    CompleteOnboarding does - see specification.md's open question 1 for how each
    call site should source its INSERT-branch timestamp value consistently with its
    existing ON CONFLICT DO UPDATE branch's NOW() usage.
- id: VOC-045-DEP-02
  status: unresolved. Depends on the reviewing human confirming whether a schema-level
    fix (e.g. a DEFAULT now() on created_at/updated_at, closing off this whole class
    of omission at every future call site, not just these two) is in scope for this
    package or deliberately deferred - see specification.md's open question 2. This
    package's primary scope is the two known-broken call sites named in the issue,
    not a schema migration, unless the reviewing human decides otherwise at adoption.
