schema_version: 1
id: VOC-045
slug: user-settings-upsert-omits-created-at-updated-at
title: user_settings Upsert Omits created_at/updated_at from the INSERT Branch, Violating
  NOT NULL and Blocking Every New User's Onboarding
type: fix
status: draft
risk: R3
canonical_path: specs/changes/VOC-045-user-settings-upsert-omits-created-at-updated-at
planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real, task-scoped file list - consistent with how VOC-039/VOC-040/VOC-041/VOC-042/VOC-043
  handled this field. This package proposes R3 because the confirmed defect fully
  blocks every genuinely new real user from completing onboarding in production (a
  hard outage of the core signup path, not a degraded edge case), and the fix touches
  two separate upsert call sites against a NOT NULL-constrained table (apps/api/business/users/postgres.go
  and apps/api/business/gamification/repository.go) without itself requiring a schema
  migration. This is a draft proposal for the reviewing human at adoption time, not
  a determination.
authority_model: a003-active
requirement_source: 'GitHub issue #341 ("user_settings upsert omits created_at/updated_at
  from the INSERT branch, violating NOT NULL and blocking every new user''s onboarding"),
  including its full body (the only content on the issue at drafting time - no comments
  existed yet). The issue documents a live production reproduction (a real, brand-new
  user, first-ever sign-in, no prior user_settings row, submitting the onboarding
  form and receiving a 400, with the exact underlying Postgres error text: `pq: null
  value in column "created_at" of relation "user_settings" violates not-null constraint`),
  cites the schema (apps/api/migrations/20260725130000_voc030_p4_user_settings.sql,
  created_at/updated_at both NOT NULL with no DEFAULT), names both affected call sites
  with their exact SQL (apps/api/business/users/postgres.go''s CompleteOnboarding
  and apps/api/business/gamification/repository.go''s UpsertUserSettings), explains
  why onboarding is the first code path to exercise a genuine INSERT rather than the
  ON CONFLICT UPDATE branch, and proposes a fix (add created_at/updated_at to both
  INSERT column lists and VALUES) plus a suggested regression-test approach.'
requirement_approval_status: 'Not approved. This package is an unreviewed draft prepared
  by the planner role in response to issue #341; no founder or technical-steward adoption
  decision has been recorded. See owners and approval_status below.'
