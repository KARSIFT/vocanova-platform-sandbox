approval_status: adopted
implementation_authorized: true
automatic_merge_allowed: false
production_impact: unknown until adopted and implemented. T01 (apps/web Sentry wiring)
  has direct but additive/non-destructive production_impact once a real DSN secret
  exists (browser error events start flowing to Sentry; no user-facing behavior changes).
  T02-T04 (the scheduled workflow) have no production *application* impact - they
  only read Sentry and open GitHub issues - but do introduce a new scheduled CI/CD
  process with its own secret, which is itself a protected-area effect per docs/governance/change-risk-classification.md's
  R3 "CI/CD" category regardless of application-layer impact.
rollback_required: true
