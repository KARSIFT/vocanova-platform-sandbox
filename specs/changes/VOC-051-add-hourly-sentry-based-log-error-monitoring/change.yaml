schema_version: 1
id: VOC-051
slug: add-hourly-sentry-based-log-error-monitoring
title: Add Hourly Sentry-Based Log/Error Monitoring Agent That Files Issues on New
  Production/Staging Problems
type: feature
status: adopted
risk: R3
planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real task-scoped file list. This package proposes R3 for the change as
  a whole because it touches production infrastructure/secrets and CI/CD (a new Sentry
  API auth token secret, a new scheduled GitHub Actions workflow that reads production/staging
  Sentry data and calls the GitHub API to open issues), both squarely inside docs/governance/change-risk-classification.md's
  R3 categories ("secrets", "CI/CD, rollback, security, governance enforcement, or
  agent authority"). apps/web's new Sentry wiring (T01) is closer to R2 in isolation
  (additive, non-destructive, mirrors an existing apps/api pattern) but this package
  proposes the higher R3 floor for the package as a whole per docs/governance/change-risk-classification.md's
  "splitting a change does not lower the classification if the parts produce one combined
  consequence" rule, since the monitoring workflow and the web-side DSN it needs to
  be useful are one combined observability outcome. This is a draft proposal for the
  reviewing human at adoption time, not a determination.
canonical_path: specs/changes/VOC-051-add-hourly-sentry-based-log-error-monitoring
authority_model: a003-active
requirement_source: 'GitHub issue #392 ("Add hourly Sentry-based log/error monitoring
  agent that files issues on new production/staging problems"). The issue itself cites
  docs/operations/11-devops-and-ci-cd.md (DOC-11) section 1''s "Error monitoring |
  Sentry" row and its "Separate ... Sentry environments per environment tier" sentence
  as the existing authority for Sentry being the project''s chosen error-monitoring
  tool; this package proposes the concrete mechanism (a scheduled workflow polling
  the Sentry API) as new scope DOC-11 does not itself specify.'
requirement_approval_status: 'Approved. Founder-delegate (acting under the standing
  founder-gate delegation for vocanova-platform-sandbox, confirmed explicitly this same
  session) adopted this draft package via PR #393/#397 on 2026-08-08, mirroring
  VOC-039/040/041/042/043/044/045/046/049''s convention. (PR #393 originally merged
  this draft in unauthorized-draft state by mistake, also under the wrong ID VOC-050
  which collided with PR #394 - see karsift-ai-infra issue #20 - and was reverted via
  PR #395; this replacement PR carries the same content, correctly numbered VOC-051,
  with adoption fields flipped before merge this time.)'
base_branch: develop
base_sha: 50b5ba917edd40f9ce6f61c1849969dcc4d8fef4
