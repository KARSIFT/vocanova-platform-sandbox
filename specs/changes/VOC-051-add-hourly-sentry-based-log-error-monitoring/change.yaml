blocking_reasons: Not adopted. Requires founder/steward review of the proposed R3
  classification, specification.md's open questions (GitHub API identity for issue-filing,
  exact Sentry token scope, and whether a Sentry organization/plan actually supports
  the additional apps/web project and read-only org token), and confirmation that
  scripts/governance/classify-change-risk.sh's actual detected floor for the real
  task-scoped file list is not higher than the R3 proposed here.
