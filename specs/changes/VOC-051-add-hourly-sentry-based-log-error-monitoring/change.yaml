  test_plan: test-plan.md
  release_plan: release-plan.md
dependencies:
- id: VOC-051-DEP-00
  status: unresolved at drafting time. This package assumes a Sentry organization
    and project(s) already exist for apps/api (confirmed live - apps/api/go.mod already
    depends on github.com/getsentry/sentry-go v0.48.0 and apps/api/app/api/production.go
    already reads SENTRY_DSN) and that the same Sentry organization can host an apps/web
    project and issue an org-scoped read-only API auth token. Whether the founder's
    existing Sentry plan/tier supports an additional project and a read-only org auth
    token (some Sentry plans gate API-token scopes or project counts) is not verified
    by this drafting pass and must be confirmed before T01/T02 begin.
- id: VOC-051-DEP-01
  status: unresolved at drafting time. Depends on the reviewing human deciding the
    exact GitHub API identity the new scheduled workflow uses to open issues (GITHUB_TOKEN
    scoped to the default workflow permissions, a repository-scoped PAT, or a GitHub
    App installation token like the one karsift-ai-infra's adopt.yml already uses
    via `steps.app-token.outputs.token`) - see specification.md's open questions.
- id: VOC-051-DEP-02
  status: unresolved at drafting time. Depends on the reviewing human confirming the
    Sentry API auth token's exact required scope (read-only issue/event access across
    both the staging and production Sentry environments/projects) against what Sentry's
    own token-scope model actually offers, since Sentry's org-auth-token scopes are
    coarser-grained than "read-only for two specific environments only" - see specification.md's
    open questions.
