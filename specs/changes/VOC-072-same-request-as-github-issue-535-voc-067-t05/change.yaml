planned_implementation_risk_floor: "Not yet computed by running scripts/governance/classify-change-risk.sh\
  \ against a real task-scoped file list. Expected in-scope paths include .github/workflows/deploy-production.yml\
  \ (R3 path floor), infra/scripts/* and infra/README.md (R3 via infra/*), and GitHub\
  \ production-environment secret configuration (production infrastructure \u2014\
  \ human ops, not a git path). This package proposes R3 for the change as a whole\
  \ because it wires production Cloudflare zone/Origin-Rules API access for an already-adopted\
  \ cutover path (VOC-067-DEP-03 / VOC-067-T05) without revisiting the shared-edge\
  \ architecture decision (R4, already founder-approved in VOC-067). It does not broaden\
  \ application auth, schema, or governance authority. This is a draft proposal for\
  \ the reviewing human at adoption time, not a determination.\n"
canonical_path: specs/changes/VOC-072-same-request-as-github-issue-535-voc-067-t05
authority_model: a003-active
requirement_source: "GitHub issue #535 (\"VOC-067-T05 Cloudflare cutover blocked because\
  \ PRODUCTION_CLOUDFLARE_API_TOKEN cannot read the vocanova.site zone\"), opened\
  \ after a failing deploy-production.yml voc067-cloudflare-cutover job run. The existing\
  \ PRODUCTION_CLOUDFLARE_API_TOKEN is scoped for Cloudflare Workers AI secret sync\
  \ (deploy-production.yml AI-provider injection using PRODUCTION_CLOUDFLARE_API_TOKEN\
  \ and PRODUCTION_CLOUDFLARE_ACCOUNT_ID), not Zone or Origin Rules management. Live\
  \ cutover tooling (infra/scripts/cloudflare-remove-production-origin-port-remap.sh,\
  \ resolve_zone_id via GET /zones?name=vocanova.site) fails because the token returns\
  \ an empty zone list \u2014 interpreted as \"zone not found\" \u2014 blocking VOC-067-TEST-06\
  \ and leaving VOC-067-EV-05 cloudflare_remap_api_status at unconfirmed. A human\
  \ with Cloudflare dashboard access must create an API token with Zone:Read and Origin\
  \ Rules:Edit for the vocanova.site zone, store it as a GitHub production-environment\
  \ secret (either by safely broadening PRODUCTION_CLOUDFLARE_API_TOKEN or adding\
  \ a dedicated secret), and wire deploy-production.yml's voc067-cloudflare-cutover\
  \ job (and the apply-after-smoke step) to use the zone-capable credential.\n"
requirement_approval_status: Approved. Founder-delegate (acting under the standing
  founder-gate delegation for vocanova-platform-sandbox, and the founder's explicit
  2026-08-12 trip authorization for infra fix work) adopted this draft package on
