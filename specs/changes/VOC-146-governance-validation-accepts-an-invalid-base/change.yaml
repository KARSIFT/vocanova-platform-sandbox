planned_implementation_risk_floor: 'R4. This package repairs governance validation
  so an unresolved --base/--head commit or invalid diff range returns nonzero before
  the wrapper claims success, and applies the same status-preserving range loading
  to classify-change-risk.sh, which uses the identical mapfile process-substitution
  pattern. scripts/governance/* is an R4 path floor. AGENTS.md is an R3 floor. Semantic
  mutation of fail-closed pull-request range metadata is protected. This is a draft
  proposal for human adoption review, not a determination. The path classifier and
  independent verifier remain authoritative.

  '
canonical_path: specs/changes/VOC-146-governance-validation-accepts-an-invalid-base
authority_model: a004-active
requirement_source: 'GitHub issue #1127 (Governance validation accepts an invalid
  base/head range), including its original body. scripts/governance/validate-governance.sh
  reports success when --base or --head names a nonexistent commit. From clean commit
  79b2b3f1f4224235bdda3f77ee887c3004978deb, invoking validate-governance.sh with --base
  376e00dd769afb0fe850052b3a5cb48f729e73ad --head 79b2b3f1f4224235bdda3f77ee887c3004978deb
  emits fatal: Invalid symmetric difference expression and then Governance structure
  validation passed. with exit status 0. Root cause: scripts/governance/validate-monitoring-impact.sh
  loads changed files with mapfile -t files < <(git diff --no-renames --name-only
  --diff-filter=ACDMRTUXB "$base...$head"); the failing git diff runs inside process
  substitution and its nonzero status is not propagated through mapfile, even under
  set -euo pipefail, so the empty file list is accepted. The same mapfile process-substitution
  pattern exists in scripts/governance/classify-change-risk.sh. Suggested bounded
  fix: resolve both revisions explicitly and capture git diff through a status-preserving
  path before loading its output; add deterministic negative tests for missing base,
  missing head, and unrelated/no-merge-base revisions, while preserving valid PR and
  --files-from behavior. Discovered during local exact-range verification of emergency
  PR #1126; unrelated to that PR''s VOC-112 provenance objective. This draft package
  does not adopt or authorize itself.

  '
requirement_approval_status: approved requirement; package adopted automatically after
  exact-revision independent verification
