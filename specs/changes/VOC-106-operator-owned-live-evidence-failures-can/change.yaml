planned_implementation_risk_floor: Measured during drafting against the expected task-scoped
  file list (KARSIFT/karsift-ai-infra/.github/workflows/remediate.yml, config/decide-remediation.py,
  related helpers/tests and README; calling-repo .github/workflows/pipeline.yml proof
  action; docs/operations/live-evidence.md ownership-gated remediation guidance;
  scripts/foundation/voc106-*.test.mjs and/or infra self-ci fixtures; this package
  directory). Detected path floor is R3 for .github/workflows/ and governance-automation
  paths. This package proposes R3 for the change as a whole because it changes semantic
  CI/CD remediation dispatch. Independent verification must still confirm each task's
  real file list and whether further semantic escalation applies. This is a draft
  proposal for the reviewing human at adoption time, never a determination.
canonical_path: specs/changes/VOC-106-operator-owned-live-evidence-failures-can
authority_model: a004-active
requirement_source: 'GitHub issue #882 (Operator-owned live-evidence failures can
  dispatch the general implementer). During supervised completion of VOC-104-T01,
  a documentation-only edit after live-evidence reconciliation invalidated the exact-head
  attestation. Independent review correctly failed closed, but the remediation path
  then selected the general implementer even though the adopted task contract declares
  ownership operator and the task explicitly excludes code implementation. Cancelled
  workflow 32529860337 on carrier PR #879; branch head remained unchanged. Drafting-time
  read of karsift-ai-infra config/decide-remediation.py confirms RETRY on CI failure
  or review FAIL without consulting .karsift/live-evidence/<task_id>.yaml ownership.
  WAITING is already suppressed; genuine FAIL on the same operator-owned carrier can
  still become an implementation retry. This draft package does not adopt or authorize
  itself.'
requirement_approval_status: not-approved. This package has not been adopted. No field
  in this file authorizes implementation.
base_branch: develop
base_sha: unknown - not recorded by this draft; set at adoption time
target_branch: develop
