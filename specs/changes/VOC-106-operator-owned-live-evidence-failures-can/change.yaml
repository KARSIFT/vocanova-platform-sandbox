  decision: unassigned
  package_preparation: planner (drafting only; adoption remains a human decision)
  implementation: unassigned
  independent_verification: unassigned
approval_status: not-approved
implementation_authorized: false
automatic_merge_allowed: true
production_impact: none-intentional for application runtime. Changes governance automation
  so remediation never dispatches the general implementer for operator-owned or live-evidence-only
  tasks, regardless of review FAIL, CI failure, or stale/malformed/mismatched live-evidence
  state. Does not change production deploy semantics, signup policy, secrets, databases,
  Kuma inventory, or Sentry ingestion.
rollback_required: true
monitoring_impact:
  state: none
  rationale: Governance-automation remediation ownership gating only. No page routes,
    critical API endpoints, or stable monitor/synthetic IDs in infra/monitoring/monitors.yaml
    or infra/monitoring/synthetics.yaml are added or changed. Live-evidence waiting
    and operational-failure observer remain separate mechanisms.
dependencies:
- id: VOC-106-DEP-00
  status: 'resolved at drafting time. Issue #882 records sanitized observation that
    remediation selected the general implementer for operator-owned VOC-104-T01 after
    an exact-head FAIL (carrier PR #879; cancelled workflow 32529860337). Manual cancel
    prevented branch mutation.'
- id: VOC-106-DEP-01
  status: resolved at drafting time. VOC-097 established operator-owned live-evidence
    contracts at <package>/.karsift/live-evidence/<task_id>.yaml with ownership operator
    or live-actions. VOC-102 gated auto-advance before implementer dispatch. Remediation
    (remediate.yml / decide-remediation.py) still decides RETRY from CI/review state
    and PR-body task identity without independently resolving that contract.
- id: VOC-106-DEP-02
  status: "resolved at drafting time. Cross-repo pattern from VOC-080 / VOC-097 /\
    \ VOC-102 \u2014 reusable workflow behavior lands in KARSIFT/karsift-ai-infra;\
    \ this package authorizes the required outcome. Do not treat an untracked local\
    \ karsift-ai-infra/ checkout as this repository's tracked tree."
- id: VOC-106-DEP-03
  status: resolved at drafting time. WAITING FOR OPERATOR LIVE EVIDENCE already suppresses
    remediation retry. The retry gap is genuine FAIL and CI failure on the same
    operator-owned carrier, which must escalate without consuming an implementation
    attempt. Stale results remain a no-op; malformed or mismatched ownership metadata
    follows the separate fail-closed path.
- id: VOC-097
  status: Adopted predecessor. Ownership contract path, waiting semantics, and reconcile
    path must remain authoritative; this package must not weaken them or grant implementer
    Actions credentials.
- id: VOC-102
  status: Adopted predecessor that gated auto-advance. This package closes the parallel
    remediation gap; it does not reopen VOC-102 code work.
- id: VOC-104
  status: Adopted predecessor whose supervised T01 completion exhibited the bug (sanitized
    incident evidence only). This package does not reopen VOC-104 code work.
