requirement_source: 'GitHub issue #1122 (Roster reconciliation resolves carrier before
  pushed PR head metadata converges), including its original body. Documented pipeline.yml
  reconciliation for merged plan PR #1110 cannot reuse the existing deterministic
  roster PR #1112 after VOC-142. The adopt job pushes a new exact commit to karsift/roster-voc-141,
  then immediately fails in Open roster PR with MISMATCHED_OPEN_CARRIER. After the
  job fails, PR #1112 exposes the just-pushed head and the same resolver returns reuse_open.
  Live reproduction in KARSIFT/vocanova-platform-sandbox: reconcile run 33437239322
  pushed head 958e0fedf742173320bb89cfe690ec7070b49e93 then failed MISMATCHED_OPEN_CARRIER;
  afterward PR #1112 exposed that head. Idempotent retry run 33437514152 pushed head
  0206cb70437cb751a19a2e715d8202b672060b50 then failed the same way; afterward PR
  #1112 exposed that new head. Root cause: karsift-ai-infra adopt.yml runs Push roster
  branch then invokes roster-carrier-runner.py without a bounded metadata-convergence
  wait. The resolver is correctly fail-closed for a stable mismatch, but the caller
  does not distinguish transient post-push PR-head lag from a durable identity mismatch.
  No roster PR was manually merged, closed, recreated, or bypassed; #1112 remains
  the single exact VOC-141 carrier. This draft package does not adopt or authorize
  itself.

  '
requirement_approval_status: issue-sourced requirement; this draft package is not
