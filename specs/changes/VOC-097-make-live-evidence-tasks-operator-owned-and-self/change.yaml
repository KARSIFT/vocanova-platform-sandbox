requirement_source: 'GitHub issue #823 (Make live-evidence tasks operator-owned and
  self-reconciling). Evidence-only tasks that require a live GitHub Actions run become
  permanently stranded: the implementer lacks Actions API credentials, independent
  review correctly rejects pending evidence, and remediation then treats missing operator
  evidence as a code defect, consumes bounded retries, and may introduce unrelated
  pipeline or task-specific workflow changes. Observed examples: PR #765 / task #762;
  PR #789 / task #779 (VOC-093-T01); PR #791 / task #785 (VOC-094-T01). This draft
  package does not adopt or authorize itself.'
requirement_approval_status: approved requirement; package adopted automatically after
  exact-revision independent verification
