  rationale: "Governance-automation observability only. Lifecycle signals are boolean/state/count-style\
    \ workflow outputs and sanitized run/job identifiers inside the governed task\
    \ path \u2014 not application alerts and not new or changed entries in infra/monitoring/monitors.yaml\
    \ or infra/monitoring/synthetics.yaml. Operational-failure observer and Sentry\
    \ ingestion remain separate mechanisms and must not be merged with live-evidence\
    \ waiting/reconcile signals."
