production_impact: none-intentional for application runtime. Changes governance automation
  lifecycle for operator-owned live-evidence tasks across this repository and karsift-ai-infra
  consumers. Does not change production deploy semantics, signup policy, secrets,
  databases, Kuma inventory, or Sentry ingestion. Preserve existing risk classification,
  exact-SHA review, branch protection, App-authenticated mutations, deployment isolation,
  and release behavior.
rollback_required: true
monitoring_impact:
