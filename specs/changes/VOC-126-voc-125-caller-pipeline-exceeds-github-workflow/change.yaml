automatic_merge_allowed: true
production_impact: 'none-intentional for application runtime. This package repairs
  the caller and project-repo workflow_dispatch contracts so GitHub will accept the
  VOC-125 existing_pr_number operator interface without deleting an active recovery
  or verifier capability. It does not change product behavior, deployment topology,
  secret values, providers, or monitor inventory. Restoring a valid caller route may
  allow the already-authorized VOC-122-T00 carrier to be resumed through existing
  gates; that is not a new deploy path.

  '
rollback_required: true
monitoring_impact:
  state: none
  rationale: 'KARSIFT caller workflow_dispatch input-limit repair only. No page routes,
    critical API endpoints, monitor inventory, or synthetic inventory in infra/monitoring/
    are added or changed.

    '
dependencies:
- id: VOC-126-DEP-00
  status: 'resolved at drafting time. Issue #1025 provides the live definition failure,
    exact PR/SHA/run IDs, GitHub 25-input annotation, root cause (VOC-125 added existing_pr_number
    without an input-count regression), the prohibition on silently dropping an unrelated
    dispatch input, the consumed VOC-125 retry budget, the instruction to update the
    authoritative template and source tests first, the requirement to supersede unusable
    PR #1024 rather than retry it, the VOC-125 #1022/#1020 and VOC-122 #1003/#1012
    handoff, suggested design space (dedicated read-only verifier workflow versus
    a fail-closed structured interface), Cursor Composer / Cursor Grok preservation,
    no-OpenAI constraint, and one-task preference with enough specificity to draft
    without a clarifying round trip.

    '
- id: VOC-126-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative: no founder
    approved-comment gate on engineering-workflow adopt/merge/release paths; exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    and fail-closed behavior remain mandatory.

    '
- id: VOC-126-DEP-02
  status: 'resolved at drafting time by reading the live caller and the VOC-125 source
    template. Live .github/workflows/pipeline.yml currently has 25 workflow_dispatch
    inputs and does not yet declare existing_pr_number. karsift-ai-infra/templates/project-repo/.github/workflows/pipeline.yml
    at infrastructure merge 1f1705dbad41729563b0ad1e878e4154e5511e93 declares existing_pr_number
    plus the prior 25 interfaces (26 total). GitHub rejects any workflow_dispatch
    block with more than 25 inputs before jobs start. implement.yml@main already declares
    existing_pr_number from that same merge and must keep doing so. Local fixture/governance/foundation
    suites do not currently assert the 25-input maximum.

    '
- id: VOC-126-DEP-03
  status: 'resolved at drafting time as the chosen design. Relocate the coherent read-only
    verifier dispatch surface (verify-auto-advance-live-evidence, verify-ready-for-review-reuse,
    verify-remediate-operator-ownership, verify-promotion-check-recovery, verify-post-promotion-workflow
    and their dedicated inputs) into a dedicated caller workflow. Keep plan, implement,
    reconcile, reconcile-release, reconcile-live-evidence, recover-integration-push,
    and recover-promotion-pr-checks on pipeline.yml, including existing_pr_number
    on implement. Do not replace named verifier scalars with unstructured JSON in
    this package: GitHub does not schema-validate JSON inputs, and a packed interface
    would add a new fail-closed parser without recovering first-class named-input
    coverage already tested. Do not silently drop an input.

    '
- id: VOC-126-DEP-04
  status: 'resolved at drafting time as an accepted delivery constraint: coordinated
    PRs in the caller and KARSIFT/karsift-ai-infra remain one task. Repository count,
    workflow-versus-tests-versus-docs, and fixture/pin work are not split reasons.
    Merge the independently reviewed infra PR first so the project-repo template is
    GitHub-valid and declares existing_pr_number under the 25-input limit before the
    caller consumes it, then pin the caller fixture to that exact merge SHA when consumed.

    '
- id: VOC-126-DEP-05
  status: 'resolved at drafting time as a hard dependency that must not expand this
    package into a replacement VOC-122 roster or a third VOC-125 attempt. Adopted
    VOC-125-T00 (#1022) consumed its final allowed retry remediating the source carrier;
    caller PR #1024 is unusable because GitHub rejects its workflow definition. Adopted
    VOC-122-T00 (#1003) and draft caller PR #1012 remain the only valid authority/carrier
    for that distinct outcome. This package must not implement VOC-122 promotion-recovery
    replan behavior, must not merge #1024 or #1012, must not create a replacement
    VOC-122 task or PR, and must not dispatch VOC-125-T00 as attempt 3. After this
    package''s exact reviewed infra merge and caller dispatch are live, supersede
    #1024, close VOC-125 #1022/#1020 only when the live caller route is valid, then
    resume existing #1003 / #1012 at attempt 2 with existing_pr_number=1012.

    '
- id: VOC-126-DEP-06
  status: 'resolved at drafting time. Configured Cursor Composer remains the implementer
    and Cursor Grok remains the exact-revision independent reviewer. No OpenAI credential
    or execution route is needed or authorized. Do not print credential values. No
    bootstrap exception: VOC-124 already requested permission-workflows: write on
    publish-source. T00''s first run is attempt 1 on a new VOC-126 carrier.

    '
- id: VOC-126-DEP-07
  status: 'open at drafting time as an implementer-facing naming choice, not a planner
    guess past the required behavior. Preferred dedicated workflow file name is pipeline-verify.yml
    in both the infrastructure project-repo template and the live caller .github/workflows/
    directory. An equivalent name is acceptable if tests, current-state comments,
    and operator dispatch commands use that exact identity. Constraints that are not
    open: the relocated surface is the five read-only verifier jobs listed in VOC-126-DEP-03;
    recover-integration-push and recover-promotion-pr-checks stay on pipeline.yml
    because they mutate; every workflow_dispatch block remains at most 25 inputs;
    existing_pr_number stays on pipeline.yml implement; named verifier inputs are
    preserved rather than packed into JSON; live_evidence_mode versus live_evidence_dispatch
    drift between live caller and template is not a drive-by normalization unless
    one of those files must change for the relocation.

    '
