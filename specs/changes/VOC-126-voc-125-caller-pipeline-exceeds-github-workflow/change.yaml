slug: voc-125-caller-pipeline-exceeds-github-workflow
title: VOC-125 caller pipeline exceeds GitHub workflow_dispatch input limit
type: infrastructure
status: draft
risk: R4
planned_implementation_risk_floor: 'R4. This package changes the protected caller
  dispatch contract and the KARSIFT/karsift-ai-infra project-repo pipeline template
  so every live workflow_dispatch block stays within GitHub''s 25-input limit while
  preserving VOC-125 existing_pr_number and all existing recovery/verifier capabilities.
  tooling/governance/* is an R4 path floor; .github/workflows/* is an R3 floor; semantic
  mutation of operator implement-resume identity and read-only verifier dispatch routing
  is protected. This is a draft proposal for human adoption review, not a determination;
  the path classifier and independent verifier remain authoritative.

  '
canonical_path: specs/changes/VOC-126-voc-125-caller-pipeline-exceeds-github-workflow
authority_model: a004-active
requirement_source: "GitHub issue #1025 (VOC-125 caller pipeline exceeds GitHub workflow_dispatch\
  \ input limit). Live 2026-08-26 definition failure on adopted VOC-125 caller PR\
  \ #1024 exact head 8621f12dd466edab37fddb86d4e5e0a348ed3609 after authoritative\
  \ infrastructure PR KARSIFT/karsift-ai-infra#160 merged as 1f1705dbad41729563b0ad1e878e4154e5511e93.\
  \ Actions run 32977045898 terminates with no jobs or logs. Authenticated annotation:\
  \ Invalid workflow file: .github/workflows/pipeline.yml#L1 \u2014 you may only define\
  \ up to 25 inputs for a workflow_dispatch event. Draft/ready retriggering on the\
  \ same SHA produces no pipeline run. Root cause: VOC-125 correctly added existing_pr_number,\
  \ but the source template and tests omitted GitHub's maximum input count, so the\
  \ 26-input project-repo pipeline is invalid whenever all existing dispatch interfaces\
  \ are present. VOC-125's final allowed implementation retry is already consumed;\
  \ PR #1024 cannot enter exact-revision pipeline review. Required: one fail-closed\
  \ governed repair that preserves existing_pr_number and every active recovery/verifier\
  \ capability, relocates the coherent read-only verifier dispatch surface so every\
  \ live workflow_dispatch block has at most 25 inputs, adds an explicit maximum-input-count\
  \ regression, merges the independently reviewed source repair first, then updates\
  \ the caller workflow/fixture/pin/tests/docs to that exact merge, supersedes #1024\
  \ without merging it, closes VOC-125 #1022/#1020 only after the live caller route\
  \ is valid, and resumes existing VOC-122 #1003/#1012 through the repaired route.\
  \ This draft package does not adopt or authorize itself.\n"
requirement_approval_status: 'requirement stated by GitHub issue #1025; this draft
  package is not adopted and is not implementation-authorized '
