requirement_source: 'GitHub issue #1052 (Replacement release blocker: consume infra
  #165 without rewriting VOC-112 evidence). Governed VOC-130-T00 (#1049) exhausted
  both attempts without merging. Unmerged carrier PR #1051 correctly implemented the
  exact infrastructure #165 pin and release fixture, but both reviewed heads retained
  two unrelated VOC-112 evidence retargets. Attempt 1 reviewed head a04a41a19176d1322faee1a3365d82153d61af1b
  (PR #1051 comment 5438961796). Attempt 2 claimed those retargets were reverted,
  while exact head e846cc2f62556c2d6616282f2e9c4929c00655e7 still contained them (PR
  #1051 comment 5439141140). Durable exhaustion marker: issue #1049 comment 5439143793.
  Independent exact-SHA review therefore failed closed twice. This replacement is
  the same still-unfinished release-repair outcome and must not reopen or reimplement
  infrastructure #165. Authoritative infra PR KARSIFT/karsift-ai-infra#165, independently
  reviewed exact head e33931d02f7bdbb094ae8177fd88324cd19ac5ce, exact infrastructure
  merge 8ce2b77a09a729e458a9f4cbea1ca26eb114d398. Original live release failure: run
  33066533397, where caller root checkout deleted nested shared lifecycle policy before
  task-completion-runner.py. The two out-of-scope files must remain byte-for-byte
  identical to the new carrier''s develop base: scripts/foundation/fixtures/voc112-navigation-benchmark-traces.json
  and scripts/foundation/fixtures/voc112-skill-discovery-evidence.json. At current
  develop their subject_revision values remain f9d11e232a07c7d7a9c433d02c9267912543ba10.
  Do not retarget or recapture them. The implementation PR diff must not contain either
  path. This draft package does not adopt or authorize itself.

  '
