requirement_source: 'GitHub issue #1047 (Release blocker: caller checkout deletes
  shared lifecycle

  policy before completion validation). Live VOC-129 task-completion wake-up

  after caller PR #1046 merged as 429d8c6d49303148ca1cc14dba5f6768a7863346

  produced failing/no-op release run

  https://github.com/KARSIFT/vocanova-platform-sandbox/actions/runs/33066533397.

  identify selected develop, then actions/checkout checked out the caller at

  the workspace root, cleaning the nested karsift-ai-infra checkout. The next

  command failed because karsift-ai-infra/config/task-completion-runner.py no

  longer existed. release treated the missing validator as a safe no-op, so no

  release audit or promotion was created. converge had the same latent

  checkout-lifetime defect. Authoritative infrastructure repair is

  KARSIFT/karsift-ai-infra PR #165, independently reviewed exact head

  e33931d02f7bdbb094ae8177fd88324cd19ac5ce, exact infrastructure merge

  8ce2b77a09a729e458a9f4cbea1ca26eb114d398, with 429 policy tests plus hosted

  actionlint, shellcheck, YAML parsing, and policy checks. Required caller

  outcome: one largest-safe coherent VOC package with one end-to-end

  implementation task; pin

  tooling/governance/fixtures/karsift-ai-infra/PINNED_SHA.txt exactly to

  8ce2b77a09a729e458a9f4cbea1ca26eb114d398; mirror the exact #165 release

  workflow and update fixture/foundation pin assertions, tests, docs, and task

  evidence; add deterministic coverage proving both identify and converge

  restore the exact shared-policy revision after caller checkout and before

  task-completion helpers; preserve the #164 missing-develop recovery, branch

  exact-SHA synchronization, unique-develop fail-closed behavior, promotion

  checks, release serialization, review/implementer separation, retry bounds,

  roles, and secret/raw-error controls; do not add OpenAI execution or request

  OPENAI_API_KEY; merge only after required checks and independent

  exact-revision review; complete final develop-to-main promotion, exact

  develop synchronization, production deployment where selected,

  release/task/requirement closure, and audit reconciliation for VOC-129 and

  this blocker. This draft package does not adopt or authorize itself.

  '
