requirement_source: 'GitHub issue #920 (Skip full staging deploys for documentation
  and evidence-only pushes). deploy-staging.yml currently runs the complete image-build,
  registry-push, SSH deploy, public probe, OAuth check, and authenticated browser
  journey on every push to develop, including plan-only merge 86df6779, roster-only
  merge 60822aa5, and evidence-only merge PR #917 (run 32572863842, ~3m39s with unchanged
  runtime inputs). Required outcome: docs/package/evidence-only pushes must not start
  full staging deployment; runtime/deployment-relevant changes must remain fail-closed
  selected; workflow_dispatch unchanged; staging host semantics unchanged; add deterministic
  positive and negative selector tests; update stale near-no-op documentation; live
  proof of one skipped docs/evidence push and one runtime-selected case. This draft
  package does not adopt or authorize itself.

  '
requirement_approval_status: 'not-approved. This package has not been adopted. No
  field in this file authorizes implementation.

  '
