requirement_source: 'GitHub issue #792 (Harden Playwright setup against hosted-runner
  apt mirror stalls). Fresh 2026-08-19 evidence from deploy-staging run https://github.com/KARSIFT/vocanova-platform-sandbox/actions/runs/32299315180
  (attempts 1 and 2): application convergence completed but the workflow was cancelled
  at the job timeout while `playwright install --with-deps chromium` waited on the
  hosted Ubuntu package mirror. A separate accessibility attempt hit the same transient;
  an exact-SHA rerun succeeded. Drafting-time repo read: four workflows invoke inline
  `playwright install --with-deps chromium` (accessibility.yml, lighthouse.yml, deploy-staging.yml,
  scheduled-synthetics.yml); only scheduled-synthetics.yml already restores ~/.cache/ms-playwright
  before install. This draft package does not adopt or authorize itself.'
