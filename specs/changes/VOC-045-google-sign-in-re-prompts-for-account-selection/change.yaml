requirement_source: 'GitHub issue #343 ("Google sign-in re-prompts for account selection/consent
  on every sign-in instead of remembering an active session"), reporting founder feedback
  from VOC-038-T03''s live core-loop validation on 2026-08-07: every Google sign-in
  shows the account picker/consent screen again, even when there is no reason to expect
  it (not signed out, same browser/session). The issue is explicitly marked not urgent
  - the founder is not blocked and asked only that it be recorded for future work.
  The issue itself names likely areas to investigate: whether apps/api/business/auth/service.go''s
  OAuthStart builds the Google authorization URL with an unconditional prompt parameter,
  and whether the app''s own session (SESSION_LIFETIME=720h per apps/api/.env.example)
  actually persists as expected, separately from Google''s own OAuth prompt behavior.'
