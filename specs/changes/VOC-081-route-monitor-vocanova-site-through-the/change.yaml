production_impact: 'expected. Restores monitor.vocanova.site through shared-edge origin
  :443 via Cloudflare, adds a least-privilege Docker network between shared edge and
  Uptime Kuma, brings the monitoring Compose definition under repository management,
  and changes shared-edge network membership / vhost loading. A misconfigured vhost,
  network, or deploy ownership boundary can affect the shared public edge (both app
  tiers) or expose an administrative monitoring UI. Staging/production secret and
  write isolation must not regress.

  '
