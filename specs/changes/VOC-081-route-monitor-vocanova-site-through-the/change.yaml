dependencies:
- id: VOC-081-DEP-00
  status: "unresolved at drafting time. Access exposure for the Uptime Kuma UI behind\
    \ monitor.vocanova.site: a Cloudflare-proxied DNS record is not authorization.\
    \ If the UI is intended to be private, require repository-managed access control\
    \ compatible with the current Cloudflare setup (recommended default: Cloudflare\
    \ Access / Zero Trust application for monitor.vocanova.site, with redacted verification\
    \ evidence). If public exposure is intentionally accepted, record that decision\
    \ explicitly at adoption and still require Kuma's own authentication to remain\
    \ enabled \u2014 do not treat DNS proxying alone as an access control. See specification.md\
    \ open question 1.\n"
- id: VOC-081-DEP-01
  status: 'unresolved at drafting time. Exact repository path and deploy ownership
    for the monitor vhost fragment so staging, production, shared-edge, and monitoring
    Compose projects do not fight over writes. Recommended default: own the vhost
    under infra/nginx-shared/ (or a dedicated infra/nginx-monitor/ tree mounted read-only
    into shared-edge) rather than continuing to rely on production/nginx/conf.d/30-monitor.conf,
    which is not loaded by the current shared-edge include globs and sits in the production
    deploy write tree. See specification.md open question 2.

    '
- id: VOC-081-DEP-02
  status: 'unresolved at drafting time. How shared-edge network membership changes
    are applied without making routine app deploys recreate shared-edge, and without
    accepting manual docker network connect. Recommended default: declare vocanova-monitoring-net
    as an external network on both monitoring and shared-edge compose; create the
    network declaratively from the repository deploy path; when shared-edge compose
    gains the network, perform a controlled one-time compose convergence for the shared-edge
    project (nginx -t fail-closed before reload/recreate), not as part of ordinary
    staging/production app container recreate. See specification.md open question
    3.

    '
- id: VOC-079
  status: Adopted predecessor. Single shared-edge nginx on host 80/443; production
    nginx bridge and ports 8081/8443 retired. VOC-079-EV-03 explicitly recorded monitor.vocanova.site
    Cloudflare 520 as out of VOC-079 scope with Kuma healthy on loopback 3001.
- id: VOC-067
  status: Adopted predecessor. Introduced vocanova-shared-edge-nginx, per-tier conf
    trees, fail-closed nginx -t + reload, and deploy isolation invariants this package
    must preserve.
- id: VOC-051
  status: Adopted predecessor for Sentry hourly error-monitoring workflow. This package
    must leave .github/workflows/error-monitoring.yml and Sentry error monitoring
    unchanged and healthy (AC).
