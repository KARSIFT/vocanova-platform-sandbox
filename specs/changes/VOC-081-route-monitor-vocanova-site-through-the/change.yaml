requirement_source: "GitHub issue #665 (\"Route monitor.vocanova.site through the\
  \ repository-managed shared edge\"). Restores https://monitor.vocanova.site through\
  \ the single repository-managed vocanova-shared-edge-nginx after VOC-079 retired\
  \ the production nginx bridge. Live 2026-08-15 verification (issue #665; VOC-079-EV-03):\
  \ Cloudflare proxied A for monitor.vocanova.site \u2192 130.185.123.152 returns\
  \ HTTP 520; vocanova-uptime-kuma is healthy on 127.0.0.1:3001 only; live Compose\
  \ project monitoring from /opt/vocanova/monitoring/docker-compose.yml is not present\
  \ in this repository; stale /opt/vocanova/production/nginx/conf.d/30-monitor.conf\
  \ proxies to vocanova-uptime-kuma:3001 but infra/nginx-shared/nginx.conf loads only\
  \ production 10-*.conf / 20-*.conf; shared edge joins only vocanova-net and vocanova-production-net\
  \ while Kuma joins only monitoring_default. VOC-079 single-nginx invariant (exactly\
  \ one VocaNova nginx; ports 8081/8443 absent) must be preserved."
