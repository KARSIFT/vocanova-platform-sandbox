schema_version: 1
id: VOC-125
slug: manual-resume-of-an-existing-implementation-pr
title: Manual resume of an existing implementation PR must supply exact retry bindings
type: infrastructure
status: adopted
risk: R4
planned_implementation_risk_floor: 'R4. This package changes protected CI/CD implement
  recovery identity in KARSIFT/karsift-ai-infra (implement.yml existing-carrier binding,
  caller pipeline dispatch contract, and tooling/governance fixtures and tests). tooling/governance/*
  is an R4 path floor; .github/workflows/* is an R3 floor; semantic mutation of exact-head
  remediation bindings, attempt caps, and implementation-carrier identity is protected.
  This is a draft proposal for human adoption review, not a determination; the path
  classifier and independent verifier remain authoritative.

  '
canonical_path: specs/changes/VOC-125-manual-resume-of-an-existing-implementation-pr
authority_model: a004-active
requirement_source: 'GitHub issue #1020 (Manual resume of an existing implementation
  PR cannot supply exact retry bindings). Live 2026-08-26 failure while resuming adopted
  task VOC-122-T00 (issue #1003, draft PR #1012) after VOC-124 repaired and merged
  the coordinated source publisher: pipeline run 32966618512 job 98170418081 reached
  Create implementation branch, found existing remote branch agent/voc-122-voc-122-t00
  at 0b7be8c531be8300d5a1d5534acc83bf4d6a1791, then failed closed before model resolution
  because expected_head_sha was empty. Prior App-signed review bound that PR revision
  to base e910eb4a21d48bbb5b3e0c30b8ee647d64683dbe. Caller develop at dispatch was
  f0f7a54283c3527f40544fd236516dc3a5f4dc82; authoritative infrastructure was KARSIFT/karsift-ai-infra@f406cc95a3f853e8aef5bf8bcf22d37a29d64547.
  Root cause: reusable implement.yml correctly requires expected_head_sha and expected_base_sha
  on attempt != 1, but caller pipeline.yml workflow_dispatch exposes attempt without
  an existing-carrier recovery identity and the implement job forwards neither SHA.
  Automatic remediate.yml retries have those values from the pull-request review path;
  a later operator recovery through action=implement cannot supply them. Retrying
  as attempt 1 would violate the one-retry limit; deleting the branch or opening a
  replacement PR would discard the existing carrier. Required: one fail-closed governed
  recovery route that derives immutable identity from an explicit existing PR number
  and App-signed exact-revision review/metadata, forwards verified bindings into implement.yml
  before any model or mutation step, preserves attempt 1|2 and the existing carrier,
  adds deterministic source and caller tests, updates current-state docs/fixture/pin,
  then resumes existing #1003 / #1012 through the repaired route. This draft package
  does not adopt or authorize itself.

  '
