  rationale: 'KARSIFT implement-recovery identity fix only. No page routes, critical
    API endpoints, monitor inventory, or synthetic inventory in infra/monitoring/
    are added or changed.

    '
dependencies:
- id: VOC-125-DEP-00
  status: 'resolved at drafting time. Issue #1020 provides the live implement failure,
    exact run/job IDs, existing branch/head, prior-review base, caller and infrastructure
    refs, root cause (caller dispatch omits recovery identity and does not forward
    expected_head_sha / expected_base_sha), the prohibition on attempt-1 reclassification
    or replacement carriers, preferred PR-number derivation over free-form SHAs, fail-closed
    mismatch classes, test shape, docs/fixture/pin duty, Cursor Composer / Cursor
    Grok preservation, no-OpenAI constraint, and the instruction to resume existing
    #1003 / #1012 rather than create a replacement VOC-122 task or PR. Enough specificity
    to draft without a clarifying round trip.

    '
- id: VOC-125-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative: no founder
    approved-comment gate on engineering-workflow adopt/merge/release paths; exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    and fail-closed behavior remain mandatory.

    '
- id: VOC-125-DEP-02
  status: 'resolved at drafting time by reading the current workflows. karsift-ai-infra/.github/workflows/implement.yml
    declares optional expected_head_sha and expected_base_sha (default empty) and,
    on attempt != 1, compares the existing remote task branch against inputs.expected_head_sha
    via config/verify-expected-head.py before model resolution. Caller .github/workflows/pipeline.yml
    workflow_dispatch exposes change_id, package_path, task_id, issue_number, and
    attempt, and the implement job forwards only those five fields plus integration_branch.
    It does not expose or forward expected_head_sha, expected_base_sha, or an existing
    PR number. Automatic remediate.yml retry already passes expected_head_sha and
    expected_base_sha from the pull-request event. The infra project-repo pipeline
    template has the same implement-job omission.

    '
- id: VOC-125-DEP-03
  status: 'resolved at drafting time. VOC-121 isolated source publication, VOC-123
    named-ref source bundles, and VOC-124 publish-source permission-workflows: write
    are live (infra merge f406cc95a3f853e8aef5bf8bcf22d37a29d64547). This package
    does not reopen those contracts. Because VOC-124 already lets an authorized nested
    workflow-file commit publish, T00 does not need a supervised bootstrap exception.
    The first T00 run is attempt 1 on a new carrier.

    '
- id: VOC-125-DEP-04
  status: 'resolved at drafting time as an accepted delivery constraint: coordinated
    PRs in the caller and KARSIFT/karsift-ai-infra remain one task. Repository count,
    workflow-versus-tests-versus-docs, and fixture/pin work are not split reasons.
    Merge the independently reviewed infra PR first so implement.yml@main declares
    existing_pr_number before the caller forwards it, then pin the caller fixture
    to that exact merge SHA when consumed.

    '
- id: VOC-125-DEP-05
  status: 'resolved at drafting time as a hard dependency that must not expand this
    package into a replacement VOC-122 roster. Adopted VOC-122-T00 (#1003) and draft
    caller PR #1012 remain the only valid authority/carrier for that outcome. This
    package must not implement VOC-122 promotion-recovery replan behavior, must not
    merge #1012, and must not create a replacement VOC-122 task or PR. After this
    package''s exact reviewed infra merge is live on implement.yml@main and the caller
    dispatch contract is merged, resume the existing #1003 / #1012 carrier through
    the repaired route at attempt 2 with existing_pr_number=1012.

    '
- id: VOC-125-DEP-06
  status: 'resolved at drafting time. Configured Cursor Composer remains the implementer
    and Cursor Grok remains the exact-revision independent reviewer. No OpenAI credential
    or execution route is needed or authorized. Do not print credential values.

    '
- id: VOC-125-DEP-07
  status: 'open at drafting time as an implementer-facing structure choice, not a
    planner guess past the required behavior. Whether recovery-identity derivation
    lives in a new config/bind-existing-carrier.py (or equivalent), an extension of
    config/verify-expected-head.py, and whether tests live in tests/test_voc125_*.py
    or extend test_remediate_policy.py / test_voc121_implement_policy.py, is an implementation
    choice. Constraints that are not open: operator identity is an explicit existing
    PR number, not free-form SHA inputs on caller workflow_dispatch; implement.yml
    remains the derivation and fail-closed locus; SHA inputs stay on implement.yml
    for the automatic remediate path and must be bound to the live PR when present;
    attempt 1|2 and the existing carrier are preserved; every listed mismatch class
    fails closed before any model or mutation step.

    '
