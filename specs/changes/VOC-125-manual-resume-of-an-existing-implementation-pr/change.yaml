production_impact: 'none-intentional for application runtime. This package repairs
  the documented operator implement-dispatch contract so an existing implementation
  PR can be resumed after automatic remediation stops. It does not change product
  behavior, deployment topology, secret values, providers, or monitor inventory. Restoring
  intended recovery may allow the already-authorized VOC-122-T00 carrier to continue
  through existing gates; that is not a new deploy path.

  '
rollback_required: true
monitoring_impact:
