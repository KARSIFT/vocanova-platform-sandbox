authority_model: a003-active
requirement_source: 'GitHub issue #297 ("middleware.ts''s auth check silently fails
  in production because Next.js Middleware runs on the Edge runtime, not Node"), including
  its full body (the only content on the issue at drafting time - no comments existed
  yet). The issue itself documents a direct production reproduction (SSH into vocanova-production-web,
  comparing plain Node fetch vs. middleware''s own fetch against the same live session
  cookie and API URL) and names its own suggested fix (`export const runtime = "nodejs";`)
  and two follow-up asks (a regression test that exercises the real Edge-vs-Node runtime
  difference, and structured logging distinguishing "fetch threw" / "got 401" / "got
  some other non-ok status" in the auth-check failure paths).'
requirement_approval_status: 'Approved. Founder merged PR #299 (this draft package''s
