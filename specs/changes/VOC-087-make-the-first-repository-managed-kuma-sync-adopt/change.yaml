implementation_authorized: true
automatic_merge_allowed: true
production_impact: expected after this package is merged and deployed, then a later
  authorized sync-monitoring inventory apply. This package itself must not perform
  the first live inventory apply. After deploy, the synchronizer must adopt the two
  verified live production monitors without collision or duplicate create, preserve
  remote notification bindings unless inventory explicitly owns them, and keep credential
  rotation recoverable if reset succeeds but proof/metadata transfer fails. No application
  schema migration. No intentional Cloudflare change. No direct SQLite mutation. Unrelated
  manually owned Kuma monitors must be preserved. Credential or notification configuration
  must not appear in logs, issues, or evidence.
rollback_required: true
monitoring_impact:
  state: update
  rationale: Corrects adoption identity and update payload behavior for the existing
    repository-managed production availability monitors introduced by VOC-086, and
    preserves notification bindings on later managed updates of every availability
    monitor. Does not add new stable monitor or synthetic IDs.
  monitor_ids:
  - kuma.availability.production.web
  - kuma.availability.production.api-healthz
  - kuma.availability.staging.web
  - kuma.availability.staging.api-healthz
  - kuma.availability.monitor-host
  synthetic_ids: []
