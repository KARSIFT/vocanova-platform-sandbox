planned_implementation_risk_floor: Measured during drafting against the expected task-scoped
  file list (infra/monitoring/monitors.yaml, infra/monitoring/kuma-sync/plan.mjs,
  infra/monitoring/kuma-sync/monitor-payload.mjs and related kuma-sync modules, scripts/foundation
  kuma-sync and sync-monitoring tests, .github/workflows/sync-monitoring.yml, infra/scripts
  kuma rotation and inventory selftests, VOC-086 t01/t02 evidence files, this package
  directory). Detected path floor is R3 for infra/monitoring, infra/scripts, and .github/workflows/sync-monitoring.yml.
  This package proposes R3 for the change as a whole as a draft proposal for the reviewing
  human at adoption time, not a determination. Independent verification and the reviewing
  human must still confirm each task's real file list and whether semantic escalation
  to R4 is warranted for first live inventory apply and credential rotation recovery.
canonical_path: specs/changes/VOC-087-make-the-first-repository-managed-kuma-sync-adopt
authority_model: a004-active
requirement_source: 'GitHub issue #728 (Make the first repository-managed Kuma sync
  adopt live monitors safely), including the fully populated issue body. Fresh 2026-08-19
  read-only server verification of active live monitors: ''VocaNova Production API''
  at https://api-production.vocanova.site/healthz and ''VocaNova Production Web''
  at https://production.vocanova.site (no trailing slash). Merged VOC-086 inventory
  instead declares adoption matches for ''Production API /healthz'' and ''Production
  Web'', and the production web URL includes a trailing slash. infra/monitoring/kuma-sync/plan.mjs
  requires exact name and URL matches, so it cannot adopt either live monitor and
  fails closed on unmanaged URL collision (API) or can duplicate-create (web, where
  trailing-slash mismatch also defeats exact URL collision). inventoryEntryToDesiredMonitor
  sets notificationIDList to an empty object, which can strip existing notification
  bindings on adopt/update. VOC-086 T01 evidence records the incorrect live adoption
  names. T02 evidence describes obsolete rotation ordering after independently reviewed
  remediation, and its two shell harnesses are documented but not executed by pnpm
  test. This draft package still does not adopt or authorize itself.'
requirement_approval_status: approved requirement; package adopted automatically after
  exact-revision independent verification
