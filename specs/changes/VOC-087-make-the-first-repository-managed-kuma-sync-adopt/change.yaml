dependencies:
- id: VOC-087-DEP-00
  status: 'resolved at drafting time by issue #728 and drafting-time repo read. Live
    monitors are ''VocaNova Production API'' at https://api-production.vocanova.site/healthz
    and ''VocaNova Production Web'' at https://production.vocanova.site. Inventory
    match_name/match_url and production web trailing slash do not match. plan.mjs
    uses exact string equality. inventoryEntryToDesiredMonitor sets notificationIDList
    to {}.'
- id: VOC-087-DEP-01
  status: resolved at drafting time. pnpm test runs node --test scripts/foundation/*.test.mjs,
    which only asserts the kuma-rotate-credentials and sync-kuma-inventory selftest
    files exist. Those harnesses are not executed by the normal deterministic test
    entry point.
- id: VOC-087-DEP-02
  status: unresolved at drafting time only as an implementer shape choice, not a requirement
    gap. Exact workflow recovery shape for reset-success/proof-transfer-failure (retain
    runner-local password until secret store succeeds, store from runner-local file
    after rotate-step success even if proof fetch fails, and/or a store-only retry
    that never resets again) must satisfy VOC-087-AC-05 without exposing credentials.
    See specification.md open question 1.
- id: VOC-087-DEP-03
  status: unresolved at drafting time only as an implementer shape choice. Exact optional
    inventory schema for explicit notification ownership (default preserve) may be
    a reserved field on availability monitors or an equivalent documented extension.
    Canonical monitors.yaml must remain preserve-by-default. See specification.md
    open question 2.
- id: VOC-086
  status: Adopted predecessor. This package corrects first-apply safety defects in
    the merged VOC-086 inventory, synchronizer, workflow, tests, and T01/T02 evidence.
    VOC-086-T05 live inventory apply remains blocked until this package is merged
    and deployed.
- id: VOC-081
  status: Adopted predecessor. Preserve loopback-only 3001, single shared-edge nginx,
    and absence of 8081/8443.
