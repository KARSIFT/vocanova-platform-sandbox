requirement_source: 'GitHub issue #1071 (Pin exact infrastructure PR-context validation
  and remove all VOC-112 hydration bypasses), including its original body. VOC-134-T00
  issue #1068 / PR #1070 exhausted attempts 1 and 2. Exact reviewed heads: attempt
  1 f373d9a61f90659e982173395a96ff54776fc945 added an import-time capture fetch in
  scripts/foundation/voc112-navigation-benchmark-run.mjs; final attempt 718bfdcdaec65e5df6e918fbc25f0fe64f6a2cad
  restored that runner but added scripts/foundation/hydrate-voc112-git-objects.mjs
  and invoked it from scripts/foundation/validate-workspace.mjs. The original pre-push
  failure was truthful: missing squash-era subject f9d11e232a07c7d7a9c433d02c9267912543ba10
  caused the protected test to fail with ''a full local checkout must already contain
  the captured commit''. Authoritative infrastructure PR KARSIFT/karsift-ai-infra#167
  is already merged as b263c0c110591cc798b89277dfc35542abb1597b. Independent Terra
  exact review PASS for infra head eb11c4fc6841ec73816e2e064dcd449d98c1e933; hosted
  actionlint, policy-tests, shellcheck, and YAML parse passed; full infra suite passed
  442/442. Live tracked PINNED_SHA.txt at drafting still equals 863fc1f35b1d35e4981a59166b0e939be1a2b681
  (#164) because VOC-134 never merged; the issue''s ''#166 pin'' names VOC-134''s
  unmerged target f3d79177bf8a9abe0dae550f39502165d494c576. This package pins to #167,
  which contains both the #166 release-synchronization contract and the #167 PR-context
  validation contract. Do not reuse, merge, cherry-pick, or compose PR #1051, #1056,
  #1065, or #1070. Do not redispatch VOC-132-T00 (#1059), VOC-133-T00 (#1063), or
  VOC-134-T00 (#1068). Do not manufacture completion markers for VOC-127 or VOC-130
  through VOC-134. Pin target is b263c0c110591cc798b89277dfc35542abb1597b. Expected
  immutable carrier base at drafting is b9e74fc2db4691c48c637639b265d527de9f4505;
  implementation must revalidate current develop at dispatch and fail closed if it
  moved. This draft package does not adopt or authorize itself.'
