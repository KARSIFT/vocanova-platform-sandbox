- id: VOC-135-DEP-10
  status: 'resolved at drafting time as the feasible exact-revision evidence contract.
    VOC-133-D12 / TEST-10 as interpreted by PR #1065 required a tracked file to name
    the SHA of the same commit that contains it. That is Git-impossible: changing
    the file changes the commit SHA. This package keeps exact-revision binding fail-closed
    by requiring the App-authored independent-review comment/check to bind the live
    PR head exactly, requiring merge-gate to reject any mismatch, and allowing post-merge/root-issue
    audit to record the reviewed head and merge SHA. Committed package evidence records
    the immutable carrier base, exact infra merge, hashes, validation, and where later
    exact-head binding will be published. Tests must not mutate evidence at runtime
    to make that contract appear true.'
