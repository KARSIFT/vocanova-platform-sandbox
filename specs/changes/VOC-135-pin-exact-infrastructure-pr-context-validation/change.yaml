    \ not retarget the carrier base after files have already changed, and do not treat\
    \ a moving branch name as authority after that constant is selected. The regression\
    \ must require the exact commit object and all eight no-change paths to resolve,\
    \ and must fail\u2014not skip\u2014if proof cannot run."
