  decision: unassigned
  package_preparation: planner (drafting only)
  implementation: unassigned
  independent_verification: unassigned
dependencies:
- id: VOC-096-DEP-00
  status: resolved at drafting time. Use the existing repository secret PRODUCTION_NEW_USER_SIGNUP_ALLOWLIST
    as the sole production cohort source. Its production-prefixed name and workflow
    tests must ensure only deploy-production.yml consumes it; deploy-staging.yml must
    never reference it. The secret must be populated before the first post-T00 production
    deployment when Google OAuth credentials are present.
- id: VOC-096-DEP-01
  status: resolved at drafting time. VOC-088-T01 already added controlled_signup_ready
    to /healthz and production.go tests. This package extends production deploy persistence
    and the production OAuth synthetic harness; it does not re-implement the API field.
- id: VOC-096-DEP-02
  status: resolved at drafting time. VOC-088-T00 established the staging pattern (validate-*-signup-allowlist.sh,
    secret-backed deploy config, dispatch input removal, foundation tests). Production
    work mirrors that pattern with production-prefixed secrets and hosts only.
- id: VOC-096-DEP-03
  status: resolved at drafting time. synthetic.production.oauth-expected-state and
    verify-production-oauth-start.sh exist (VOC-086-T03) but do not yet assert controlled_signup_ready
    on /healthz; staging harness does (VOC-088-T01).
