automatic_merge_allowed: true
production_impact: Restores persistent production controlled-signup cohort through
  automatic and manual production deploys. No blanket NEW_USER_SIGNUP_ENABLED change.
  No database migration. Staging secrets, databases, deploy users, and monitoring
  inventory remain isolated.
rollback_required: true
monitoring_impact:
  state: update
  rationale: Extends synthetic.production.oauth-expected-state and its harness to
    assert controlled_signup_ready on production /healthz when Google OAuth is enabled
    and global signup remains disabled. Mirrors VOC-088 staging readiness coverage
    without adding new monitor or synthetic IDs.
  synthetic_ids:
  - synthetic.production.oauth-expected-state
authority_model: a004-active
requirement_source: 'GitHub issue #809 (Persist controlled production Google signup
  cohort). Fresh evidence: production Google OAuth is enabled; NEW_USER_SIGNUP_ENABLED
  remains false; deploy-production.yml sources NEW_USER_SIGNUP_ALLOWLIST only from
  the optional workflow_dispatch input new_user_signup_allowlist whose default is
  empty; every automatic push deployment rewrites the runtime cohort to empty; the
  encrypted repository secret PRODUCTION_NEW_USER_SIGNUP_ALLOWLIST already exists
  and must become the persistent source of truth; live public /healthz reports controlled_signup_ready=false,
  consistent with the empty runtime cohort. This draft package does not adopt or authorize
  itself.'
requirement_approval_status: approved requirement; package not yet adopted
base_branch: develop
base_sha: unknown - not recorded by this draft; set at adoption time
target_branch: develop
