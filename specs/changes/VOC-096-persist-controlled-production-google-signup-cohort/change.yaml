- infra/monitoring/synthetics.yaml (production readiness coverage metadata)
- .github/workflows/scheduled-synthetics.yml (comment or wiring alignment only if
  required)
- scripts/foundation/voc096-deploy-production-allowlist.test.mjs (new)
- scripts/foundation/voc096-production-readiness.test.mjs (new)
- docs/operations/production-controlled-signup.md (new operator guide)
