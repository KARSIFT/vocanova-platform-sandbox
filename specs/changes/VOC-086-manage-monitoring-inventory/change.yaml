production_impact: expected. After adoption and authorized task merges, a repository-managed
  monitoring inventory and Socket.IO synchronizer will create/update/adopt managed
  Uptime Kuma availability monitors (staging web, staging API /healthz, production
  web, production API /healthz, independent monitor.vocanova.site reachability), a
  one-time or explicit rotation credential bootstrap will store Kuma credentials in
  GitHub secrets without printing them, and a scheduled synthetic registry/workflow
  will run authenticated non-mutating checks using reserved synthetic accounts. No
  application schema migration. No intentional Cloudflare configuration change. No
  direct SQLite mutation. Manually owned unrelated Kuma monitors must be preserved
  unless explicitly adopted. Mis-scoped credential logging, overwrite of unrelated
  monitors, or topology regression is out of scope and must not occur.
rollback_required: true
