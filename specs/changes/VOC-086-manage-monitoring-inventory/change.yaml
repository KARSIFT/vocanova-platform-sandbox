requirement_source: "GitHub issue #716 (\"Manage monitoring inventory, synthetics,\
  \ and monitoring-impact governance\"), including the fully populated issue body.\
  \ Fresh 2026-08-16 evidence: promoted revision 96a1fd10155c605ba444e624928552f7b62b93d4;\
  \ Kuma healthy at version 1.23.17 (louislam/uptime-kuma:1), host-bound only on 127.0.0.1:3001,\
  \ on the isolated monitoring network and shared edge; repository owns Compose, vhost,\
  \ access policy, and reachability verifier, but no monitor inventory or synchronizer;\
  \ live inventory remains two active 60-second HTTP monitors (Production API /healthz\
  \ and Production Web); missing staging web/API and independent https://monitor.vocanova.site\
  \ reachability coverage; existing deploy synthetics cover staging OAuth/core loop\
  \ and production OAuth/content/ authenticated fixed+dynamic routes but are deploy-only\
  \ rather than a canonical scheduled synthetic inventory; hourly Sentry error-monitoring\
  \ is healthy; no GitHub secret names exist yet for Kuma username/password (only\
  \ smoke-mint/Sentry monitoring tokens); read-only deployed source confirms supported\
  \ authenticated Socket.IO monitor events (add, editMonitor, monitor-list) and the\
  \ official /app/extra/reset-password.js tool \u2014 no direct SQLite deployment\
  \ mechanism is needed. Founder/user remediation directive dated 2026-08-16 authorizes\
  \ issue/package/PR/workflow/deploy/verification/ remediation/closure actions without\
  \ routine approval. This draft package still does not adopt or authorize itself."
