planned_implementation_risk_floor: "Measured during drafting by running scripts/governance/classify-change-risk.sh\
  \ --files-from against the expected task-scoped file list (infra/monitoring/monitors.yaml,\
  \ infra/monitoring synthetics registry and Kuma synchronizer under infra/monitoring/,\
  \ .github/workflows/sync-monitoring.yml and/or equivalent monitoring sync workflow,\
  \ .github/workflows/scheduled-synthetics.yml and/or equivalent scheduled synthetics\
  \ workflow, scripts/governance/validate-monitoring-impact.sh and any validate-governance.sh\
  \ wiring that invokes it, docs under docs/operations/ or infra/ for monitoring operator\
  \ docs, scripts/foundation deterministic tests, this package directory). Detected\
  \ path floor: R4 (scripts/governance/*). Without the governance validator path the\
  \ floor would be R3 for infra/monitoring and monitoring workflows. This package\
  \ proposes R4 for the change as a whole \u2014 a draft proposal for the reviewing\
  \ human at adoption time, not a determination \u2014 because governance validation\
  \ under scripts/governance/ is in scope and because the work mutates live operational\
  \ monitors and introduces monitoring credentials into GitHub Actions environments.\
  \ Issue #716 proposed R3; the measured path floor raises the draft proposal to R4.\
  \ Independent verification and the reviewing human must still confirm each task's\
  \ real file list and whether further semantic escalation applies."
