dependencies:
- id: VOC-086-DEP-00
  status: 'resolved at drafting time by issue #716 verified evidence and drafting-time
    repo read. Repository already owns infra/docker-compose.monitoring.yml, shared-edge
    monitor vhost, access policy, and reachability verifier (VOC-081), but has no
    infra/monitoring/monitors.yaml inventory and no Socket.IO synchronizer. Live Kuma
    still holds only two unmanaged 60s HTTP monitors.'
- id: VOC-086-DEP-01
  status: unresolved at drafting time only as an implementer shape choice (not a requirement
    gap). Exact language/runtime for the Kuma Socket.IO synchronizer (Node/TypeScript
    under infra/monitoring/ or scripts/, or Python) must use authenticated Socket.IO
    events add / editMonitor / monitor-list, never SQLite, never log credentials,
    and must support prevalidation, ownership marker/tag, create/update/adopt, collision
    detection, and compensating rollback on partial failure. See specification.md
    open question 1.
- id: VOC-086-DEP-02
  status: 'unresolved at drafting time only as an implementer/ops shape choice. Exact
    GitHub secret names and Actions environment for Kuma credentials (recommended
    defaults: KUMA_USERNAME preserving the existing username, KUMA_PASSWORD for the
    generated strong secret, stored only in the monitoring/sync workflow environment)
    plus the workflow_dispatch input name for one-time rotate_credentials / bootstrap.
    Normal sync must never reset credentials. See specification.md open question 2.'
- id: VOC-086-DEP-03
  status: unresolved at drafting time only as an implementer shape choice. Exact packaging
    of scheduled synthetics (one workflow with a stable-ID job matrix vs discrete
    workflow_call jobs) must cover the five required synthetic scenarios, reuse reserved
    synthetic accounts and existing mint secrets, mask session values, and remain
    non-mutating for production. See specification.md open question 3.
- id: VOC-081
  status: Adopted predecessor. Repository-managed Kuma Compose, monitoring network,
    shared-edge vhost, access policy, and reachability verifier. This package must
    preserve loopback-only 3001, single shared-edge nginx, and absence of 8081/8443.
- id: VOC-051
  status: Adopted predecessor for hourly Sentry error-monitoring. This package must
    leave .github/workflows/error-monitoring.yml unchanged and healthy.
- id: VOC-050
  status: Adopted predecessor for synthetic smoke identity, session mint, and deploy-time
    synthetic checks this package reuses for scheduled synthetics without inventing
    a parallel identity.
- id: VOC-067
  status: Adopted predecessor for staging/production isolation and shared-edge topology.
    This package must preserve secret, directory, deploy-user, database, and Docker-network
    isolation.
affected_areas:
- infra/monitoring/monitors.yaml (new canonical availability inventory)
- infra/monitoring/ synthetics registry and Kuma Socket.IO synchronizer (exact filenames
  per VOC-086-DEP-01)
- .github/workflows/sync-monitoring.yml or equivalent monitoring sync/deploy workflow
  with optional rotate_credentials bootstrap input
- .github/workflows/scheduled-synthetics.yml or equivalent scheduled synthetic registry/workflow
- scripts/governance/validate-monitoring-impact.sh (new) and wiring from validate-governance.sh
  and/or CI
- change-package template / governance docs describing required monitoring_impact
  field
- docs/operations/monitoring.md or infra/README.md monitoring operator docs (add/change
  monitors, credential bootstrap/rotation, rollback, ownership, proof)
- scripts/foundation/ or equivalent deterministic protocol mocks and governance positive/negative
  tests
- GitHub Actions secrets/environment for Kuma credentials (ops via workflow bootstrap
  only; never commit secrets)
- Live Kuma monitor inventory via supported Socket.IO only (no SQLite)
- specs/changes/VOC-086-manage-monitoring-inventory
