requirement_source: 'GitHub issue #956 (VOC-113 recovery runner fails before dispatch
  with App metadata-read error). Live evidence 2026-08-24: PR #954 merged at b97e9575fd30671c336a2e92ca00db6e29b86416;
  pipeline run 32696249484 job 97339047384 failed step Recover missing integration
  push workflows with actions-check-recovery: github_metadata_read_failed; reconcile-release
  run 32696549963 job 97339655608 failed Recover missing exact-head promotion checks
  with the same error; no recovery dispatch in either mode; promotion PR #947 remains
  blocked for VOC-113-T01. Required: ensure the dedicated job token used by merge-gate,
  release, and recover-actions-checks has explicit Actions and read capabilities for
  exact-SHA metadata endpoints while the App remains mutation-only; localize runner failures to sanitized
  endpoint classes; add policy/runner tests; re-run live integration recovery and
  reconcile-release without weakening rulesets, fabricating checks, or manually merging
  #947. This draft package does not adopt or authorize itself.

  '
