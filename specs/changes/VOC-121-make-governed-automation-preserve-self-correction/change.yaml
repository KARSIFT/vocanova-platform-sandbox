authority_model: a004-active
requirement_source: 'GitHub issue #994 (Make governed automation preserve self-correction
  helpers and finish coordinated cross-repository tasks). VOC-120 exposed three related
  autonomous-delivery failures: authorized nested infrastructure edits were silently
  discarded by implement.yml; pre-push self-correction invoked prepare_cursor_model.py
  after rm -rf karsift-ai-infra; promotion recovery treated a successful same-named
  status or alternate run as satisfying a cancelled required check-run that GitHub
  ruleset evaluation still selected. Required: one outcome-sized reliability change
  so a single adopted task can finish all authorized coordinated repository carriers
  without silent loss; self-correction retains immutable helpers after caller staging;
  required-check recovery uses GitHub actual branch/ruleset satisfaction; deterministic
  tests reproduce all three live failures; docs and caller fixture/pin follow the
  exact reviewed infra merge. This draft package does not adopt or authorize itself.

  '
