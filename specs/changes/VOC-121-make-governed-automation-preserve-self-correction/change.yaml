    are added or changed.

    '
dependencies:
- id: VOC-121-DEP-00
  status: 'resolved at drafting time. Issue #994 provides the three live failures,
    exact reproduction/run IDs, root causes, required outcome, fail-loud floor if
    general multi-carrier cannot be made safe, credential/retry non-goals, and one-task
    guidance with enough specificity to draft without a clarifying round trip.

    '
- id: VOC-121-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative: no founder
    approved-comment gate on engineering-workflow adopt/merge/release paths; exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    and fail-closed behavior remain mandatory.

    '
- id: VOC-121-DEP-02
  status: 'resolved at drafting time. Current reusable implement.yml Commit implementer
    work copies only config/run-app-checks.sh to /tmp, then rm -rf karsift-ai-infra,
    then stages a caller-only bundle. Self-correct failed pre-push validation later
    invokes python3 karsift-ai-infra/config/prepare_cursor_model.py. The implementer
    prompt already permits coordinated repository carriers; the execution/publishing
    contract does not.

    '
- id: VOC-121-DEP-03
  status: 'resolved at drafting time. Live VOC-120-T00 implementation run https://github.com/KARSIFT/vocanova-platform-sandbox/actions/runs/32899479806
    (job 97970681892) produced authorized nested infrastructure edits that were discarded;
    no infrastructure PR existed until manual recovery under the same task. VOC-120-T00
    evidence records attempt-1 independent verification failure for missing coordinated
    infra delivery.

    '
- id: VOC-121-DEP-04
  status: 'resolved at drafting time. Promotion PR #993 had an exact-head governance-policy
    pull-request check-run cancelled by concurrency while another workflow-dispatch
    run and a published same-named status were successful. Release run https://github.com/KARSIFT/vocanova-platform-sandbox/actions/runs/32902418610
    reported actions-check-recovery dispatched=none, attested successful statuses,
    then failed merge because the ruleset still selected the cancelled required check-run.
    gh pr checks --required continued to report governance-policy failed. Rerunning
    the cancelled exact-head governance run succeeded; the App controller then merged
    #993 without an admin bypass.

    '
- id: VOC-121-DEP-05
  status: 'resolved at drafting time as an accepted delivery constraint: coordinated
    PRs in the caller and KARSIFT/karsift-ai-infra remain one task. Repository count
    is not a split reason. T00 itself is a coordinated change and may still hit the
    pre-fix discard path (chicken-and-egg); bootstrap recovery of this task infra
    carrier is in-scope. After T00 merges, future adopted tasks must not need that
    recovery.

    '
- id: VOC-121-DEP-06
  status: 'open at drafting time as an implementer-recorded fallback, not a planner
    guess. Preferred outcome is full governed multi-carrier publication. If implementation
    proves that general multi-carrier support cannot be made safe in this change without
    weakening runner isolation, App-token least privilege, exact-SHA review, or protected
    checks, the same task must fail loudly on authorized nested edits with precise
    recovery instructions. Silent deletion remains unacceptable either way. Record
    the chosen path and the safety constraint in t00-evidence.md.

    '
