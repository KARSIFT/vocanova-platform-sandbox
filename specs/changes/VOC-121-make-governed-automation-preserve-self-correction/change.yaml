production_impact: 'none-intentional for application runtime. This package repairs
  governed automation so coordinated infrastructure and caller work, pre-push self-correction,
  and required-check recovery complete fail-closed. It does not change product behavior,
  deployment topology, credentials, providers, or monitor inventory. Restoring intended
  promotion recovery may allow an already-reviewed promotion PR to merge through existing
  gates after genuine exact-head checks; that is not a new deploy path.

  '
