  same raw-positive-tip defect) and caller tooling/governance fixtures and tests.
  tooling/governance/* is an R4 path floor; .github/workflows/* is an R3 floor; semantic
  second-repository publication of nested infrastructure is protected. This is a draft
  proposal for human adoption review, not a determination; the path classifier and
  independent verifier remain authoritative.

  '
canonical_path: specs/changes/VOC-123-coordinated-source-carrier-must-bundle-the
authority_model: a004-active
requirement_source: 'GitHub issue #1005 (Coordinated source carrier must bundle the
  committed head through a named ref). Live 2026-08-26 failure while implementing
  adopted task #1003 (VOC-122-T00): pipeline run 32915078678 job 98017696468 committed
  four authoritative-infrastructure files as nested commit db31cc9, then failed at
  source-bundle creation with `fatal: Refusing to create empty bundle.` before artifact
  upload or either carrier PR. Failing code in KARSIFT/karsift-ai-infra/.github/workflows/implement.yml
  (mirrored in tooling/governance/fixtures/karsift-ai-infra/.github/workflows/implement.yml)
  is `git -C karsift-ai-infra bundle create /tmp/implementer-source.bundle "${{ steps.infra-checkout.outputs.base_sha
  }}..$SOURCE_HEAD_SHA"` after `SOURCE_HEAD_SHA=$(git -C karsift-ai-infra rev-parse
  HEAD)`. Git bundle creation needs a named positive revision to advertise as the
  bundle head; a range ending only in a raw SHA traverses the intended commit but
  advertises no reference, so Git refuses an empty bundle. Deterministic local reproduction:
  `git bundle create raw.bundle "$base_sha..$head_sha"` exits 128; `git branch carrier
  "$head_sha"` then `git bundle create ref.bundle "$base_sha..carrier"` succeeds and
  `git bundle list-heads` advertises refs/heads/carrier. A workflow rerun cannot recover
  the lost nested commit; no source bundle or caller recovery artifact was uploaded,
  so no implementation carrier PR exists for #1003. Required: one outcome-sized carrier-integrity
  change that binds the exact committed SOURCE_HEAD_SHA to an isolated temporary named
  ref (or equivalently safe named ref) before source-bundle creation, creates the
  bundle from base_sha..that-ref, verifies the bundle advertises exactly the expected
  head/ref, removes the temporary ref afterward, inspects caller and planner recovery-bundle
  paths (`implement.yml` `integration_sha..HEAD` and `plan.yml` `base_sha..HEAD`)
  and changes only paths that reproduce the defect, preserves exact base/head binding,
  nested-repository isolation, bundle verification, artifact integrity, force-with-lease
  publishing, App-token separation, retry limits, independent exact-SHA review, protected
  checks, and fail-closed behavior; adds deterministic real-temporary-repository tests;
  updates current-state comments/docs and the caller fixture/pin through the coordinated
  exact-SHA flow; reconciles active #1003 delivery against that exact revision without
  implementing VOC-122 in this package. This draft package does not adopt or authorize
  itself.

  '
