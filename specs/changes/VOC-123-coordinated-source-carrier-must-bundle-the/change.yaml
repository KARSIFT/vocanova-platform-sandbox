dependencies:
- id: VOC-123-DEP-00
  status: 'resolved at drafting time. Issue #1005 provides the live implement-job
    failure, exact run/job IDs, nested commit db31cc9, empty-bundle error, failing
    workflow snippet, deterministic local reproduction, root cause (raw-SHA positive
    tip), required named-ref repair, caller/planner inspection duty, preserved fail-closed
    contracts, test shape, fixture/pin/docs coordination, #1003 hard-dependency-but-distinct-outcome
    guidance, and one-task instruction with enough specificity to draft without a
    clarifying round trip.

    '
- id: VOC-123-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative: no founder
    approved-comment gate on engineering-workflow adopt/merge/release paths; exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    and fail-closed behavior remain mandatory.

    '
- id: VOC-123-DEP-02
  status: 'resolved at drafting time by reading the current workflows. implement.yml
    Commit implementer''s work binds SOURCE_HEAD_SHA=$(git -C karsift-ai-infra rev-parse
    HEAD) then `git -C karsift-ai-infra bundle create /tmp/implementer-source.bundle
    "${{ steps.infra-checkout.outputs.base_sha }}..$SOURCE_HEAD_SHA"`. That matches
    the live #1003 empty-bundle failure. Caller recovery uses `git bundle create /tmp/implementer-work.bundle
    "${{ steps.branch.outputs.integration_sha }}..HEAD"`. Planner recovery uses `git
    bundle create /tmp/planner-work.bundle "${{ steps.branch.outputs.base_sha }}..HEAD"`.
    Existing VOC-121 nested-bundle tests create `source_base..HEAD` or `base_sha..$branch`
    and therefore do not reproduce the production raw-SHA defect.

    '
- id: VOC-123-DEP-03
  status: 'resolved at drafting time. VOC-121 already landed isolated source publication:
    nested edits are committed in isolated repository state, bundled, uploaded, and
    published from a clean publish-source job with an infrastructure-scoped App token,
    force-with-lease, exact lineage checks, and a non-closing Relates-to source PR.
    This package does not reopen that publication contract. It closes the remaining
    bundle-create gap: a named positive revision must advertise the exact committed
    head.

    '
- id: VOC-123-DEP-04
  status: 'resolved at drafting time as an accepted delivery constraint: coordinated
    PRs in the caller and KARSIFT/karsift-ai-infra remain one task. Repository count,
    workflow-versus-tests-versus-docs, and fixture/pin work are not split reasons.
    Pin the caller fixture only if that fixture actually consumes the infra change.
    Merge the independently reviewed infra PR first, then pin to that exact merge
    SHA.

    '
- id: VOC-123-DEP-05
  status: 'resolved at drafting time as a hard dependency that must not expand this
    package. Adopted VOC-122-T00 (#1003) cannot deliver nested infrastructure until
    this carrier-integrity defect is repaired. This package must not implement VOC-122
    promotion-recovery replan behavior, must not hand-patch or push #1003, and must
    not split #1003 delivery into this roster. After this package''s exact reviewed
    infra merge is pinned, reconcile/re-dispatch #1003 against that revision as a
    separate already-authorized task.

    '
- id: VOC-123-DEP-06
  status: 'open at drafting time as an implementer-facing structure choice, not a
    planner guess past the required behavior. The isolated temporary ref''s exact
    name/namespace (for example refs/karsift/source-bundle-head versus a throwaway
    local branch) and whether create/verify/cleanup live inline in implement.yml or
    in a small helper are implementation choices. Constraints that are not open: bind
    the exact 40-character SOURCE_HEAD_SHA; advertise exactly that committed head;
    do not reuse the remediation `source-carrier` branch name or the publish branch;
    do not advertise unrelated refs; delete the temporary ref afterward; fail closed
    on wrong/missing/multiple advertised heads. Caller/planner `..HEAD` paths stay
    unchanged unless tests reproduce empty-bundle or unsafe advertised-head behavior.

    '
