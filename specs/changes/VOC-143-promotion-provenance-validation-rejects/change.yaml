base_sha: 'Issue-creation promotion PR #1119 head is 376e00dd769253d7a255660f5391fb208781e2f3.
  Issue-creation infrastructure pin is VOC-142 merge 8993e867640dfb604dec0466c4e0787e68d8e258
  and is not the defective contract for this failure class; the defect is the caller
  VOC-112 provenance assertion. Implementation must record the actual implementation
  PR base separately at dispatch, fail closed on unrelated/material movement of develop,
  and must not treat this package''s own plan/adoption/roster commits as protected-file
  drift. Do not snapshot the current develop/main gap. Do not pin-advance unless an
  in-scope infra contract change is proven necessary.

  '
