planned_implementation_risk_floor: 'R3. This package repairs VOC-112 capture provenance
  so a legitimate current AGENTS.md documentation update with an intentionally unmodified
  historical fixture can pass promotion-path validate (squash-safe-push) and ci /
  ci (promotion pr-validation). scripts/foundation/*.mjs is an R1 path floor. Semantic
  mutation of required-check provenance used before develop-to-main promotion is CI/CD
  / governance-enforcement (R3). Editing .github/workflows/repository-governance.yml
  would raise the path floor to R4 and is out of scope unless SHA passing is proven
  insufficient. This is a draft proposal for human adoption review, not a determination.
  The path classifier and independent verifier remain authoritative.

  '
