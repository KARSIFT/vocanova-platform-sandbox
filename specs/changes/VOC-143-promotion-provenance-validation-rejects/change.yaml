authority_model: a004-active
requirement_source: 'GitHub issue #1120 (Promotion provenance validation rejects legitimate
  AGENTS.md change under squash-safe-push), including its original body. Automatic
  VOC-142 develop-to-main promotion PR #1119 is blocked on exact head 376e00dd769253d7a255660f5391fb208781e2f3.
  Required validate and ci / ci fail during the promotion path. Release audit issue
  #1118 remains open. Reproduction: merge a governed implementation PR that changes
  AGENTS.md without recapturing the historical VOC-112 benchmark fixture (VOC-142-DEP-07);
  let automatic develop to main promotion run; node --test scripts/foundation/voc112-navigation-benchmark.test.mjs
  in that promotion validation context. Expected: squash-safe-push validates the historical
  capture against its correct immutable provenance anchor and permits an unrelated
  current AGENTS.md documentation update. Actual: the benchmark still requires the
  fixture historical agents_sha256 to equal the current working-tree AGENTS.md hash.
  Root cause: VOC-142 narrowed the working-tree AGENTS.md exception only for pr-validation;
  squash-safe-push retains unconditional working-tree equality, and promotion pr-validation
  still binds agents_sha256 to PR HEAD, so both required promotion checks fail. This
  draft package does not adopt or authorize itself.

  '
requirement_approval_status: issue-sourced requirement; this draft package is not
  adopted and does not authorize implementation
