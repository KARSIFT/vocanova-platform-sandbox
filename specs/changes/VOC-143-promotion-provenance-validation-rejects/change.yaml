    selects squash-safe-push for same-repository main <- develop promotion PRs and
    for push/non-PR events, while still exporting PR_BASE_SHA / PR_HEAD_SHA on pull_request.
    tooling/governance fixtures ci.yml uses --promotion-pr (pr-validation, VOC112_PROMOTION_PR=true)
    for that same promotion PR pair, so ci / ci binds agents_sha256 to PR HEAD via
    assertPrValidationMergeBase. VOC-142 therefore unblocked ordinary pr-validation
    (merge-base anchor) and left both promotion required checks failing against an
    unmodified historical fixture. resolveFixtureAgentsBase already walks from a tip
    to the ancestor whose AGENTS.md matches the fixture hash. Live PINNED_SHA.txt
    equals 8993e867640dfb604dec0466c4e0787e68d8e258 and is not this defect. An untracked
    local karsift-ai-infra/ checkout, if present, is not this repository''s tracked
    tree.

    '
