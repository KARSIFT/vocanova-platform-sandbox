planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real, task-scoped file list - consistent with how VOC-039/VOC-040/VOC-041/VOC-042
  handled this field. This package proposes R3 for the change as a whole because the
  most likely fix touches apps/web/src/lib/api-server.ts, a server-side auth-check
  boundary that every protected route under apps/web/src/middleware.ts's matcher ultimately
  depends on for a logged-in user to actually reach the page (not merely pass middleware).
  This is a draft proposal for the reviewing human at adoption time, not a determination.
authority_model: a003-active
requirement_source: 'GitHub issue #333 ("Server-rendered pages'' own /api/v1/me check
  fails with 401 immediately after middleware.ts''s identical check succeeds, blocking
  real onboarding after Google sign-in"), including its full body (the only content
  on the issue at drafting time - no comments existed yet). The issue documents a
  three-times-reproduced live pattern against production (nginx access logs showing
  200, 200, 401 for three server-side /api/v1/me calls in one request lifecycle, reproduced
  even after fully clearing browser cookies), rules out stale/duplicate cookies and
  IP-based rate limiting with cited evidence, names the two candidate call sites (apps/web/src/middleware.ts''s
  raw request.headers.get("cookie") forward versus apps/web/src/lib/api-server.ts''s
  next/headers cookies()-based reconstruction), and proposes - without asserting as
  confirmed - that the implementer instrument both paths on a single real request
  to find the exact divergence before fixing it.'
requirement_approval_status: 'Not approved. This package is an unreviewed draft prepared
