planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real task-scoped file list. This package proposes R2 for the change as
  a whole because it adds CI/deploy-workflow gating and a disposable seeded test account
  rather than changing real user-facing behavior - but two individual tasks (T00's
  migration/seed touching apps/api/migrations, and T01's session-minting mechanism
  touching apps/api/business/auth, an authentication protected area) may independently
  float to a higher path-detected floor at classification time. This is a draft proposal
  for the reviewing human at adoption time, not a determination, and the human may
  reasonably set individual tasks higher than the package-level R2.
canonical_path: specs/changes/VOC-050-run-core-loop-e2e-against-real-staging-and-gate
authority_model: a003-active
requirement_source: 'GitHub issue #391 ("Run core-loop E2E against real staging and
  gate production auto-promotion on it"). The issue states apps/web/tests/e2e/core-loop.spec.ts
  already exists as a full authenticated user-journey Playwright test but only ever
  runs against mock-api-server.mjs; deploy-staging.yml only polls /healthz, which
  proves containers started but not that the app works against the real Go API and
  Postgres; deploy-production.yml''s smoke-test suite already anticipates a real core-loop
  check but it is a non-fatal SKIP because SMOKE_TEST_SESSION_COOKIE was never provisioned;
  and combined with the founder-authorized auto-release-to-main/production-deploy
  path, a change can pass mocked CI, deploy to staging, look healthy, and auto-promote
  straight to production without the real user journey ever being exercised against
  real infrastructure. The issue requests: (1) a dedicated, clearly-marked synthetic
  test user seeded automatically on staging and production deploy, with its session
  minted server-side in CI so SMOKE_TEST_SESSION_COOKIE / a staging equivalent is
  available without manual steps; (2) running core-loop.spec.ts for real against https://staging.vocanova.site
  right after deploy-staging.yml''s existing /healthz poll passes; (3) making a failed
  staging core-loop run a hard block on auto-promotion to main/production; (4) wiring
  the existing SKIP production core-loop check to actually run now that a real session
  cookie exists, keeping smoke-test-production.sh''s no-side-effects design intact.
  The issue also states this does not change any R0-R4 risk classification or founder-approval
  requirement - it only adds a required, mostly-automated staging gate ahead of the
  already-authorized R0-R2 auto-promotion path.'
