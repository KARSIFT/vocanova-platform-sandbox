dependencies:
- id: VOC-050-DEP-00
  status: unresolved at drafting time. This package's entire premise (core-loop.spec.ts,
    mock-api-server.mjs, deploy-staging.yml's /healthz-only poll, and smoke-test-production.sh's
    non-fatal SKIP for the core-loop check) was independently re-confirmed by reading
    the actual files during drafting, not merely assumed from the issue text - see
    specification.md's "Confirmed findings" section.
- id: VOC-050-DEP-01
  status: 'unresolved at drafting time. This package cannot itself modify release.yml:
    per AGENTS.md and karsift-ai-infra''s config/roles.yml, release.yml lives in the
    karsift-ai-infra repository, not this repository, and this planner run is scoped
    to vocanova-platform-sandbox only - it has no authority to write into a different
    repository. tasks.md''s T03 is therefore scoped as "make deploy-staging.yml''s
    E2E step fail closed (no continue-on-error, non-zero exit on failure) and document,
    as an explicit open item for the reviewing human, the cross-repo dependency that
    karsift-ai-infra''s release.yml must actually gate its auto-promote decision on
    that job''s conclusion for the develop-tip commit" rather than assuming this package
    alone can deliver end-to-end hard-blocking. See specification.md''s open question
    1 and impact-analysis.md''s VOC-050-R02.'
- id: VOC-050-DEP-02
  status: unresolved at drafting time. The exact mechanism for making the seeded synthetic
    account "obviously synthetic" and "never reachable via real signup paths" (constraint
    from the issue) depends on how apps/api's signup/magic-link path currently validates
    email addresses and how staging/production presently gate new-user signup - this
    drafting pass found NEW_USER_SIGNUP_ENABLED / NEW_USER_SIGNUP_ALLOWLIST config
    in deploy-production.yml but did not find an existing reserved-domain or email-blocklist
    mechanism in apps/api/business/auth to build on. T00's implementer must confirm
    the current behavior and choose a concrete mechanism (e.g. a reserved, non-deliverable
    email domain plus an explicit is_synthetic_test_account flag checked at the signup/magic-link
    entry point), not assume one exists already.
