dependencies:
  - id: VOC-104-DEP-00
    status:
      "resolved at drafting time. Issue #872 records sanitized observation that
      ready_for_review reran full CI and independent review for unchanged exact head
      SHAs on PRs #868 and #869 (run IDs above)."
  - id: VOC-104-DEP-01
    status:
      resolved at drafting time. Caller pipeline already subscribes to ready_for_review
      so draft PRs can become merge-eligible without a new commit; merge-gate already
      blocks draft PRs and rechecks open/draft state plus reviewed base/head immediately
      before merge. The missing piece is skipping redundant CI and model review when
      reuse is safe.
  - id: VOC-104-DEP-02
    status:
      "resolved at drafting time. Cross-repo pattern from VOC-080 / VOC-097 /\
      \ VOC-102 \u2014 reusable workflow behavior lands in KARSIFT/karsift-ai-infra;\
      \ this package authorizes the required outcome. Do not treat an untracked local\
      \ karsift-ai-infra/ checkout as this repository's tracked tree."
  - id: VOC-104-DEP-03
    status:
      "resolved during draft refinement. Use one reusable, read-only eligibility\
      \ workflow/helper surfaced as a caller job; caller conditions consume its machine\
      \ decision so ci/review/plan-review do not reimplement the predicate."
  - id: VOC-104-DEP-04
    status:
      "resolved during draft refinement. Apply the optimization to both agent/ task\
      \ PRs and plan/ planning PRs, with the matching trusted review check (review\
      \ / publish-review vs plan-review / publish-plan-review) and identity fields."
  - id: VOC-102
    status:
      Adopted predecessor that explicitly deferred duplicate exact-SHA review
      fixes to a separate follow-up. This package is that focused root.
