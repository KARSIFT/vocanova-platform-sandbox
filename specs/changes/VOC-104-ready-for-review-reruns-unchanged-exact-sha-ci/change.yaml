production_impact:
  none-intentional for application runtime. Changes governance automation
  so an unchanged exact base/head ready_for_review transition reuses prior green required
  checks and a trusted App-signed PASS verdict instead of repeating full CI and model
  review, while still re-running deterministic merge-gate evaluation. Does not change
  production deploy semantics, signup policy, secrets, databases, Kuma inventory,
  or Sentry ingestion.
