    hashes from a fetched exact merge before committing them into the regression.
    Committed evidence must name the immutable carrier base, the final infra merge,
    the confirmed hashes, and the contract that the live implementation head is bound
    by the App-authored independent-review comment/check. Evidence must not require
    a commit to contain its own SHA. Evidence must not claim a protected-path revert
    unless that path is absent from the diff against the carrier base.'
- id: VOC-134-DEP-10
  status: 'resolved at drafting time as the feasible exact-revision evidence contract.
    VOC-133-D12 / TEST-10 as interpreted by PR #1065 required a tracked file to name
    the SHA of the same commit that contains it. That is Git-impossible: changing
    the file changes the commit SHA. This package keeps exact-revision binding fail-closed
    by requiring the App-authored independent-review comment/check to bind the live
    PR head exactly, requiring merge-gate to reject any mismatch, and allowing post-merge/root-issue
    audit to record the reviewed head and merge SHA. Committed package evidence records
    the immutable carrier base, exact infra merge, hashes, validation, and where later
    exact-head binding will be published. Tests must not mutate evidence at runtime
    to make that contract appear true.'
- id: VOC-134-DEP-11
  status: "resolved at drafting time as an immutable carrier-base selection rule.\
    \ Expected current develop at drafting is 95a779f9e62090f856ed03f389e7ac1d901aaa14.\
    \ Implementation must resolve current develop to a 40-character SHA before any\
    \ in-scope edit. If that SHA equals 95a779f9e62090f856ed03f389e7ac1d901aaa14,\
    \ that SHA is the immutable carrier base. If it differs, fail closed: do not implement\
    \ against a moved tip without first recording the newly observed exact SHA as\
    \ the pre-edit immutable constant in tests and t00-evidence.md, and do not treat\
    \ a moving branch name as authority after that constant is selected. The regression\
    \ must require the exact commit object and all five VOC-112 paths plus package.json\
    \ to resolve, and must fail\u2014not skip\u2014if proof cannot run."
