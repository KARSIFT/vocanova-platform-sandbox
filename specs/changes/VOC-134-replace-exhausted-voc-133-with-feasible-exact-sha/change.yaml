requirement_source: 'GitHub issue #1066 (Replace exhausted VOC-133 with feasible exact-SHA
  evidence and complete infra #166 release), including its original body. VOC-133-T00
  issue #1063 / PR #1065 exhausted attempts 1 and 2. Exact reviewed heads: attempt
  1 e88fbda6274488bed898877151bbcc1714a45450 independent FAIL https://github.com/KARSIFT/vocanova-platform-sandbox/pull/1065#issuecomment-5441321518;
  attempt 2 70930cf0572f73f254429a240c5328640846e0a9 independent FAIL https://github.com/KARSIFT/vocanova-platform-sandbox/pull/1065#issuecomment-5441659390.
  Attempt 1 added package.json plus scripts/foundation/ensure-voc112-capture-commits.mjs,
  fetching a missing VOC-112 capture commit before pnpm test and making the required
  full-checkout local fail-closed behavior unreachable. Attempt 2 removed the helper
  but still changed package.json to force VOC112_CAPTURE_PROVENANCE_MODE=pr-validation
  with both PR SHAs set to HEAD, again bypassing the default local fail-closed path.
  It also added a mutable evidence-stamping helper and an in-memory rewrite that allowed
  tests to pass while committed evidence named the prior failed head. Supervisor finding
  on attempt 1: https://github.com/KARSIFT/vocanova-platform-sandbox/pull/1065#issuecomment-5441214837.
  There is a specification defect in VOC-133-D12 / TEST-10 as interpreted by those
  attempts: a tracked file in a commit cannot contain the SHA of that same commit.
  Exact reviewed-revision binding must remain fail-closed, represented by the immutable
  App-authored independent-review comment/check and PR metadata (and post-merge audit
  comment), not by an impossible self-referential value in the same Git tree. This
  package is the governed replacement authority. Do not reuse, merge, cherry-pick,
  or compose PR #1051, #1056, or #1065. Do not redispatch VOC-132-T00 (#1059) or VOC-133-T00
  (#1063). Do not manufacture completion markers for VOC-129 through VOC-133. Pin
  target remains f3d79177bf8a9abe0dae550f39502165d494c576. Expected immutable carrier
  base at drafting is 95a779f9e62090f856ed03f389e7ac1d901aaa14; implementation must
  revalidate current develop at dispatch and fail closed if it moved unexpectedly.
  This draft package does not adopt or authorize itself.'
