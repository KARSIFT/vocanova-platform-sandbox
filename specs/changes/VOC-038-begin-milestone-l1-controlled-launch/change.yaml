planned_implementation_risk_floor: 'Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real file set, for the same reason VOC-037 recorded: each task
  (T00-T07 below) needs its own approved, task-scoped file list before the
  classifier means anything. This package proposes R4 for the milestone as a
  whole because DOC-12 section 5''s own L1 gate requires a founder-authored
  hold/expand decision, and multiple tasks (T00 cohort/allowlist design, T04
  AI-cohort enablement, T05 expansion thresholds) directly govern real user
  exposure and AI cost/safety - the exact kind of material product-direction,
  user-trust, and launch-control decision docs/governance/change-risk-classification.md
  reserves to founder judgment, not automation. This is a draft proposal for
  founder review at adoption time, not a determination.'
canonical_path: specs/changes/VOC-038-begin-milestone-l1-controlled-launch
