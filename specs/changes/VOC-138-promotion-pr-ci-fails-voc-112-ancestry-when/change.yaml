requirement_source: 'GitHub issue #1091 (Promotion PR CI fails VOC-112 ancestry when
  captured

  commit is not reachable), including its original body. Fresh promotion PR

  #1090 (main <- develop) at exact head

  87f0efcb94a213a0ede9fdbca94a707a22d42b86 cannot pass required ci / ci.

  PR run 33122154521, jobs 98691441027 and rerun 98692552949, each fail

  VOC-112-TEST-12 and VOC-112-TEST-13 with "PR ancestry mode requires every

  captured commit object" because subject

  f9d11e232a07c7d7a9c433d02c9267912543ba10 is not resolvable in the synthetic

  promotion checkout. Dispatch recovery run 33122158425 succeeds (339

  foundation tests) via the weaker non-PR squash-safe path; it is incident

  evidence only and is not sufficient promotion-check proof. reconcile-release runs

  33122099253 and 33122436137 cannot converge. First reported

  selected_required_run_mismatch; the documented retry reran the original PR

  job, which failed identically. No production promotion occurred. main remains

  0d0b0cdf0692d0349f380e9cae3285b4c7916b05. Live PINNED_SHA.txt already equals

  infrastructure #167 merge b263c0c110591cc798b89277dfc35542abb1597b. This draft

  package does not adopt or authorize itself.

  '
