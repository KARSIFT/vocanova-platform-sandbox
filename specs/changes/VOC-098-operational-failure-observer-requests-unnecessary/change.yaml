authority_model: a004-active
requirement_source: "GitHub issue #840 (Operational failure observer requests unnecessary\
  \ Actions permission). Drafting-time repo read of .github/workflows/operational-failure-monitoring.yml:\
  \ the Mint issue-writer installation token step requests permission-issues: write\
  \ and permission-actions: read together; VOC-094 added Actions read so classify-deploy-concurrency-cancel.sh\
  \ can call the Actions jobs API. The repository GitHub App installation does not\
  \ grant Actions, so create-github-app-token fails before open-failure-issue.sh runs\
  \ \u2014 including for scheduled-synthetics failures that never need the classifier.\
  \ This draft package does not adopt or authorize itself."
