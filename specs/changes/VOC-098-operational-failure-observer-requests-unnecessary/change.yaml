production_impact: none-intentional for application runtime. Restores the repository-managed
  operational-failure observer's ability to mint an App installation token and open
  or deduplicate sanitized issues when watched workflows end non-successfully. No
  application, signup, secret, database, or Kuma inventory changes.
rollback_required: true
monitoring_impact:
  state: none
  rationale: Changes only how the operational-failure observer mints and scopes tokens
    for issue write versus bounded Actions metadata reads. No page routes, critical
    API endpoints, or stable monitor/synthetic IDs in infra/monitoring/monitors.yaml
    or infra/monitoring/synthetics.yaml are added or changed.
dependencies:
- id: VOC-098-DEP-00
  status: 'resolved at drafting time. Issue #840 states the App token request includes
    Actions read that the installation does not grant; token mint fails before the
    sanitized issue writer runs.'
- id: VOC-098-DEP-01
  status: 'resolved at drafting time. VOC-088-T02 owns operational-failure-monitoring.yml
    and open-failure-issue.sh (App-authored issues, sanitization, marker dedupe, concurrency
    serialization). VOC-094-T00 added permission-actions: read and classify-deploy-concurrency-cancel.sh
    for benign deploy cancel classification.'
- id: VOC-098-DEP-02
  status: resolved at drafting time. docs/operations/staging-controlled-signup.md
    already documents a controlled cancelled scheduled-synthetics fixture for observer
    live proof; T01 reuses that pattern rather than inventing a new failure mechanism.
- id: VOC-088
  status: Adopted predecessor. This package must not weaken App-only issue creation,
    sanitization, marker deduplication, fail-closed observer behavior, or serialized
    concurrency.
- id: VOC-094
  status: Adopted predecessor that introduced App-token Actions read for the benign-cancel
    classifier. This package keeps the classifier and its fail-closed semantics while
    moving Actions API reads off the App installation token.
