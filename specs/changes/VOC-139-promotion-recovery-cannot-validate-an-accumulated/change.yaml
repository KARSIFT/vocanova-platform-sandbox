requirement_source: "GitHub issue #1096 (Promotion recovery cannot validate an accumulated\
  \ develop-to-main PR), including its original body. After VOC-138 caller PR #1095\
  \ merged to develop as 4812fb91ab1b674f9a9ec03906f90c0edf50421d, promotion PR #1090\
  \ (main <- develop) with immutable base 0d0b0cdf0692d0349f380e9cae3285b4c7916b05\
  \ and head 4812fb91ab1b674f9a9ec03906f90c0edf50421d still cannot pass required ci\
  \ / ci. Synchronized pull-request run 33130426061, job 98718413924, selects VOC112_CAPTURE_PROVENANCE_MODE=pr-validation\
  \ as VOC-138 intended but fails VOC-112-TEST-12 and VOC-112-TEST-13 with \"AGENTS.md\
  \ hash must be anchored in the PR merge base\" (stored/head hash b0e65629\u2026\
  \ versus main/base hash 5ba216ff\u2026). Documented recovery gh workflow run pipeline.yml\
  \ --ref develop -f action=reconcile-release -f release_issue_number=1089 produced\
  \ release run 33130473438 which dispatched recovery run 33130527834 (display title\
  \ promotion-pr-validation PR #1090). Recovery job 98718739912 fails before checkout\
  \ at gh pr view \"$PROMOTION_PR_NUMBER\" with fatal: not a git repository because\
  \ the job does not pass --repo / -R and has no checkout/current repository context.\
  \ Live PINNED_SHA.txt equals VOC-138 infra merge 123735c80fec813a5b46a004f3e1122bd425cde2.\
  \ No production promotion occurred. This draft package does not adopt or authorize\
  \ itself.\n"
