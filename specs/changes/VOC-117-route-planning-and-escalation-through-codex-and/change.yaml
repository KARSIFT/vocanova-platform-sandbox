- id: VOC-117-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative: no founder
    `approved` comment gate on engineering-workflow adopt/merge/release paths; exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    credential isolation, and fail-closed behavior remain mandatory.

    '
- id: VOC-117-DEP-02
  status: 'unresolved until implementation. Workflows currently strip a `cursor/`
    prefix and pass the remainder to Cursor CLI `--model`. Implementation must make
    parameterized stored values such as `grok-4.6[fast=false]` and `grok-4.6[effort=high,fast=false]`
    compatible with the pinned Cursor CLI without silent fallback to another vendor
    or model. Exact CLI flag/slug mechanics are an implementer verification detail,
    not a package authority to invent alternate bindings.

    '
- id: VOC-117-DEP-03
  status: 'resolved at drafting time as an accepted tradeoff of the superseding mapping:
    `implementer` and `implementer_escalation` both bind to `cursor/composer-2.5`,
    so attempt-2 escalation is same-model rather than a different lab. Preserve one-retry
    limits; do not invent a different escalation model.

    '
- id: VOC-117-DEP-04
  status: 'resolved at drafting time as an accepted tradeoff of the superseding mapping:
    `planner`, `reviewer`, `reviewer_fast_retry`, and `plan_reviewer` all use the
    `grok-4.6` model ID with explicit Standard/non-fast parameters; `plan_reviewer`
    additionally pins `effort=high`. Cross-family independence from implementer (Composer)
    is preserved; planner vs plan_reviewer independence is parameter-level within
    the same model ID by request.

    '
