requirement_source: 'GitHub issue #269 ("VOC-037: VOC-037-T06 - Production infrastructure
  provisioning"), which dispatches task VOC-037-T06 from adopted package VOC-037 (specs/changes/VOC-037-begin-milestone-r2-production-readiness-docs).
  Issue #269 records that this task was added as a follow-up after VOC-037''s adoption
  (founder-gate delegate, 2026-08-01) because VOC-037''s original T00-T05 roster never
  actually built the production target that T03 and T04 need to verify against; T00
  and T01 only produced decision records, per those tasks'' own explicit non-goals.
  This task (VOC-038) executes VOC-037-D00''s accepted decision (Option A-modified:
  production co-located on the same physical host as staging, logically isolated,
  portable to a future dedicated host) and VOC-037-D01''s accepted decision (corrected
  mechanism 4A: a production-only directory tree distinct from staging''s, a separate
  vocanova-production Compose project, and a separate least-privilege deploy user)
  exactly as recorded in specs/changes/VOC-037-begin-milestone-r2-production-readiness-docs/t00-production-hosting-decision-record.md
  and .../t01-production-secrets-decision-record.md. It does not make any new hosting,
  secrets-mechanism, or architecture decision; per issue #269''s own framing, "it
  does not make new decisions." This package''s own drafting run does not itself decide
  anything either -- see specification.md''s open questions for what remains outstanding
  (exact production hostname/DNS names, and the shared- host resource-limit values),
  each of which VOC-037-T00/T01 already flagged as a founder-confirmable implementation-time
  detail rather than a new decision this package must make.

  '
requirement_approval_status: 'not-approved. This package is a draft proposal only.
  VOC-037-D00 and VOC-037-D01 are themselves already founder-accepted (2026-08-01),
  and this package''s scope is bounded to executing those two accepted decisions without
  reopening them -- but VOC-038 itself, as a new change package, has not been adopted,
  and none of its tasks are implementation-authorized. Adoption, and each task''s
  own separate implementation authorization, remain required per AGENTS.md''s change
  workflow.

  '
