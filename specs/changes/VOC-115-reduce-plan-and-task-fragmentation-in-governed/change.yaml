schema_version: 1
id: VOC-115
slug: reduce-plan-and-task-fragmentation-in-governed
title: Reduce plan and task fragmentation in governed engineering workflow
type: governance
status: draft
risk: R4
planned_implementation_risk_floor: 'R4. This package changes governance/workflow prompts,
  protected operating-model documentation, change-package templates, lifecycle validation,
  and mirrored karsift-ai-infra fixture coverage for planning, adoption, and task
  sequencing. This is a draft proposal for human adoption review, not a determination;
  the path classifier and independent verifier remain authoritative.

  '
canonical_path: specs/changes/VOC-115-reduce-plan-and-task-fragmentation-in-governed
authority_model: a004-active
requirement_source: 'GitHub issue #962 (Reduce plan and task fragmentation in governed
  engineering workflow). Required behavior: default one coherent objective to one
  package; default each new package to one end-to-end implementation task; keep causally
  related, in-scope failures within the active package/carrier when objective, acceptance
  criteria, risk ceiling, and protected-area scope remain unchanged; require explicit
  split reasons for every task after the first; preserve exact-SHA review, deterministic
  risk floors, protected-branch rules, fail-closed checks, and justified sequential
  auto-advance for genuine multi-task packages. Acceptance evidence requires planner
  tests, split-reason enforcement, justified multi-task coverage, and docs/tests proving
  in-scope causal failures may remain under the active package while unrelated or
  authority-expanding work still requires a new plan. This draft package does not
  adopt or authorize itself.

  '
requirement_approval_status: draft proposal from approved issue thread; human adoption
  review required
base_branch: develop
base_sha: unknown - not recorded by this draft; set at adoption time if needed
target_branch: develop
owners:
  decision: unassigned
  package_preparation: planner (drafting only; adoption remains a human/autonomous
    governed decision)
  implementation: unassigned
  independent_verification: unassigned
approval_status: not-approved
implementation_authorized: false
automatic_merge_allowed: true
production_impact: 'none-intentional for application runtime. This package changes
  governance, prompts, templates, validation, and mirrored lifecycle fixtures, not
  product runtime behavior. It may indirectly reduce workflow cost and elapsed time
  for future packages, but it does not itself authorize production deployment, release
  bypass, relaxed review, or broader credentials.

  '
rollback_required: true
monitoring_impact:
  state: none
  rationale: 'Planner/plan-review prompt, governance-document, template, validation,
    and mirrored fixture change only. No page routes, critical API endpoints, monitor
    inventory, or synthetic inventory in infra/monitoring/ are added or changed.

    '
dependencies:
- id: VOC-115-DEP-00
  status: 'resolved at drafting time. Issue #962 provides the objective, problem statement,
    required behavior, acceptance evidence, and suggested implementation scope with
    enough specificity to draft a package without a clarifying round trip.

    '
- id: VOC-115-DEP-01
  status: 'resolved at drafting time. Active A-004 governance in AGENTS.md and CLAUDE.md
    remains authoritative: no founder `approved` comment gate on engineering-workflow
    adopt/merge/release paths, but exact-SHA independent verification, deterministic
    risk floors, protected-path controls, and fail-closed behavior remain mandatory.

    '
- id: VOC-115-DEP-02
  status: 'resolved at drafting time. Current planner prompt and mirrored fixture
    still direct "small, ordered" independently reviewable tasks, and adopt opens
    one issue per task with serial dependency edges in `.karsift/tasks.json`.

    '
- id: VOC-115-DEP-03
  status: 'resolved at drafting time. Current operating-model documentation still
    contains language that can be read as favoring task splitting (`docs/operations/15-...`
    says tasks are small, ordered, verifiable, and stable), so canonical governance
    and workflow docs must be reconciled together with automation and tests.

    '
