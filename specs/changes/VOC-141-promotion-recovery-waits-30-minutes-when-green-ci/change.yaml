requirement_source: "GitHub issue #1109 (Promotion recovery waits 30 minutes when\
  \ green CI has an unattestable parent), including its original body. This is a causal\
  \ residual of post-merge VOC-140 release verification. Promotion recovery correctly\
  \ rejects a green ci / ci check whose parent pipeline is a release carrier, but\
  \ apply_promotion_pr_recovery_plan derives dispatch_contexts only from plan_required_check_recovery,\
  \ which returns no missing/failed CI context when GitHub's required row is already\
  \ SUCCESS. Live reproduction: repository KARSIFT/vocanova-platform-sandbox, promotion\
  \ PR #1090, exact promotion head c3a53bab3035b7f08c0fb959bdf1b56bf330d291, infrastructure\
  \ policy KARSIFT/karsift-ai-infra@67bdfd13ef875dead23ce4be01d7d0e8b976e289, failing\
  \ release carrier run 33340381776 job 99334840338 step Recover missing exact-head\
  \ promotion checks started 2026-08-30T22:54:51Z ended 2026-08-30T23:25:23Z with\
  \ diagnostics mode=promotion_pr missing_checks=none pending=0 failed=0 successful=6\
  \ then exit 1. Duplicate native carrier 33340516672 entered the identical no-progress\
  \ step. Workaround gh workflow run pipeline.yml --ref develop -f action=recover-promotion-pr-checks\
  \ -f promotion_pr_number=1090 produced dedicated run 33341923799 SUCCESS on exact\
  \ head c3a53bab\u2026; subsequent reconcile-release run 33342062118 succeeded including\
  \ the production merge guard. This draft package does not adopt or authorize itself.\n"
requirement_approval_status: approved requirement; package adopted automatically after
  exact-revision independent verification
