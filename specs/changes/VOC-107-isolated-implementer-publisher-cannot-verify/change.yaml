    \ karsift-ai-infra/ checkout as this repository's tracked tree."
- id: VOC-107-DEP-03
  status: resolved at drafting time. The soft-reset commit step must continue to use
    the pre-model tip (today's base_sha) so attempt-2 does not squash prior published
    task commits into the new attempt. Bundle and publish ancestry must use a separate
    integration-anchored range.
