- id: VOC-107-DEP-01
  status: resolved at drafting time. Drafting-time read of karsift-ai-infra .github/workflows/implement.yml
    confirms Bundle committed work creates base_sha..HEAD and the publish job fetches
    only integration_branch before bundle verify. On attempt 2+, Create implementation
    branch sets base_sha to HEAD after checkout/rebase of the existing agent branch,
    which is not necessarily an integration ancestor object present in the publisher's
    bare repo.
- id: VOC-107-DEP-02
