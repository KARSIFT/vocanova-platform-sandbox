requirement_source: 'GitHub issue #891 (Isolated implementer publisher cannot verify
  incremental remediation bundles). Observed run 32539352323: a supervised remediation
  run produced a valid committed fix and recovery bundle, but the clean isolated publisher
  rejected the bundle before publication because it fetched only the integration branch
  while the incremental bundle declared the existing task-PR head (or a locally rebased
  derivative) as a prerequisite. Root cause: implement.yml creates recovery/publish
  bundles from base_sha..HEAD; on remediation, base_sha can be the existing PR head
  or a rebase-derived tip not reachable from the integration tip the publisher fetches.
  git bundle verify correctly refuses the thin bundle. Required outcome: complete
  task-branch-only lineage anchored to reviewed integration; preserve isolated publisher
  controls and two-attempt cap; add deterministic end-to-end Git fixture including
  rebase-derived lineage and a negative malformed/stale case. This draft package does
  not adopt or authorize itself.'
