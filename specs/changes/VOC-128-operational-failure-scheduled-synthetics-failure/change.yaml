    workflow failure and must not weaken deduplication or sanitization.'
- id: VOC-086
  status: Adopted predecessor that owns scheduled-synthetics.yml, synthetics.yaml
    stable IDs, and hourly coverage of the five canonical checks.
- id: VOC-098
  status: Adopted predecessor that removed unnecessary Actions permission from the
    observer App token. This package must not put Actions write on that App. Same-repo
    dispatch, if needed, uses job-level GITHUB_TOKEN only.
- id: VOC-110
  status: Adopted predecessor whose T01 live-evidence contract had to be retargeted
    from integration_contains_pr_head to exact_sha of the T00 merge because a develop-tip
