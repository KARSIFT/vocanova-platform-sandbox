- id: VOC-128-DEP-02
  status: resolved at drafting time. This failure class is distinct from VOC-093 (route-sweep
    smoke exit 1 with real steps on main) and VOC-090 (staging core-journey cancellation/timeout).
    VOC-108 explicitly excluded the scheduled-synthetics branch-selection footgun
    from its own scope.
- id: VOC-088
  status: 'Adopted predecessor. operational-failure-monitoring.yml opened issue #1037
