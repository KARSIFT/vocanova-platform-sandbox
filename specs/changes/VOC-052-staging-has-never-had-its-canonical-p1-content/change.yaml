dependencies:
- id: VOC-052-DEP-00
  status: 'unresolved at drafting time. This package''s entire premise (the migration
    file having zero INSERT statements, apps/api/cmd/seed existing and being documented
    as idempotent, and deploy-staging.yml never building/copying/ running it) was
    independently re-confirmed by reading the actual files during drafting, not merely
    assumed from the issue text - see specification.md''s "Confirmed findings" section.

    '
- id: VOC-052-DEP-01
  status: 'unresolved at drafting time. apps/api/cmd/seed is a plain `go build` target
    with no existing cross-compiled artifact or CI step that produces one; unlike
    apps/api/scripts/migrate.sh (a shell wrapper that installs a prebuilt Atlas binary)
    or seed-synthetic-smoke-user.sh (raw SQL run through `docker compose exec postgres
    psql`), the P1 content seed''s data lives embedded in a Go binary via //go:embed.
    T00''s implementer must decide, and record as an explicit decision rather than
    an unstated default, which of two viable mechanisms to use: (a) `go build` the
    `apps/api/cmd/seed` binary on the GitHub Actions runner during deploy-staging.yml
    (the runner already has the pinned Go toolchain available for apps/api''s own
    `pnpm test:api` step) and SCP the resulting static binary to the staging host
    as part of the existing deploy bundle, then run it there with DATABASE_URL pointed
    at the private Postgres bridge IP the same way migrate.sh already does; or (b)
    run `go run ./cmd/seed` (or a built binary) directly against the staging database
    from the GitHub Actions runner itself, before or instead of going through SSH,
    if the staging Postgres port is reachable from the runner (it currently is not
    published to the internet per the workflow''s own header comment, so this path
    would require a new, narrower exposure decision the implementer must flag rather
    than assume). This package does not resolve which mechanism to use - see specification.md''s
    open questions.

    '
- id: VOC-052-DEP-02
  status: 'unresolved at drafting time. Whether deploy-production.yml should also
    gain this step (T02) depends on a human decision this package cannot make on its
    own: production''s real-backend core-loop smoke check already has its own session-minting
    wiring from VOC-050-T04, but the founder has not yet made the decision to fully
    activate production''s real-backend smoke gating the way staging''s now is. Adding
    the P1 content seed to deploy-production.yml ahead of that activation decision
    would be new, unrequested scope; deferring it would leave the production tier
    with the same latent content gap staging had until this issue surfaced it. See
    specification.md''s open questions and tasks.md''s T02 framing as conditional
    on that human decision.

    '
affected_areas:
