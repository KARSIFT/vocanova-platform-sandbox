authority_model: a003-active
requirement_source: 'GitHub issue #437 ("Staging has never had its canonical P1 content
  seeded - real core-loop E2E fails at the discover step"). The issue reports that
  VOC-050''s first real run of the staging core-loop E2E check (tests/staging-e2e/core-loop.staging.spec.ts,
  run in deploy-staging.yml after every merge to develop) failed at the "discover
  a situation and open a word" step with zero journey-situation links rendered on
  the real /discover page, and traces the root cause to apps/api/migrations/20260725100000_voc026_p1_content_tables.sql
  creating the P1 content schema (journey_situations, canonical_words, word_meanings,
  word_examples, usage_notes, journey_words) with zero INSERT statements, combined
  with deploy-staging.yml never building, copying, or running the existing idempotent
  seed tool at apps/api/cmd/seed (which embeds voc026-p1.json and is documented in
  its own doc comment as safe to rerun). The issue states every prior PR-time E2E/accessibility
  check passed because those run against mock-api-server.mjs, which serves fixed fixture
  content regardless of the real database, so this gap was invisible until VOC-050-T02
  added the first real-backend staging check; it is explicit that this is not a regression
  VOC-050 introduced. The issue''s "suggested direction" section proposes adding a
  step to deploy-staging.yml (and, once its own SMOKE_TEST_SESSION_COOKIE is provisioned,
  deploy-production.yml) that builds and runs apps/api/cmd/seed against the target
  database after migrations apply, mirroring the existing seed-synthetic-smoke-user.sh
  step''s placement and idempotency posture, and explicitly leaves exact placement/sequencing
  to whoever picks it up.

  '
requirement_approval_status: 'Approved. Founder-delegate (acting under the standing
  founder-gate delegation for vocanova-platform-sandbox, confirmed explicitly this same
  session) adopted this draft package on 2026-08-09, mirroring the established
  convention of flipping adoption fields before merge so adopt.yml succeeds.'
