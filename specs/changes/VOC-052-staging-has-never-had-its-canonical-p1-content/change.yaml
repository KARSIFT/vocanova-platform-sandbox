title: Seed the Canonical P1 Content (journey_situations, canonical_words, and Related
  Tables) on Staging and Production Deploy
type: feature
status: adopted
risk: R3
planned_implementation_risk_floor: 'Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real task-scoped file list. This package proposes R3 for the change as
  a whole because every task''s affected area sits inside .github/workflows/ (deploy-staging.yml
  and, if T02 is adopted, deploy-production.yml), which docs/governance/change-risk-classification.md
  floors at R3 as a CI/CD and deployment-pipeline path class, and because the new
  step runs directly against the real staging (and possibly production) database during
  a live deploy. The seed tool itself (apps/api/cmd/seed) is documented as idempotent
  and additive (upsert-by-fixed-primary-key, no DELETE statements), which bounds the
  blast radius, but running any new step against a real database in a real deploy
  pipeline is squarely the kind of protected-area effect this repository''s risk floor
  exists to catch regardless of how safe the tool itself looks in isolation. This
  is a draft proposal for the reviewing human at adoption time, not a determination.

  '
