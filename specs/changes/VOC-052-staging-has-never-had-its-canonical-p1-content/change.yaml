production_impact: 'unknown until adopted and implemented. T00 (deploy-staging.yml)
  affects only the staging tier''s database content, additively (new rows via ON CONFLICT
  DO UPDATE upserts by fixed seed IDs; no destructive statement in apps/api/cmd/seed''s
  applySeed). T01 (the real-content staging E2E re-verification) has no production
  effect at all. T02 (deploy-production.yml parity), if adopted, would run the same
  idempotent seed against the real production database the first time deploy-production.yml''s
  own real-backend core-loop check is activated - this package proposes it but flags
  it as an open question in specification.md given production''s SMOKE_TEST_SESSION_COOKIE
  is intentionally still unset today (see the issue''s own note on this).

  '
