- id: VOC-113-DEP-01
  status: 'resolved at drafting time. merge-gate.yml already mints an App installation
    token and refuses github.token merges specifically so pull_request:closed can
    reach adopt; release.yml creates/merges promotion PRs with App credentials and
    evaluates authoritative exact-head checks. The observed failure is missing downstream
    workflow activation, not absence of App merge identity.

    '
- id: VOC-113-DEP-02
  status: "resolved at drafting time. Cross-repo pattern from VOC-080 / VOC-097 /\
    \ VOC-104 / VOC-107 / VOC-108 \u2014 reusable workflow behavior lands in KARSIFT/karsift-ai-infra;\
