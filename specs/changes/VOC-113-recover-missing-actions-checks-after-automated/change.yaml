    \ karsift-ai-infra/ checkout as this repository's tracked tree. Caller consumes\
    \ reusable workflows at @main.\n"
- id: VOC-113-DEP-03
  status: 'resolved at drafting time. Active branch ruleset requires governance-policy,
    validate, and ci / ci. Recovery must start genuine workflow runs bound to the
    exact SHA; synthesizing check runs or force-passing statuses is forbidden.

    '
- id: VOC-113-DEP-04
  status: 'open at drafting time for T00. Exact GitHub trigger/token/event root cause
