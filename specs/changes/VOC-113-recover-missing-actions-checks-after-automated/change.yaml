requirement_source: "GitHub issue #948 (Recover missing Actions checks after automated\
  \ merges and release PR creation). Live evidence 2026-08-24: final VOC-112 task\
  \ PR merged to develop without push workflows on the squash commit; release automation\
  \ opened promotion PR #947 without pull-request workflows or required checks; close/reopen\
  \ and draft/ready transitions did not recover checks; reconcile-release reused the\
  \ release audit and PR but could not merge because exact-head required checks do\
  \ not exist. Active ruleset correctly requires governance-policy, validate, and\
  \ ci / ci \u2014 must not weaken or synthesize statuses. Required: durable repository-managed\
  \ recovery for App-driven task merges and promotion PR creation; documented trigger/token/event\
  \ behavior; App auth preserved; exact SHA receives normal required validation/independent\
  \ review/merge-gate evidence; explicit reusable-workflow or dispatch orchestration\
  \ where event recursion suppression makes implicit triggers unreliable; fail closed;\
  \ no duplicate promotion PRs/releases/recursion/status fabrication; deterministic\
  \ tests; bounded timeout with sanitized diagnostics; complete PR #947 only after\
  \ genuine exact-head checks; verify post-promotion workflows before closing remediation.\
  \ This draft package does not adopt or authorize itself.\n"
