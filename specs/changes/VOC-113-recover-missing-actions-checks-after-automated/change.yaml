    must be determined from live metadata and documented in t00-evidence.md; planner
    does not invent a root cause beyond the observed missing-run symptom.

    '
- id: VOC-108
  status: 'Adopted predecessor owning authoritative exact-head check selection and
    idempotent release converge. This package must reuse that fail-closed selection
    and must not reintroduce aggregate/raw check-history poisoning.

    '
