requirement_source: 'GitHub issue #312 ("deploy-production.yml writes BASE_URL/OAUTH_REDIRECT_URI/OAUTH_REDIRECT_ALLOWLIST
  without the required :8443 port, breaking real Google sign-in via CORS"), including
  its full body (the only content on the issue at drafting time - no comments existed
  yet). The issue documents a direct live reproduction against the production host
  (nginx access/boot logs, the live api.env file via SSH, and a real browser sign-in
  attempt) and names its own suggested fix (append :8443 to the three values, matching
  the same workflow''s existing health-check step).'
