planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real file set - each task (T00-T01 below) needs its own approved, task-scoped
  file list before the classifier means anything, consistent with how VOC-039/VOC-040
  handled this field. This package proposes R3 for the change as a whole because it
  directly touches .github/workflows/deploy-production.yml, which writes the production
  authentication/CORS configuration boundary consumed by apps/api/app/api/production.go's
  corsAllowedOrigins - docs/governance/change-risk-classification.md names both "CI/CD"
  and "authentication/authorization" explicitly as R3-floor categories regardless
  of diff size (in this case, three string literals plus a comment). This is a draft
  proposal for the reviewing human at adoption time, not a determination.
