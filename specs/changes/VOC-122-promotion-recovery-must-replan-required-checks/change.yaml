automatic_merge_allowed: true
production_impact: 'none-intentional for application runtime. This package repairs
  promotion-check recovery so a required pull-request row that appears after the initial
  metadata snapshot can be rerun or left pending during the same recovery invocation.
  It does not change product behavior, deployment topology, credentials, providers,
  or monitor inventory. Restoring intended recovery may allow an already-reviewed
  promotion PR to merge through existing gates after genuine exact-head checks; that
  is not a new deploy path.

  '
rollback_required: true
monitoring_impact:
  state: none
  rationale: 'KARSIFT promotion-recovery reliability fix only. No page routes, critical
    API endpoints, monitor inventory, or synthetic inventory in infra/monitoring/
    are added or changed.

    '
dependencies:
- id: VOC-122-DEP-00
  status: 'resolved at drafting time. Issue #1001 provides the live promotion-PR reproduction,
    exact run/job IDs, root cause in actions-check-recovery-runner.py, required fail-closed
    contracts, one-task guidance, and test shape with enough specificity to draft
    without a clarifying round trip.

    '
- id: VOC-122-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative: no founder
    approved-comment gate on engineering-workflow adopt/merge/release paths; exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    and fail-closed behavior remain mandatory.

    '
- id: VOC-122-DEP-02
  status: 'resolved at drafting time by reading the current recovery runner. main()
    calls plan_required_check_recovery, validate_selected_workflow_run, rerun_selected_workflow,
    and dispatch_workflow only from the initial_gate_summary / pr_required_checks
    snapshot before the while loop. The loop only calls run_metadata_phase and recovery_complete.
    That matches the live #1000 failure class.

    '
- id: VOC-122-DEP-03
  status: 'resolved at drafting time. VOC-121 already landed exact selected-run recovery:
    a cancelled/failed ruleset-selected pull-request run is rebound and rerun by exact
    run ID; only a genuinely absent context uses workflow dispatch; alternate runs
    and same-named statuses cannot override GitHub''s required PR view. This package
    does not reopen that selection contract. It closes the remaining snapshot-then-poll
    gap: a row that is absent at plan time and later appears cancelled/failed is visible
    to recovery_complete but never planned in that same invocation.

    '
- id: VOC-122-DEP-04
  status: 'resolved at drafting time as an accepted delivery constraint: coordinated
    PRs in the caller and KARSIFT/karsift-ai-infra remain one task. Repository count,
    runner-versus-tests-versus-docs, and fixture/pin work are not split reasons. Pin
    the caller fixture only if that fixture actually consumes the infra change.

    '
- id: VOC-122-DEP-05
  status: 'open at drafting time as an implementer-facing structure choice, not a
    planner guess past the required behavior. Recovery may extract a helper that applies
    plan_required_check_recovery to the current required PR view, or keep planning
    inline, provided every poll (and the initial snapshot) uses the same fail-closed
    contracts and persistent once-per-run-id / once-per-absent-context dedupe. Do
    not invent a second satisfaction probe that can disagree with gh pr checks --required.

    '
