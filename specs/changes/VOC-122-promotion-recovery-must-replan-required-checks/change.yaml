schema_version: 1
id: VOC-122
slug: promotion-recovery-must-replan-required-checks
title: Promotion recovery must replan required checks that appear after its initial
  snapshot
type: infrastructure
status: draft
risk: R4
planned_implementation_risk_floor: 'R4. This package changes protected CI/CD promotion-recovery
  orchestration in KARSIFT/karsift-ai-infra (actions-check-recovery-runner, required-check
  planning, recover-actions-checks / release callers, and current-state recovery docs)
  and caller tooling/governance fixtures and tests. tooling/governance/* is an R4
  path floor; .github/workflows/* is an R3 floor; semantic mutation of required Actions
  runs on an open promotion PR is protected. This is a draft proposal for human adoption
  review, not a determination; the path classifier and independent verifier remain
  authoritative.

  '
canonical_path: specs/changes/VOC-122-promotion-recovery-must-replan-required-checks
authority_model: a004-active
requirement_source: 'GitHub issue #1001 (Promotion recovery must replan required checks
  that appear after its initial snapshot). Live 2026-08-26 reproduction: VOC-121 caller
  merge advanced develop to bb531fc211e91e40cec1847e1e28d98beaedacff and opened promotion
  PR #1000. Release run 32912818046 job 98010275057 entered Recover missing exact-head
  promotion checks at 2026-08-25T23:54:50Z and, because required pull-request rows
  had not all appeared, used the absent-context workflow-dispatch path (governance-policy
  dispatch run 32912851134 passed). The actual pull-request governance-policy run
  32912850066 appeared at 2026-08-25T23:54:52Z and was cancelled by concurrency; gh
  pr checks 1000 --required continued to select that CANCELLED row. The active recovery
  job polled until timeout without rerunning 32912850066 because plan_required_check_recovery,
  exact-run validation, rerun, and dispatch planning run only before the while loop
  in config/actions-check-recovery-runner.py. After that obsolete polling run was
  cancelled, already-queued convergence run 32912851044 job 98010820950 started with
  the cancelled row present, reran 32912850066 as attempt 2, and the App merged #1000
  at 70db9d7dbc4789264732e4fe4f347914dd6f764e without a ruleset bypass. Required:
  one outcome-sized reliability change so promotion recovery re-evaluates newly appearing
  required-check rows during polling while preserving VOC-121 fail-closed contracts
  (exact selected-run validation, once-per-run-id rerun, once-per-absent-context dispatch,
  no alternate-run or same-named-status override, no duplicate active/successful work,
  1800-second timeout, App-token separation, exact-head merge decision, retry limits);
  deterministic time-evolving tests; current-state docs and caller fixture/pin through
  the coordinated exact-SHA flow. This draft package does not adopt or authorize itself.

  '
