production_impact: expected after the fix lands on the production deploy path. The
  same ReconcileStreak / applyP4ReviewWiring path serves staging and production. Until
  fixed, any learner whose review first reaches review_target today can receive HTTP
  500 and have the submission rolled back (mission stays open at target-1; no completion
  reward; streak does not advance). The fix restores successful atomic commit of snapshot
  completion, completion reward, and streak reconciliation for that request. No schema
  migration anticipated.
