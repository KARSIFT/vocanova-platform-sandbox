requirement_source: 'GitHub issue #675 ("Fix 500 on the review that completes today''s
  mission"). Staging core-loop fails deterministically when the synthetic account
  submits the review that reaches its daily target (20/20). Deploy run https://github.com/KARSIFT/vocanova-platform-sandbox/actions/runs/31886780600
  showed POST /api/v1/reviews/submissions returning 500 after clicking Good. Live
  DB after rollback: today remains reviews_completed=19, review_target=20, status=open;
  no daily-mission completion ledger entry. Confirmed code path: applyP4ReviewWiring
  marks today complete, then fetches snapshots inside the same transaction and calls
  ReconcileAndAdvance(..., currentCompletion=true). ReconcileStreak selects the newly
  completed today snapshot as lastGood, computes gap <= 0, and returns ErrInvalidStreakSnapshot.
  Issue requires treating a just-completed today snapshot as the current completion
  (not an invalid prior anchor), preserving defensive rejection of genuinely future
  snapshots, adding a regression test with today completed in the fetched list and
  currentCompletion=true, verifying the 20th review commits snapshot / completion
  reward / streak atomically, and re-running the staging core-loop successfully. Explicitly
  separate from VOC-081 monitor routing.'
