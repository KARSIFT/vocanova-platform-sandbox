planned_implementation_risk_floor: 'Measured during drafting by running scripts/governance/classify-change-risk.sh
  --files-from against the expected task-scoped file list (apps/api/business/gamification/streak.go,
  apps/api/business/gamification/streak_test.go, apps/api/business/reviews/postgres.go
  as read/confirm only unless a call-site bug is found, apps/web/tests/staging-e2e/core-loop.staging.spec.ts
  as staging verification target, this package directory). Detected path floor: R1.
  This package proposes R2 for the change as a whole (not R1) because the confirmed
  defect fails POST /api/v1/reviews/submissions with HTTP 500 and rolls back the transaction
  when the learner''s review reaches the daily target, leaving daily_mission_snapshots
  at N-1/N with status open and no completion ledger entry. That is a user-facing
  core-loop correctness failure for every account that hits today''s target, not a
  test-only flake. Independent verification and the reviewing human must still confirm
  each task''s real file list and whether semantic escalation to R3 is warranted.
  This is a draft proposal for the reviewing human at adoption time, not a determination.'
