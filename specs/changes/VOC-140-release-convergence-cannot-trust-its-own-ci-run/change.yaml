    '
- id: VOC-140-DEP-09
  status: 'resolved at drafting time. After this correction merges into develop, rerun
    the existing dedicated promotion recovery if necessary, then reconcile-release
    for release issue #1089 must be able to merge promotion PR #1090 (or the live
