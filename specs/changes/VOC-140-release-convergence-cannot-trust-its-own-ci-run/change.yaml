    '
- id: VOC-140-DEP-07
  status: 'resolved at drafting time as a no-change constraint. Do not rewrite VOC-139,
    VOC-138, or earlier package records under specs/changes/. Do not edit VOC-112
    capture fixtures, hashed sources, AGENTS.md, the navigator skill, or package.json.
