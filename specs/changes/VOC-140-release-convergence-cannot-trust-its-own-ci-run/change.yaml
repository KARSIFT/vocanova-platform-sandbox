dependencies:
- id: VOC-140-DEP-00
  status: 'resolved at drafting time. Issue #1102 provides the failing promotion PR
    #1090, exact head 21eef75549226766fc4f78f62f232ee5fbdb8d6d, base main 0d0b0cdf0692d0349f380e9cae3285b4c7916b05,
    pin 599436835371f27fac52ec6b47a18b36257366ac, circular-CI run 33136633666 / job
    98738317266, fail-closed untrusted_ci_recovery_identity, dedicated recovery run
    33136865709, reconcile-release runs 33136984634 / 33137091931 and jobs 98739074178
    / 98739420310, production-merge-guard: production_merge_guard_missing versus administrator-visible
    production-merge-guard: ok ruleset_id=20575146, the App-token mint permission
    set, and enough specificity to draft without a clarifying round trip.

    '
- id: VOC-140-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative. No founder
    approved-comment gate on engineering-workflow adopt/merge/release paths. Exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    and fail-closed behavior remain mandatory. R4 is a draft proposal, not a determination.
    automatic_merge_allowed is drafted true per AGENTS.md A-004 drafting rule.

    '
- id: VOC-140-DEP-02
  status: 'resolved at drafting time by reading live caller fixtures. Live PINNED_SHA.txt
    equals 599436835371f27fac52ec6b47a18b36257366ac (VOC-139 infrastructure merge).
    Recovery completion treats required PR checks showing SUCCESS for ci / ci as sufficient
    and does not require the parent workflow run to be completed or to be the dedicated
    promotion-pr-validation dispatch. select_authoritative picks the newest ci / ci
    check, which can be a completed job inside a still-running pipeline.yml carrier
    that also contains release / converge. verify_promotion_required_run_semantics
    then fails untrusted_ci_recovery_identity because that run status is not completed/success.
    Live release.yml mints the mutation App token with exactly permission-contents: write,
    permission-issues: write, and permission-pull-requests: write, then calls verify-production-merge-guard.sh
    with that token immediately before gh pr merge. GitHub omits bypass_actors unless
    the caller has ruleset write access, while GET /repos/{owner}/{repo}/rulesets/{id}
    is reachable under Metadata:read, so the HTTP fetch can succeed and validate_production_merge_guard
    still raises production_merge_guard_missing. The required design preserves that
    mutation token unchanged and adds a separate ephemeral current-caller-repository-scoped
    token with only permission-administration: write for guard verification immediately
    before merge, with the same separation in merge-gate''s production path. Current tests construct full helper
    fixtures with bypass_actors: [] and do not exercise the omitted-field App-token
    shape. An untracked local karsift-ai-infra/ checkout, if present, is not this
    repository''s tracked tree.

    '
- id: VOC-140-DEP-03
  status: 'resolved at drafting time as the chosen design. One end-to-end implementation
    task covering a coordinated infrastructure PR plus the caller pin, recovery/selection
    identity, production-merge-guard token/API contract, tests, docs, evidence, and
    release handoff. Do not split by repository, CI-identity versus token contract,
    test, or layer. Do not add a VOC-097 live-evidence second task: a draft evidence-carrier
    PR cannot satisfy sha_lineage against promotion PR #1090''s recovery HEAD (karsift-ai-infra#15
    class). Do not snapshot the current develop/main gap. This package''s implementation
    PR Closes only its own VOC-140 task issue.

    '
- id: VOC-140-DEP-04
  status: 'resolved at drafting time as a hard TEST constraint. Do not weaken the
    production merge guard. Do not add bypass actors. Do not fabricate statuses. Do
    not manually merge #1090. Keep the mutation token exactly Contents/Issues/Pull
    requests write and sole for gh pr merge/mutations. Keep the Administration-write-only
    guard token current-repository scoped and out of mutation/status/issues/PR/content
    steps. Never select an in-progress or failed release carrier
    as trusted recovered ci / ci. Keep exact PR base/head/refs/repository binding,
    ruleset enforcement, no founder-comment gate, and idempotent reconcile-release.
    Do not switch the promotion PR to --squash-safe-push. Do not rerun doomed pull_request
    ci / ci jobs as a strategy.

    '
- id: VOC-140-DEP-05
  status: "resolved at drafting time as a pin-advance rule. VOC-139 pin 599436835371f27fac52ec6b47a18b36257366ac\
    \ remains historical audit evidence and remains the issue-creation pin. This repair\
    \ cannot land by freezing that pin. T00 must open and consume one new independently\
    \ reviewed karsift-ai-infra PR whose exact merge SHA becomes the new PINNED_SHA.txt\
    \ value, then mirror every changed authoritative fixture file from that exact\
    \ merge. Do not silently keep 59943683\u2026 if the live reusable workflow still\
    \ selects a still-running release carrier as ci / ci or still cannot prove bypass_actors\
    \ with the merge identity.\n"
- id: VOC-140-DEP-06
  status: 'resolved at drafting time. Configured Cursor Composer remains the implementer
    and Cursor Grok remains the exact-revision independent reviewer. Current fixture
    config/roles.yml bindings are fixed and must not change: implementer and implementer_escalation
    cursor/composer-2.5; planner, reviewer, reviewer_fast_retry, and plan_reviewer
