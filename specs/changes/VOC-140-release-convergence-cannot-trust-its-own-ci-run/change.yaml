authority_model: a004-active
requirement_source: "GitHub issue #1102 (Release convergence cannot trust its own\
  \ CI run or verify the production merge guard with the App token), including its\
  \ original body. After VOC-139 repaired promotion validation, the governed develop\
  \ \u2192 main release for audit #1089 / promotion PR #1090 remains fail-closed.\
  \ Immutable state at issue creation: main 0d0b0cdf0692d0349f380e9cae3285b4c7916b05,\
  \ develop / PR #1090 head 21eef75549226766fc4f78f62f232ee5fbdb8d6d, promotion PR\
  \ #1090 open, release audit #1089 open, repaired infrastructure pin 599436835371f27fac52ec6b47a18b36257366ac,\
  \ dedicated recovery run 33136865709 completed successfully and exact-head/PR-bound.\
  \ No promotion merge or production deployment occurred. Reproduction 1: PR #1090\
  \ synchronized to 21eef755\u2026 and completed pull-request ci / ci in run 33136633666;\
  \ reconcile-release for #1089 observed job 98738317266 report recovery complete\
  \ without dispatch because required checks were green; the authoritative selector\
  \ chose ci / ci from the same still-running workflow that contains release / converge;\
  \ status attestation then failed untrusted_ci_recovery_identity because that workflow\
  \ cannot be completed/successful until its own release job ends. Reproduction 2:\
  \ explicit recover-promotion-pr-checks for PR #1090 produced successful run 33136865709\
  \ at exact head 21eef755\u2026; subsequent reconcile-release runs 33136984634 /\
  \ job 98739074178 and 33137091931 / job 98739420310 attested required contexts including\
  \ ci / ci from 33136865709, then Perform the single exact-head merge decision failed\
  \ before gh pr merge with production-merge-guard: production_merge_guard_missing.\
  \ The same revision under an administrator-visible authenticated shell reports production-merge-guard:\
  \ ok ruleset_id=20575146 for live repository-owned active main-only strict ruleset\
  \ 20575146 with required PRs, governance-policy/validate/ci, and bypass_actors:\
  \ []. The release mutation App token requests only permission-contents: write, permission-issues:\
  \ write, and permission-pull-requests: write. This draft package does not adopt\
  \ or authorize itself.\n"
requirement_approval_status: 'requirement documented in GitHub issue #1102; this draft
  package is not approved and does not authorize implementation '
