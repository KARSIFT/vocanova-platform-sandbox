risk: R4
planned_implementation_risk_floor: 'R4. This package repairs two causally related
  release-convergence defects so the already-open develop-to-main promotion can finish:
  recovery/selection must never treat a still-running release carrier as attestable
  completed ci / ci, and the App identity that proves the production merge guard must
  see full ruleset/no-bypass fields. tooling/governance/* is an R4 path floor. .github/workflows/*
  is an R3 floor. Semantic mutation of required-check recovery, status attestation,
  production-merge-guard authorization, and exact-revision evidence binding is protected.
  This is a draft proposal for human adoption review, not a determination. The path
  classifier and independent verifier remain authoritative.

  '
