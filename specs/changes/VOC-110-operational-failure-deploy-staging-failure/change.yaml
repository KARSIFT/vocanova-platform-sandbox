requirement_source: 'GitHub issue #911 and its 2026-08-22 operator diagnosis comment.
  The VOC-088-T02 observer opened the issue after deploy-staging run 32566405628 failed
  on develop at f25e4ccf5fc28dcc5b14a438fbdc4f93e5c53a46. Read-only workflow and host
  diagnosis confirmed that Poll staging.vocanova.site/ failed: the API stayed healthy,
  the public web returned HTTP 502, and vocanova-web restarted because Next.js 16.3.1
  standalone output omitted an @swc/helpers ESM module on Node 24. This matches upstream
  vercel/next.js issue #97358; stable 16.3.2 includes the backport from #97372/#97453.
  The same diagnosis identified the missing preventive check: source builds passed,
  but CI never booted the shipped Docker artifact. This draft package does not adopt
  or authorize itself.'
