authority_model: a003-active
requirement_source: 'GitHub issue #573 ("Governance still violates ''approve only R4'': 28 non-R4 packages
  carry automatic_merge_allowed: false, and AGENTS.md''s R3 carve-out contradicts the founder''s explicit
  rule"), follow-up to VOC-068 / issue #488. VOC-068 fixed R0–R2 drafting defaults and the template silent-false,
  but introduced an R3 case-by-case carve-out in AGENTS.md that names auth/secrets/production infrastructure
  as reasons for an R3 package to still require founder approval on merge. The founder confirmed directly
  (2026-08-14) that only R4 should ever require founder approval — no R3 carve-out, no ''sensitive R3''
  exception. Repo scan on develop found 28 non-R4 packages still at automatic_merge_allowed: false; VOC-072
  is called out as actively blocking merges that should not need founder attention under that rule.

  '
requirement_approval_status: 'Approved. Founder merged plan PR #574 directly on 2026-08-13 but adoption
  fields were never flipped, so implementation was never authorized and no task issues opened - discovered
  during 2026-08-14 repo health audit. Recovered per AGENTS.md''s ''Recovering from a merged plan PR that
  was not adopted first'' procedure (issue #301 precedent).'
