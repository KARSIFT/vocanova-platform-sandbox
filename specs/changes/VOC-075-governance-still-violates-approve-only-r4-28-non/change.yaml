planned_implementation_risk_floor: 'Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real task-scoped file list. This package proposes R3 for the change as a whole when scope
  stays on AGENTS.md, specs/templates/change-package/, docs/governance/*.md (non-amendment), and flipping
  automatic_merge_allowed on already-adopted non-R4 packages such as VOC-072 — those paths floor at R3
  (or lower for ordinary specs/changes/*). Including a new lint under scripts/governance/ or tooling/governance/,
  or editing docs/operations/15-ai-native-product-and-engineering-operating-model.md (DOC-15), raises
  the path floor to R4 per .github/approved-policy/protected-paths.yaml — see specification.md open questions
