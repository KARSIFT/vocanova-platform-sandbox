slug: coordinated-source-publisher-must-request
title: Coordinated source publisher must request workflow-write permission
type: infrastructure
status: adopted
risk: R4
planned_implementation_risk_floor: 'R4. This package changes protected CI/CD coordinated
  source-carrier publication in KARSIFT/karsift-ai-infra (implement.yml publish-source
  App-token mint) and caller tooling/governance fixtures and tests. tooling/governance/*
  is an R4 path floor; .github/workflows/* is an R3 floor; semantic second-repository
  publication of nested infrastructure workflow files is protected. This is a draft
  proposal for human adoption review, not a determination; the path classifier and
  independent verifier remain authoritative.

  '
canonical_path: specs/changes/VOC-124-coordinated-source-publisher-must-request
authority_model: a004-active
requirement_source: 'GitHub issue #1013 (Coordinated source publisher must request
  workflow-write permission). Live 2026-08-26 failure while implementing adopted task
  VOC-122-T00: pipeline run 32958526215 produced a valid nested infrastructure bundle
  at exact head f90eb630743c8c523e2e6e8dff017acbb31a7f43 based on infrastructure 7500a4171d96a8e0d38889a9c92ad5dc092ad8dd.
  The publish-source job 98147443377 downloaded and verified that bundle and minted
  the infrastructure-repository App token, then the exact branch push failed because
  the commit changes .github/workflows/recover-actions-checks.yml and GitHub rejected
  the App token with `refusing to allow a GitHub App to create or update workflow
  ... without workflows permission`. Caller PR #1012 is intentionally draft and must
  remain unmerged: it contains only the staged mirror/evidence and still pins the
  prior infrastructure SHA until the authoritative source PR merges. Root cause: karsift-ai-infra/.github/workflows/implement.yml
  requests permission-contents, permission-issues, and permission-pull-requests when
  minting the publish-source App token, but omits the supported permission-workflows:
  write input. The karsift-ai-infra-bot installation (ID 148001476) already has repository
  workflows: write; no secret, account, or repository-setting change is required.
  An ordinary VOC-122 retry cannot repair this because the caller executes implement.yml@main,
  so the same broken source-publisher token request would reject its own workflow-file
  fix. Required: one outcome-sized change that requests permission-workflows: write
  only on the cross-repository infrastructure publisher token, preserves existing
  App-boundary / bundle / lease / fail-closed / review controls, adds deterministic
  tests, uses one bounded exhausted bootstrap for this self-hosting repair without
  authorizing manual publication of VOC-122''s source bundle, corrects current-state
  A-004 PR/workflow text in the same carrier path, then retries the existing VOC-122-T00
  carrier. This draft package does not adopt or authorize itself.

  '
requirement_approval_status: approved requirement; package adopted automatically after
  exact-revision independent verification
