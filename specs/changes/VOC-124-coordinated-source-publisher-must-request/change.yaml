    routes, critical API endpoints, monitor inventory, or synthetic inventory in infra/monitoring/
    are added or changed.

    '
dependencies:
- id: VOC-124-DEP-00
  status: 'resolved at drafting time. Issue #1013 provides the live publish-source
    failure, exact run/job IDs, nested head f90eb630743c8c523e2e6e8dff017acbb31a7f43,
    infrastructure base 7500a4171d96a8e0d38889a9c92ad5dc092ad8dd, GitHub App workflows-permission
    rejection, root cause (missing permission-workflows: write on the publish-source
    token mint), installation already holding workflows: write, #1012 draft constraint,
    bootstrap necessity, VOC-122 retry-not-replace instruction, A-004 current-state
    text correction, preserved fail-closed contracts, test shape, and one-task preference
    with enough specificity to draft without a clarifying round trip.

    '
- id: VOC-124-DEP-01
  status: 'resolved at drafting time. Active A-004 remains authoritative: no founder
    approved-comment gate on engineering-workflow adopt/merge/release paths; exact-SHA
    independent verification, deterministic risk floors, protected-path controls,
    and fail-closed behavior remain mandatory.

    '
- id: VOC-124-DEP-02
  status: 'resolved at drafting time by reading the current workflows. implement.yml
    publish-source mints the App token with permission-contents: write, permission-issues:
    write, and permission-pull-requests: write, repositories: karsift-ai-infra, and
    no permission-workflows input. The caller publish job mints a separate caller-scoped
    token with the same three permissions, no permission-workflows, and still rejects
    .github/workflows/** before push. test_live_evidence_reconcile.py currently splits
    on `\n  publish:` and therefore includes publish-source in that `publish_job`
    substring while asserting permission-workflows is absent; T00 must isolate those
    jobs when adding the source-publisher permission.

    '
- id: VOC-124-DEP-03
  status: 'resolved at drafting time. VOC-121 already landed isolated source publication
    and VOC-123 already landed named-ref source-bundle creation. This package does
    not reopen those contracts. It closes the remaining token-permission gap: the
    infrastructure publisher token must request workflows: write so GitHub will accept
    an authorized nested workflow-file commit.

    '
- id: VOC-124-DEP-04
  status: 'resolved at drafting time as an accepted delivery constraint: coordinated
    PRs in the caller and KARSIFT/karsift-ai-infra remain one task. Repository count,
    workflow-versus-tests-versus-docs, and fixture/pin work are not split reasons.
    Pin the caller fixture only if that fixture actually consumes the infra change.
    Merge the independently reviewed infra PR first, then pin to that exact merge
    SHA.

    '
- id: VOC-124-DEP-05
  status: 'resolved at drafting time as a hard dependency that must not expand this
    package into a replacement VOC-122 roster. Adopted VOC-122-T00 (#1003) and draft
    caller PR #1012 cannot deliver nested infrastructure until this token-permission
    defect is repaired. This package must not implement VOC-122 promotion-recovery
    replan behavior, must not hand-push nested head f90eb630743c8c523e2e6e8dff017acbb31a7f43,
    must not merge #1012, and must not create a replacement VOC-122 task or PR. After
    this package''s exact reviewed infra merge is live on implement.yml@main, re-dispatch
    or reconcile the existing #1003 carrier against that revision.

    '
- id: VOC-124-DEP-06
  status: 'resolved at drafting time following VOC-121-D10 / VOC-123-D08. The caller
    resolves KARSIFT/karsift-ai-infra/.github/workflows/implement.yml@main before
    the model job starts, so the broken source-publisher token request cannot publish
    its own nested workflow-file repair. One bounded supervised bootstrap infra PR
    is in scope under T00: clean branch from current infra main, exact token-permission
    repair plus tests/docs/A-004 current-state text, non-closing task link, source
    self-CI, independent exact-SHA review, and a different merger. No PATH/Git interception,
    direct main push, secret/account/installation change, or VOC-122 bundle publication
    is allowed. The exception expires at that merge; caller fixture/pin/evidence and
    the existing VOC-122-T00 retry then use the repaired normal implement.yml@main
    path.

    '
- id: VOC-124-DEP-07
  status: 'resolved at drafting time as an issue-stated fact that T00 must not reopen:
    karsift-ai-infra-bot installation 148001476 already has repository workflows:
    write. No KARSIFT_BOT_APP_ID / KARSIFT_BOT_PRIVATE_KEY rotation, no installation
    permission change, and no repository-setting change is in scope. Do not print
    credential values.

    '
- id: VOC-124-DEP-08
  status: 'open at drafting time as an implementer-facing structure choice, not a
    planner guess past the required behavior. Whether permission assertions live in
    an extended test_voc121_implement_policy.py / test_voc121_source_carrier_publisher.py
    / test_live_evidence_reconcile.py or a new tests/test_voc124_*.py is an implementation
    choice. Constraints that are not open: request permission-workflows: write on
    the publish-source create-github-app-token step only; do not add it to the caller
    publish token mint; keep the caller workflow-file rejection; preserve fail-closed
    missing-credential / invalid-bundle / stale-base / stale-lease behavior; isolate
    the live-evidence publish_job assertion so it does not treat publish-source as
    the caller publisher.

    '
