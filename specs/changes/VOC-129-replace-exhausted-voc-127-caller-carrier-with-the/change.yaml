  artifact and do not dispatch VOC-127 attempt 3. Recreate the complete intended

  VOC-127 caller diff from current develop, mirror in-scope infrastructure files

  from that exact #164 merge, set PINNED_SHA.txt and every live pin assertion to

  that merge, carry caller pipeline/docs/tests for the already-approved

