requirement_source: "GitHub issue #575 (\"Staging core-loop E2E: review-queue answer\
  \ button stays disabled, test times out at 240s\"), opened after the develop-branch\
  \ deploy-staging run triggered by VOC-075's merge failed. Run https://github.com/KARSIFT/vocanova-platform-sandbox/actions/runs/31748423831\
  \ \u2014 job `deploy to staging`, step `Run the staging core-loop journey`, failing\
  \ at tests/staging-e2e/core-loop.staging.spec.ts:272:3 \u203A authenticated journey\
  \ \u203A step \"5. work the review queue\". Playwright waited 240000ms for getByRole('group',\
  \ { name: /^Choose the meaning for / }).getByRole('button').first() ; the locator\
  \ resolved to a <button disabled ... aria-pressed=\"false\"> that never became enabled,\
  \ then detached from the DOM. Call site: reviewOneCard \u2192 line 258 click. Root\
  \ cause unknown at issue time; candidates include stuck loading/hydration, race\
  \ between card content and disabled clearing, and staging-only backend latency.\n"
requirement_approval_status: 'Approved. Founder merged plan PR #577 directly on 2026-08-13
  (recovery per AGENTS.md''s ''Recovering from a merged plan PR that was not adopted
  first'' procedure, issue #301 precedent). R2 classification accepted as proposed.'
