dependencies:
- id: VOC-076-DEP-00
  status: "unresolved at drafting time. Exact root cause of the disabled multiple-choice\
    \ button on run 31748423831 is not settled \u2014 T00 must confirm with direct\
    \ evidence. Drafting-time candidates (see specification.md): (1) isLoading stuck\
    \ true because isSubmitting or isRefetching never clears after a prior card or\
    \ queue refetch; (2) E2E race \u2014 reviewOneCard clicks the first MC button\
    \ while it is still disabled without waiting for enabled; (3) staging-only backend\
    \ latency on listDueWords / submitReview leaving isRefetching or isSubmitting\
    \ elevated long enough to hit the 240s test timeout; (4) phase stuck such that\
    \ buttons stay disabled while the card later detaches/re-renders. Evidence from\
    \ the failure (aria-pressed=\"false\", disabled for full timeout, then detached)\
    \ favors (1)\u2013(3) over a completed feedback-phase selection.\n"
- id: VOC-076-DEP-01
  status: "unresolved at drafting time. Whether .github/workflows/deploy-staging.yml\
    \ must be edited (extra diagnostics around review-queue timing, or synthetic-account\
    \ helpers) or whether the fix stays in apps/web review UI + staging-e2e only.\
    \ Default proposed scope excludes deploy-staging.yml unless T00 evidence requires\
    \ it \u2014 touching that path raises the path floor to R3.\n"
- id: VOC-076-DEP-02
  status: 'unresolved at drafting time. Interaction with VOC-074 (reviews_completed
    / vacuous E2E pass). The current core-loop.staging.spec.ts already contains VOC-074-T02-style
    hardening (fail when reviewedCards < 1). This package does not re-litigate VOC-074''s
    increment bug; adoption should note that VOC-076 addresses a distinct step-5 disabled-button
    timeout that blocks reaching those assertions. If VOC-074 tasks are still open
    on develop, coordinate merge order so both packages'' evidence remains attributable.

    '
