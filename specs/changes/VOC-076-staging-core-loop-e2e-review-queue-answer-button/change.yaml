planned_implementation_risk_floor: "Measured during drafting by running scripts/governance/classify-change-risk.sh\
  \ --files-from against the expected default task-scoped file list (apps/web/src/app/(app)/reviews/_components/review-session.tsx,\
  \ apps/web/tests/staging-e2e/core-loop.staging.spec.ts): the detected path floor\
  \ is R1. Including .github/workflows/deploy-staging.yml (only if T00 requires diagnostic\
  \ enrichment or seed/reset helpers) raises the path floor to R3. This package proposes\
  \ R2 for the change as a whole (not R1) because the staging core-loop gate is currently\
  \ failing on develop deploys, and the observed symptom \u2014 multiple-choice answer\
  \ buttons remaining disabled and non-interactive \u2014 may also affect real learners\
  \ on the review queue if the cause is product-side (stuck isLoading / isRefetching\
  \ / phase). If T00 confirms only a flaky wait condition with no product hang, adoption\
  \ or the independent verifier may lower toward R1; if T00 forces deploy-staging.yml\
  \ edits or confirms a systemic review-session hang for all users, raise to R3. This\
  \ is a draft proposal for the reviewing human at adoption time, not a determination.\n"
