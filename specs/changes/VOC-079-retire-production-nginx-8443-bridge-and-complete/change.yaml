production_impact: 'expected. Retiring vocanova-production-nginx and normalizing production
  URLs to ordinary :443 changes how production reaches the public internet and how
  rollback works. A failed deploy or premature bridge removal while a remap still
  existed would recreate issue #485; this package therefore requires repository verify-only
  evidence before bridge retirement. Shared-edge reload faults can still affect both
  tiers on this host.

  '
