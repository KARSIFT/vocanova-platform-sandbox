requirement_source: 'GitHub issue #624 ("Retire production nginx :8443 bridge and
  complete the single shared-edge cutover"). Completes the repository-driven single-nginx
  design introduced by issue #485 / VOC-067 (infra/docker-compose.shared-edge.yml).
  Live 2026-08-15 read-only verification confirmed origin :443 HTTP 200 for staging
  and production web/API hostnames. Founder confirmed in the Cloudflare dashboard
  that no Origin Rules remap vocanova.site production traffic to :8443; PRODUCTION_CLOUDFLARE_ZONE_ORIGIN_RULES_TOKEN
  exists in the GitHub production environment for repository-controlled verification.
  Issue #595 previously closed with a retain-bridge decision; founder direction on
  2026-08-15 supersedes that rationale and requires finishing the single-edge design
  through repository implementation (no manual SSH / ad hoc container removal). '
requirement_approval_status: 'Approved by the founder (m-e-h-r-d-a-a-d) through the
  exact `approved` comment on plan PR #625 at 2026-08-15T00:11:48Z, after independent
  plan review of commit 364333c6e89226b99e96b34a3cda6cd59504b19c returned PASS
  WITH NON-BLOCKING FINDINGS. The founder accepts R4 and resolves VOC-079-DEP-00
  through DEP-02 as recorded below: VOC-079 supersedes the unfinished VOC-067-T04/T05
  and VOC-072-T02 completion path without redistributing their attempt budgets;
  production cleanup must use Docker Compose project-scoped `--remove-orphans`;
  and repository-controlled Cloudflare verify-only evidence is mandatory before
  bridge retirement. The recovery PR also makes the reviewer-requested rollback
  rehearsal bar explicit.'
