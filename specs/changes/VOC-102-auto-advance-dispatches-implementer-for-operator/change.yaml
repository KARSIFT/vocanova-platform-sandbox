  independent_verification: unassigned
approval_status: not-approved
implementation_authorized: false
automatic_merge_allowed: true
production_impact:
  none-intentional for application runtime. Changes governance automation
  so auto-advance skips general implementer dispatch when the next roster task is
  operator-owned or live-evidence-only. Does not change production deploy semantics,
  signup policy, secrets, databases, Kuma inventory, or Sentry ingestion.
rollback_required: true
monitoring_impact:
  state: none
  rationale:
    Governance-automation dispatch gating only. No page routes, critical
    API endpoints, or stable monitor/synthetic IDs in infra/monitoring/monitors.yaml
    or infra/monitoring/synthetics.yaml are added or changed. Live-evidence waiting
    and operational-failure observer remain separate mechanisms.
dependencies:
  - id: VOC-102-DEP-00
    status:
      "resolved at drafting time. Issue #863 records sanitized observation that
      closing VOC-098-T00 auto-advanced into an implementer run for operator-owned VOC-098-T01
      (pipeline run 32462184971), requiring manual cancel."
  - id: VOC-102-DEP-01
    status:
      resolved at drafting time. VOC-097 established operator-owned live-evidence
      contracts at <package>/.karsift/live-evidence/<task_id>.yaml with ownership operator
      or live-actions, waiting lifecycle, and live-evidence-reconcile.yml. Auto-advance
      does not yet consult that contract before dispatch.
  - id: VOC-102-DEP-02
    status:
      "resolved at drafting time. Cross-repo pattern from VOC-080 / VOC-043 /\
      \ VOC-097 \u2014 reusable workflow behavior lands in KARSIFT/karsift-ai-infra;\
      \ this package authorizes the required outcome. Do not treat an untracked local\
      \ karsift-ai-infra/ checkout as this repository's tracked tree."
  - id: VOC-102-DEP-03
    status:
      "resolved after independent plan review. The current reconciler is PR-centric,
      so an issue comment alone is insufficient. Auto-advance classification remains
      read-only and selects a separate deterministic, non-LLM clean publisher that
      creates/reuses a draft evidence-carrier PR and a strict task-ID-derived package-local
      evidence path, then posts one sanitized waiting marker. No evidence_path extension
      is added to the unchanged VOC-097 contract schema. That publisher alone mints
      the existing App with contents/issues/pull-requests write; it receives no Actions-write
      or model credentials. Operator-owned existing carriers re-enter the idempotent
      publisher so partial file/marker publication can be repaired; the existing-PR
      guard remains on the ordinary implement path. The existing reconciler algorithm
      and allowlists remain unchanged."
  - id: VOC-102-DEP-04
    status:
      "resolved after independent plan review. The real T00-close run precedes
      carrier creation and is never claimed to contain the later PR head. After
      recording its allowlisted metadata, a separate read-only pipeline verifier
      is manually dispatched on the deterministic T01 carrier branch. The verifier
      validates the source run and carrier state; its own successful run must equal
      the current PR head under the existing exact_pr_head lineage mode."
  - id: VOC-097
    status:
      Adopted predecessor. Ownership contract path, waiting semantics, and reconcile
      path must remain authoritative; this package must not weaken them or grant implementer
      Actions credentials.
  - id: VOC-098
    status:
      "Adopted predecessor whose T00\u2192T01 advance exhibited the bug. Used\
      \ as sanitized incident evidence only; this package does not reopen VOC-098 code\
      \ work."
