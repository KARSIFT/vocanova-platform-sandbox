requirement_source:
  "GitHub issue #863 (Auto-advance dispatches implementer for operator-owned
  live-evidence tasks). Closing VOC-098-T00 produced pipeline run 32462184971; auto-advance
  succeeded then started implement for VOC-098-T01 even though T01 was declared operator-owned
  live evidence and had to be cancelled manually. Drafting-time read of karsift-ai-infra
  auto-advance.yml confirms it sets should_dispatch=true for the next open roster
  task without reading .karsift/live-evidence/<task_id>.yaml ownership. This draft
  package does not adopt or authorize itself."
requirement_approval_status:
  not-approved. This package has not been adopted. No field
  in this file authorizes implementation.
base_branch: develop
base_sha: unknown - not recorded by this draft; set at adoption time
