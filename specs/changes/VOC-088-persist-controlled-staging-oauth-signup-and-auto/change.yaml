dependencies:
- id: VOC-088-DEP-00
  status: Unresolved at drafting time. The exact GitHub secret name for the staging
    controlled-cohort allowlist (e.g. STAGING_NEW_USER_SIGNUP_ALLOWLIST) is an implementer
    naming choice; the requirement is that it is a persistent, staging-scoped secret
    that deploy-staging.yml reads and syncs to api.env without printing email addresses.
- id: VOC-088-DEP-01
  status: Unresolved at drafting time as a workflow design choice. The failure-to-issue
    agent may be a standalone workflow or a reusable composite action. It must use
    the automation App identity (GITHUB_TOKEN or a GitHub App token) so plain unlabeled
    issues trigger plan-from-issue. Exact deduplication key shape (e.g. workflow name
    + run ID prefix, or a body fingerprint) is an implementer choice.
- id: VOC-088-DEP-02
  status: Resolved at drafting time. VOC-084 is merged; staging Google OAuth credentials
    are live. The allowlist mechanism exists in application code (killswitches.go
    SignupAllowlist) and deploy-staging.yml's "Write staging application configuration"
    step. The gap is persistence only.
- id: VOC-088-DEP-03
  status: Resolved at drafting time. infra/monitoring/synthetics.yaml and scheduled-synthetics.yml
    exist (VOC-086-T03). The staging OAuth expected-state synthetic exists as synthetic.staging.oauth-expected-state.
    Extending it to assert readiness is additive.
affected_areas:
- .github/workflows/deploy-staging.yml (secret-backed allowlist sync, remove ephemeral
