canonical_path: specs/changes/VOC-088-persist-controlled-staging-oauth-signup-and-auto
authority_model: a004-active
requirement_source: 'GitHub issue #746 (Persist controlled staging OAuth signup and
  auto-file operational failures). Fresh 2026-08-19 evidence: staging has GOOGLE_OAUTH_ENABLED=true
  and NEW_USER_SIGNUP_ENABLED=false; NEW_USER_SIGNUP_ALLOWLIST is empty; deploy-staging.yml
  sources allowlist only from the optional workflow_dispatch input new_user_signup_allowlist
  whose default is empty; every automatic push deployment rewrites the allowlist to
  empty; no persistent GitHub secret or staging environment variable exists for the
  controlled cohort; the staging OAuth/readiness synthetic does not assert that controlled
  first-time signup is operational; failed scheduled-synthetics and deploy workflows
  do not open governed GitHub issues. This draft package does not adopt or authorize
  itself.'
requirement_approval_status: not-approved
base_branch: develop
base_sha: unknown - not recorded by this draft; set at adoption time
target_branch: develop
owners:
  decision: unassigned
  package_preparation: planner (drafting only)
  implementation: unassigned
  independent_verification: unassigned
approval_status: not-approved
implementation_authorized: false
automatic_merge_allowed: true
production_impact: No production signup-policy change. No production secret or database
  mutation. Production deploy-production.yml gains the same failure-to-issue agent
  path but does not change production signup behavior. The staging allowlist secret
  persists the existing controlled cohort through automatic deploys. No application
  schema migration.
rollback_required: true
monitoring_impact:
  state: update
  rationale: Extends the staging OAuth/readiness synthetic to assert that controlled
    first-time signup readiness is operational (OAuth enabled + global signup disabled
    + non-empty controlled cohort). Adds a governed workflow-failure issue path for
    scheduled-synthetics and deployment workflows across staging and production. Does
    not add new Kuma availability monitor IDs.
  synthetic_ids:
  - synthetic.staging.oauth-expected-state
