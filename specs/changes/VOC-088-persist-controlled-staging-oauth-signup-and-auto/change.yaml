- .github/workflows/scheduled-synthetics.yml (controlled signup readiness assertion)
- .github/workflows/deploy-production.yml (failure-to-issue agent, no signup-policy
  change)
- infra/monitoring/synthetics.yaml (readiness coverage update)
- infra/scripts/ (readiness harness, failure-to-issue helper)
- scripts/foundation/ (deterministic tests)
- docs/operations/ (operator procedure for adding/removing cohort members)
- specs/changes/VOC-088-persist-controlled-staging-oauth-signup-and-auto/
