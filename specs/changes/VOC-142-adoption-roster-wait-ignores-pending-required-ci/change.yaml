- id: VOC-142-DEP-02
  status: 'resolved at drafting time by reading live caller fixtures at pin 67bdfd13ef875dead23ce4be01d7d0e8b976e289.
    Wait for roster PR checks treats two consecutive authoritative snapshots with
    check_count>0, pending=0, failed=0, and an unchanged head SHA as complete. That
    wait calls authoritative-checks-runner.py with --workflow-event pull_request and
    without --ordinary-pr-gate. _workflow_runs then continues past GitHub Actions
    check-runs whose parent fails parent_run_is_attestable, and parent_run_is_attestable
    is false while the parent is not terminal. An IN_PROGRESS ruleset-required ci
    / ci row is therefore omitted from the snapshot, so pending stays 0 while GitHub
    still shows that required row IN_PROGRESS. Two stable counts of the remaining
    SUCCESS rows (governance-policy and validate at the incident) complete the wait.
    Open roster PR, when steps.commit.outputs.changed == true, always calls gh pr
    create for the deterministic karsift/roster-* branch and does not first resolve
    a matching open or already-merged carrier. Reconcile of an interrupted merge recommits
    because develop still lacks the unmerged roster files, force-with-lease pushes,
    then fails because PR #1112 already exists. Recover cleanup for an already-merged
    roster runs only when changed==false. An untracked local karsift-ai-infra/ checkout,
    if present, is not this repository''s tracked tree.

    '
