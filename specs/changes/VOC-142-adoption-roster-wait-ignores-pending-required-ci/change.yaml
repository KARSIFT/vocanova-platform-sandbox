requirement_source: 'GitHub issue #1113 (Adoption roster wait ignores pending required
  CI and reconcile cannot reuse the open roster PR), including its original body.
  Native adoption of merged plan PR #1110 declared generated roster PR #1112 checks
  complete while ruleset-required ci / ci job 99342299218 was still IN_PROGRESS; the
  subsequent protected merge correctly failed. Documented reconcile for plan_pr_number=1110
  then failed at Open roster PR because #1112 already existed. Live reproduction in
  KARSIFT/vocanova-platform-sandbox: source issue #1109, reviewed plan head 178ae81ed4f0224fbb12359c90ddb67c6687ca9a,
  plan merge bb4ffdf5d53d27baf4c25c28caf3acfeda9e07a2, adoption run 33343125733 /
  job 99342230038, generated task #1111, exact roster head 98dd0936a73b64a6b548da6cf2000a6d000917ac,
  roster pipeline run 33343147453. Wait for roster PR checks started 2026-08-30T23:57:08Z
  and reported SUCCESS at 2026-08-30T23:58:46Z; Merge checked roster PR started 2026-08-30T23:58:46Z
  and failed at 2026-08-30T23:58:47Z; ci / ci started 2026-08-30T23:57:21Z, remained
  IN_PROGRESS at the merge attempt, and completed SUCCESS only at 2026-08-30T23:59:16Z.
  Reconcile run 33343250178 / job 99342577393 reused task #1111 and the deterministic
  roster branch, then failed at Open roster PR. No roster PR was manually merged,
  closed, recreated, or bypassed; #1112 remains the single exact VOC-141 carrier.
  This draft package does not adopt or authorize itself.

  '
