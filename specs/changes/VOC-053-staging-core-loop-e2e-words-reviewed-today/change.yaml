production_impact: 'unknown until the root cause is confirmed and implemented. Candidate
  (a) (Next.js caching) and candidate (c) (test-data interaction) fixes are expected
  to have no production-database effect - candidate (a)''s fix changes only fetch-caching
  behavior; candidate (c)''s fix changes only test/seeding tooling. Candidate (b)
  (a real backend bug) would, if confirmed, mean the same computation defect exists
  in production''s own reviews_completed/local_date path for real users - fixing it
  would correct real users'' counters going forward, and could conditionally require
  a data-correcting migration for already-written incorrect rows (an explicit, separately-flagged
  decision; see specification.md open question 3 and impact-analysis.md''s VOC-053-R02),
  which is a more sensitive protected-path effect than the code fix alone.

  '
