requirement_source: 'GitHub issue #450 ("Staging core-loop E2E: ''words reviewed today''
  counter reads 1, then 0, moments later on the same account/run"). The issue reports
  that on 2026-08-09, the first staging core-loop E2E run to get past the review-queue
  race fixes (PRs #446/#448/#449) failed at tests/staging-e2e/core-loop.staging.spec.ts:375
  (step 7, "progress reflects the completed reviews") with Expected: >= 1, Received:
  0, in a run that completed in under 10 seconds total (run https://github.com/KARSIFT/vocanova-platform-sandbox/actions/runs/31332238452).
  The issue''s own timing analysis concludes reviewedBefore = 1 (recorded earlier
  the same day by an earlier deploy run against the same persistent synthetic account)
  and reviewedCards = 0 (the queue was already empty this run), so reviewedAfter,
  read via a fresh page.goto("/home") roughly ten seconds later in the same test run,
  returning 0 is a real same-day decrease with no midnight/day boundary crossed (~19:42
  UTC). The issue traces where the number comes from (apps/web/src/app/(app)/home/page.tsx''s
  Server Component calling client.getDailyMission() fresh on every request via apps/web/src/lib/api-server.ts''s
  fetch with no explicit cache option) and lists three non-prescriptive candidate
  root causes: (1) Next.js Data Cache/Full Route Cache staleness, (2) a real backend
  day-boundary/timezone bug in how reviews_completed/local_date is computed, and (3)
  a test-data artifact from the persistent synthetic account being reused across many
  deploy runs the same night interacting with (1) or (2). The issue explicitly states
  this is a new, different failure only reachable after PRs #446/#448/#449''s fixes,
  not a re-litigation of those, and that resolving which candidate is correct needs
  real HTTP header/cache-status inspection and/or backend query inspection this environment
  does not have blind access to. The issue''s "Impact" section states this blocks
  VOC-052-T01''s staging E2E evidence requirement, which blocks VOC-052''s completion,
  which blocks PR #435 (the pending develop -> main release) and everything downstream
  of it.

  '
requirement_approval_status: 'Approved. Founder-delegate (acting under the standing
  founder-gate delegation for vocanova-platform-sandbox, confirmed explicitly this same
  session) adopted this draft package on 2026-08-09, mirroring the established
  convention of flipping adoption fields before merge so adopt.yml succeeds.'
