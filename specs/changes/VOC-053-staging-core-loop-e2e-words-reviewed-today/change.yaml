  status: 'unresolved at drafting time. This drafting pass located and independently
    re-read apps/api/business/missions/repository.go''s read/write SQL and apps/api/business/gamification/timezone.go''s
    pure LocalDate function and found no decrement or dual-computation bug in either
    by static reading alone, but did not locate the specific HTTP handler (in apps/api/app/api/missions.go
    or elsewhere) that resolves now/timezone per live request and calls them - so
    whether that caller''s resolution could plausibly differ between two requests
    seconds apart remains unconfirmed. See specification.md finding 5 and open question
    2.

    '
