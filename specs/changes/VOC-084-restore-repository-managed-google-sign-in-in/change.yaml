requirement_source: 'GitHub issue #691 ("Restore repository-managed Google sign-in
  in staging"), including the fully populated issue body and the clarifying comment
  by m-e-h-r-d-a-a-d at 2026-08-15T21:38:52Z. Fresh 2026-08-16 evidence: POST https://api-staging.vocanova.site/api/v1/auth/oauth/google/start
  with redirectUri=https://staging.vocanova.site/home returns HTTP 503; production
  equivalent returns HTTP 200 targeting accounts.google.com with redirect_uri=https://api-production.vocanova.site/api/v1/auth/oauth/google/callback.
  Staging API is healthy with GOOGLE_OAUTH_ENABLED=false and absent GOOGLE_OAUTH_CLIENT_ID
  / GOOGLE_OAUTH_CLIENT_SECRET; NEW_USER_SIGNUP_ENABLED=false. deploy-production.yml
  already synchronizes the repository Google OAuth pair, rejects a partial pair, derives
  the canonical /api/v1 callback, and enables OAuth from actual pair availability;
  deploy-staging.yml does not. Staging sign-in UI advertises "Continue with Google"
  while the API reports OAuth disabled. Founder remediation directive dated 2026-08-16
  authorizes issue creation, package adoption/implementation, PRs, workflow execution,
  staging deployment, live verification, remediation, and closure without routine
  approval. No Google Cloud mutation is authorized unless access already exists; otherwise
  record the exact one-time external callback registration required.'
