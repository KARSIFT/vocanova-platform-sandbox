  to bless the new values. README.md, CHANGELOG.md, caller fixtures/pin, and adopted
  VOC-142 DEP-06/AC-09 current-state evidence were not reconciled. Infra self-CI is
  green at run 33443684483, but a green test changed in the same direct sequence does
  not establish governed authority. This issue is separate from the VOC-112 provenance
  EHR escalation in #1120 and must not be used as a carrier to bypass that stopped
