requirement_source: 'GitHub issue #933 (Add portable repository-scoped agent skills
  and codebase navigation). Agents repeatedly rediscover repository structure and
  operational invariants; personal/global skills are not portable across devices or
  CI checkouts; duplicate agent-specific copies drift; broad third-party skill installs
  can waste context, download unpinned tools, read sensitive files, or make stale
  generated knowledge look authoritative. Required: canonical skills under .agents/skills/<name>/SKILL.md;
  cross-agent discovery without personal installation; minimal Claude adapters under
  .claude/skills/ that load canonical skills only (no Git symlinks); deterministic
  drift and safety validation; vocanova-repo-navigator router skill; security-reviewed
  pinned shared engineering skills; Graphify pilot in code-only opt-in mode; measurement
  and documentation. No product/runtime/deployment behavior change. This draft package
  does not adopt or authorize itself.

  '
