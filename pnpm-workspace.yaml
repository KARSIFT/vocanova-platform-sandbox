packages:
  - apps/web
  - packages/*

allowBuilds:
  "@sentry/cli": true
  sharp: false

strictDepBuilds: true

# Patch vulnerable 3.x transitive resolutions without forcing a major upgrade.
overrides:
  "fast-uri@>=3.0.0 <3.1.6": 3.1.6
  # Next.js 16.3.3 permits any compatible 0.35.x release. Keep its optional
  # image dependency above the libheif security fix published in 0.35.4.
  "sharp@>=0.35.0 <0.35.4": 0.35.4
