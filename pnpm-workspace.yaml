packages:
  - apps/web
  - packages/*

allowBuilds:
  "@sentry/cli": true
  sharp: false

strictDepBuilds: true

# Patch vulnerable 3.x transitive resolutions without forcing a major upgrade.
overrides:
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  # Keep optional image and source-map dependencies on their security fixes.
  "sharp@>=0.35.0 <0.35.5": 0.35.5
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
