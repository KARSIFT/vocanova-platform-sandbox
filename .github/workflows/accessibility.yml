name: accessibility

# VOC-031-T07a: the first browser-driven test harness this
# repository has ever had (Playwright + axe-core). This workflow
# runs the accessibility scan suite built under apps/web/tests/e2e/
# against a production build of @vocanova/web, on every PR that
# touches the web app or its tests. See apps/web/tests/e2e/README.md
# "CI runner / browser-dependency reconciliation (VOC-031-DEP-04)"
# for the rationale for separating this from the generic pipeline.yml
# `ci` job (which runs pnpm validate against the karsift-ai-infra
# reusable workflow and intentionally does not install Playwright).
#
# The workflow is wired as a required job (per DOC-10 §7 Level 2
# "selected Playwright" + the T07a acceptance criterion's
# "wired into CI as a new job"). It is intentionally NOT folded
# into pipeline.yml's `ci` job because that job's contract is
# `pnpm run format:check lint typecheck test build` and adding a
# multi-minute browser install + production build would regress
# PR feedback time for every PR regardless of whether e2e
# coverage applies.

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "apps/web/**"
      - "apps/web/tests/**"
      - "apps/web/playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "infra/scripts/install-playwright-chromium.sh"
      - ".github/workflows/accessibility.yml"

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: accessibility (Playwright + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2, pinned to the immutable commit
      # documented at
      # https://github.com/actions/checkout/releases/tag/v4.2.2
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node v7.0.0, pinned to the immutable commit
      # documented at
      # https://github.com/actions/setup-node/releases/tag/v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.14.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client + design tokens
        # pnpm run build:packages is what pnpm test runs; it
        # populates packages/*/dist which the web build picks up
        # via workspace:* symlinks. Running it explicitly here
        # keeps the workflow's failure surface readable.
        run: pnpm run build:packages

      - name: Build @vocanova/web production bundle
        # Production build, not `next dev` - matches VOC-031-R04's
        # "no hot-reload variance in CI" rule that T07b/T09 inherit.
        #
        # NEXT_PUBLIC_API_BASE_URL must be set HERE, at build time, not
        # just in playwright.config.ts's webServer env for the later
        # `pnpm start` - Next.js inlines NEXT_PUBLIC_* vars into the
        # client bundle during `next build`, so setting it only at
        # runtime has no effect on already-compiled client code. Without
        # it, the client fell back to api.ts's own default
        # ("http://localhost:8080"), which is NOT equivalent to the mock
        # server's actual "http://127.0.0.1:8080" in this environment -
        # "localhost" can resolve to the IPv6 loopback (::1) first, where
        # nothing is listening (the mock server binds 127.0.0.1 only per
        # mock-api-server.mjs's HOST constant), causing every client-side
        # mutation (anything not fetched by a server component) to fail
        # at the network level with no HTTP response ever received - the
        # app's own error UI ("We couldn't save your answers") then masks
        # what looks identical to a slow/hanging request. Live failure:
        # VOC-031-T08's core-loop test hung 90s on the onboarding
        # submit - 3 different "fix the test interaction" attempts
        # (force-check, then label-click) missed this because the app's
        # displayed error was misleading, and GETs (server-fetched) kept
        # working throughout, masking that only client-side POSTs failed.
        env:
          API_BASE_URL: "http://127.0.0.1:8080"
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8080"
        run: pnpm --filter @vocanova/web build

      # actions/cache v6.1.0, pinned to the immutable commit documented at
      # https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Restore Playwright Chromium browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        # VOC-095: bounded install contract (browser cache + retry-limited
        # deps install). See infra/scripts/install-playwright-chromium.sh
        # and apps/web/tests/e2e/README.md.
        run: bash infra/scripts/install-playwright-chromium.sh

      - name: Run accessibility suite
        env:
          CI: "1"
        run: pnpm --filter @vocanova/web test:e2e

      # actions/upload-artifact v4, pinned to the immutable commit
      # documented at
      # https://github.com/actions/upload-artifact/releases/tag/v4
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
