name: Auto-merge

# Enables GitHub's native auto-merge on every ready PR so it lands the moment
# the branch-ruleset requirements are satisfied — the five required status
# checks (ci-web, ci-api, controlled-signup OAuth callback E2E, All action refs
# are SHA-pinned, Architecture boundaries do not regress) plus a clean run
# through the merge queue. The queue squash-merges (its own merge_method), so
# `gh pr merge` here only arms auto-merge and does not pick a method.
#
# Deliberately does NOT wait on any review bot. Claude and Codex (the only
# two still active - CodeRabbit/Cubic/Greptile were disabled 2026-09-04 as
# paid tools) are advisory commenters, not merge gates, so turning any of
# them off never changes whether a PR can merge. Only the required checks in
# the `require-pr-and-checks` ruleset do.
#
# Escape hatch: add the `hold` label to freeze a PR (auto-merge is turned back
# off); remove it to release. Drafts are never enqueued.
#
# Uses the default GITHUB_TOKEN, not a GitHub App identity. Enabling
# auto-merge only flips a flag on the PR; the merge queue performs the actual
# merge later under its own identity, so nothing here needs elevated
# credentials.
#
# Two triggers, one loop. `pull_request` covers a PR being opened/pushed/
# labeled. `workflow_run: completed` on the five required-check workflows
# covers the PR *becoming* green, which `pull_request` alone cannot see -
# same proven pattern operational-failure-monitoring.yml already uses for
# PR-triggered runs in this repo.
#
# History: arming auto-merge does not reliably re-enqueue a PR into a
# *required* merge queue by itself (found live 2026-09-04, PR #1171/#1172).
# The first retry fix used `check_suite: completed` instead of `workflow_run`
# (PR #1173) - that never fired even once for a PR's own head SHA (confirmed
# empirically: it fires for push-driven check suites, e.g. on `main` itself,
# but not for pull_request-driven ones), so PR #1174 stalled the same way
# and had to be enqueued by hand again. `workflow_run` is what actually
# works for this case. The explicit enqueue call is a no-op (swallowed) when
# a PR isn't eligible yet, is already queued, or already merged, so
# re-running it from either trigger, for every open PR a run touches, is
# harmless.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled]
    branches: [main]
  workflow_run:
    workflows:
      - ci-web
      - ci-api
      - controlled-signup-oauth-e2e
      - Lint Action Pinning
      - Architecture Lint
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge when green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Determine target PR numbers
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            numbers="[$PR_NUMBER]"
          else
            # workflow_run.pull_requests lists same-repo PRs (this repo takes
            # no fork PRs) whose head matches this run; only ones targeting
            # main are ours to handle.
            numbers="$(jq -c '[.[] | select(.base.ref == "main") | .number]' <<<"$WORKFLOW_RUN_PRS")"
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

      - name: Enable or disable auto-merge, and enqueue, per target PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.targets.outputs.numbers }}
        run: |
          set -euo pipefail
          for PR in $(jq -r '.[]' <<<"$NUMBERS"); do
            info="$(gh pr view "$PR" --json isDraft,labels,id,state,autoMergeRequest)"
            draft="$(jq -r '.isDraft' <<<"$info")"
            held="$(jq -r '[.labels[].name] | any(. == "hold")' <<<"$info")"
            node_id="$(jq -r '.id' <<<"$info")"

            if [ "$(jq -r '.state' <<<"$info")" != "OPEN" ]; then
              continue
            fi

            if [ "$draft" = "true" ] || [ "$held" = "true" ]; then
              echo "PR #$PR is draft=$draft held=$held — disabling auto-merge and removing its queue entry."
              if [ "$(jq -r '.autoMergeRequest != null' <<<"$info")" = "true" ]; then
                gh pr merge "$PR" --disable-auto
              fi
              queued="$(gh api graphql -f query='
                query($id: ID!) {
                  node(id: $id) { ... on PullRequest { mergeQueueEntry { id } } }
                }' -f id="$node_id" --jq '.data.node.mergeQueueEntry != null')"
              if [ "$queued" = "true" ]; then
                if ! gh api graphql -f query='
                  mutation($id: ID!) {
                    dequeuePullRequest(input: {id: $id}) { clientMutationId }
                  }' -f id="$node_id"
                then
                  # A queue worker can remove the entry after our read. Treat
                  # that specific race as success, but fail visibly if it is
                  # still queued so a broken brake cannot be mistaken for one.
                  echo "PR #$PR dequeue mutation failed; checking whether it was already removed." >&2
                  still_queued="$(gh api graphql -f query='
                    query($id: ID!) {
                      node(id: $id) { ... on PullRequest { mergeQueueEntry { id } } }
                    }' -f id="$node_id" --jq '.data.node.mergeQueueEntry != null')"
                  if [ "$still_queued" = "true" ]; then
                    echo "PR #$PR remains in the merge queue after dequeue failed." >&2
                    exit 1
                  fi
                  echo "PR #$PR was already removed from the merge queue." >&2
                fi
              fi
              continue
            fi

            # The merge queue owns the merge method (SQUASH, per the
            # require-pr-and-checks ruleset) — `gh pr merge` only arms auto-merge.
            echo "PR #$PR is ready and unheld — enabling auto-merge."
            gh pr merge "$PR" --auto || true

            gh api graphql -f query='
              mutation($id: ID!) {
                enqueuePullRequest(input: {pullRequestId: $id}) {
                  mergeQueueEntry { state position }
                }
              }' -f id="$node_id" \
              || echo "PR #$PR not eligible to enqueue yet (checks pending, already queued, or already merged) — harmless."
          done
