name: Auto-merge

# Enables GitHub's native auto-merge on every ready PR so it lands the moment
# the branch-ruleset requirements are satisfied — the five required status
# checks (ci-web, ci-api, controlled-signup OAuth callback E2E, All action refs
# are SHA-pinned, Architecture boundaries do not regress) plus a clean run
# through the merge queue. The queue squash-merges (its own merge_method), so
# `gh pr merge` here only arms auto-merge and does not pick a method.
#
# Deliberately does NOT wait on any review bot. Claude, CodeRabbit, Cubic,
# Greptile and Codex are advisory commenters, not merge gates, so turning any
# of them off never changes whether a PR can merge. Only the required checks in
# the `require-pr-and-checks` ruleset do.
#
# Escape hatch: add the `hold` label to freeze a PR (auto-merge is turned back
# off); remove it to release. Drafts are never enqueued.
#
# Uses the default GITHUB_TOKEN, not a GitHub App identity. Enabling
# auto-merge only flips a flag on the PR; the merge queue performs the actual
# merge later under its own identity, so nothing here needs elevated
# credentials.
#
# Two triggers, one loop. `pull_request` covers a PR being opened/pushed/
# labeled. `check_suite: completed` (GitHub Actions' own suite only — that's
# where every required check runs) covers the PR *becoming* green, which
# `pull_request` alone cannot see. Found live 2026-09-04 (PR #1171, #1172):
# arming auto-merge does not reliably re-enqueue a PR into a *required* merge
# queue by itself, and the fix's own first version only retried on
# `pull_request` events — which fire before checks finish, so the one
# enqueue attempt landed too early on both PRs and had to be run by hand.
# The explicit enqueue call is a no-op (swallowed) when a PR isn't eligible
# yet, is already queued, or already merged, so re-running it from either
# trigger, for every open PR a check_suite touches, is harmless.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
    branches: [main]
  check_suite:
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_suite.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge when green
    if: github.event_name == 'pull_request' || github.event.check_suite.app.slug == 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Determine target PR numbers
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            numbers="[$PR_NUMBER]"
          else
            # check_suite.pull_requests lists same-repo PRs whose head matches
            # this commit; only ones targeting main are ours to handle.
            numbers="$(jq -c '[.[] | select(.base.ref == "main") | .number]' <<<"$CHECK_SUITE_PRS")"
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

      - name: Enable or disable auto-merge, and enqueue, per target PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.targets.outputs.numbers }}
        run: |
          set -euo pipefail
          for PR in $(jq -r '.[]' <<<"$NUMBERS"); do
            info="$(gh pr view "$PR" --json isDraft,labels,id)"
            draft="$(jq -r '.isDraft' <<<"$info")"
            held="$(jq -r '[.labels[].name] | any(. == "hold")' <<<"$info")"
            node_id="$(jq -r '.id' <<<"$info")"

            if [ "$draft" = "true" ] || [ "$held" = "true" ]; then
              echo "PR #$PR is draft=$draft held=$held — disabling auto-merge."
              gh pr merge "$PR" --disable-auto || true
              continue
            fi

            # The merge queue owns the merge method (SQUASH, per the
            # require-pr-and-checks ruleset) — `gh pr merge` only arms auto-merge.
            echo "PR #$PR is ready and unheld — enabling auto-merge."
            gh pr merge "$PR" --auto || true

            gh api graphql -f query='
              mutation($id: ID!) {
                enqueuePullRequest(input: {pullRequestId: $id}) {
                  mergeQueueEntry { state position }
                }
              }' -f id="$node_id" \
              || echo "PR #$PR not eligible to enqueue yet (checks pending, already queued, or already merged) — harmless."
          done
