name: Auto-merge

# Enables GitHub's native auto-merge on every ready PR so it lands the moment
# the branch-ruleset requirements are satisfied — the five required status
# checks (ci-web, ci-api, controlled-signup OAuth callback E2E, All action refs
# are SHA-pinned, Architecture boundaries do not regress) plus a clean run
# through the merge queue. The queue squash-merges (its own merge_method), so
# `gh pr merge` here only arms auto-merge and does not pick a method.
#
# Deliberately does NOT wait on any review bot. Claude, CodeRabbit, Cubic,
# Greptile and Codex are advisory commenters, not merge gates, so turning any
# of them off never changes whether a PR can merge. Only the required checks in
# the `require-pr-and-checks` ruleset do.
#
# Escape hatch: add the `hold` label to freeze a PR (auto-merge is turned back
# off); remove it to release. Drafts are never enqueued.
#
# Uses the default GITHUB_TOKEN, not a GitHub App identity. Enabling
# auto-merge only flips a flag on the PR; the merge queue performs the actual
# merge later under its own identity, so nothing here needs elevated
# credentials.
#
# Also explicitly enqueues the PR (the `enqueuePullRequest` GraphQL mutation),
# not just `gh pr merge --auto`. Found live 2026-09-04 (PR #1171): arming
# auto-merge does not reliably re-enqueue a PR into a *required* merge queue
# after a later push — the PR sat CLEAN and mergeable with auto-merge armed,
# but never entered the queue until enqueued explicitly. The explicit call is
# a no-op (ignored via `|| true`) when the PR isn't eligible yet, is already
# queued, or is already merged, so re-running it on every push is harmless.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
    branches: [main]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge when green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable or disable auto-merge
        id: automerge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HELD: ${{ contains(github.event.pull_request.labels.*.name, 'hold') }}
        run: |
          set -euo pipefail
          if [ "$DRAFT" = "true" ] || [ "$HELD" = "true" ]; then
            echo "PR #$PR is draft=$DRAFT held=$HELD — disabling auto-merge."
            gh pr merge "$PR" --disable-auto || true
            echo "node_id=" >> "$GITHUB_OUTPUT"
          else
            # The merge queue owns the merge method (SQUASH, per the
            # require-pr-and-checks ruleset) — `gh pr merge` only arms auto-merge.
            echo "PR #$PR is ready and unheld — enabling auto-merge."
            gh pr merge "$PR" --auto
            node_id="$(gh pr view "$PR" --json id --jq .id)"
            echo "node_id=$node_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Explicitly enqueue into the merge queue
        if: steps.automerge.outputs.node_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_ID: ${{ steps.automerge.outputs.node_id }}
        run: |
          set -euo pipefail
          gh api graphql -f query='
            mutation($id: ID!) {
              enqueuePullRequest(input: {pullRequestId: $id}) {
                mergeQueueEntry { state position }
              }
            }' -f id="$NODE_ID" || echo "Not eligible to enqueue yet (checks pending, already queued, or already merged) - harmless, GitHub will enqueue it once eligible."
