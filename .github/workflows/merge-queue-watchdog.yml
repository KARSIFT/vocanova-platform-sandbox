name: merge-queue-watchdog

# Recurring failure mode, confirmed live twice (2026-09-05): a PR enters the
# merge queue (state AWAITING_CHECKS) and GitHub never dispatches its
# merge_group re-verification. No error, no timeout - it just sits there,
# and because the queue is FIFO, one stuck entry blocks every PR behind it.
# PR #1176 alone: stuck ~17 minutes. Later, five PRs (#1187-#1191) queued
# back to back all stalled together, blocked on #1187 sitting at the head
# for ~19 minutes with nothing behind it able to progress.
#
# A single stale entry can be re-kicked in place. When every entry is stale,
# re-kicking each one merely rotates the FIFO queue, so the watchdog first
# dequeues all entries, confirms the queue is empty, then re-enqueues its
# captured order. Queue mutations deliberately use a separate repository
# credential: GitHub does not start workflows from events caused by the
# Actions GITHUB_TOKEN, including the merge_group runs this recovery needs.
#
# Root cause is unconfirmed - this treats the symptom (a GitHub merge-queue
# backend quirk), not a bug in this repo's own workflows.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: unstick stale merge-queue entries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover stale AWAITING_CHECKS entries
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE_WATCHDOG_TOKEN: ${{ secrets.MERGE_QUEUE_WATCHDOG_TOKEN }}
        run: |
          python3 .github/scripts/merge_queue_watchdog.py \
            --repository "$GITHUB_REPOSITORY" --stale-minutes 10
