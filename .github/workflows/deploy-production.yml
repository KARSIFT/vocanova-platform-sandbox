name: deploy-production

# Auto-deploys on every push to main (2026-08-08, founder's explicit, twice-
# confirmed request - see AGENTS.md's "Release and deployment authority"
# section): release.yml's own auto_release_enabled path is what actually
# produces that push (a checked, merged promotion PR), so by the time this
# fires the code has already passed CI + independent review on every task
# PR that went into it. workflow_dispatch stays available as a manual
# override/retry path with the same input defaults a push run resolves to
# automatically (see each `inputs.X || 'default'` below) - nothing about
# manual dispatch changed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_web_host:
        description: "Production web hostname (founder-confirmed for this run)"
        required: true
        type: string
        default: production.vocanova.site
      production_api_host:
        description: "Production API hostname (founder-confirmed for this run)"
        required: true
        type: string
        default: api-production.vocanova.site
      production_api_base_url:
        description: "NEXT_PUBLIC_API_BASE_URL baked into the web bundle at build time and called from the browser - no port, now that Cloudflare forwards the plain :443 hostname to the origin's 8443 (VOC-038-T03 prep; verify this Cloudflare rule is still in place before dispatching)"
        required: true
        type: string
        default: https://api-production.vocanova.site
      new_user_signup_allowlist:
        description: "VOC-038-D00/D01: comma-separated emails admitted to sign up while NEW_USER_SIGNUP_ENABLED stays false (the L1 controlled-launch cohort). Leave empty to allowlist no one. Expanding the cohort is editing this input at the next dispatch - no code change."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short commit SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate production Sentry DSN configuration for api/web
        env:
          PRODUCTION_SENTRY_DSN: ${{ secrets.PRODUCTION_SENTRY_DSN }}
          PRODUCTION_WEB_SENTRY_DSN: ${{ secrets.PRODUCTION_WEB_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_SENTRY_DSN:-}" ] && [ -z "${PRODUCTION_WEB_SENTRY_DSN:-}" ]; then
            echo "PRODUCTION_SENTRY_DSN / PRODUCTION_WEB_SENTRY_DSN both unset - proceeding with Sentry disabled for production"
            exit 0
          fi
          if [ -z "${PRODUCTION_SENTRY_DSN:-}" ] || [ -z "${PRODUCTION_WEB_SENTRY_DSN:-}" ]; then
            echo "PRODUCTION_SENTRY_DSN / PRODUCTION_WEB_SENTRY_DSN partially set - refusing half-configured production Sentry" >&2
            exit 1
          fi

      - name: Build and push vocanova-api
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/karsift/vocanova-api:sha-${{ steps.sha.outputs.short_sha }}
            ghcr.io/karsift/vocanova-api:prod
          provenance: false

      - name: Build and push vocanova-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.production_api_base_url || 'https://api-production.vocanova.site' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.PRODUCTION_WEB_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_RELEASE=sha-${{ steps.sha.outputs.short_sha }}
          tags: |
            ghcr.io/karsift/vocanova-web:sha-${{ steps.sha.outputs.short_sha }}
            ghcr.io/karsift/vocanova-web:prod
          provenance: false

      - name: Configure SSH host key verification
        env:
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Bundle production deploy artifacts
        run: |
          set -euo pipefail
          rm -rf /tmp/production-deploy-bundle
          mkdir -p /tmp/production-deploy-bundle
          mkdir -p /tmp/production-deploy-bundle/nginx/conf.d
          mkdir -p /tmp/production-deploy-bundle/infra/scripts
          mkdir -p /tmp/production-deploy-bundle/apps/api/scripts
          mkdir -p /tmp/production-deploy-bundle/apps/api/migrations

          cp infra/docker-compose.production.yml /tmp/production-deploy-bundle/
          cp infra/nginx-production/nginx.conf /tmp/production-deploy-bundle/nginx/
          cp infra/nginx-production/conf.d/*.conf /tmp/production-deploy-bundle/nginx/conf.d/
          cp infra/scripts/rehearse-production-secrets-boundary.sh /tmp/production-deploy-bundle/infra/scripts/
          chmod +x /tmp/production-deploy-bundle/infra/scripts/rehearse-production-secrets-boundary.sh
          cp apps/api/scripts/migrate.sh /tmp/production-deploy-bundle/apps/api/scripts/
          chmod +x /tmp/production-deploy-bundle/apps/api/scripts/migrate.sh
          # VOC-050-T00's synthetic smoke-test account seed. The
          # script and its SQL travel together; the script resolves
          # the .sql file relative to its own directory.
          cp apps/api/scripts/seed-synthetic-smoke-user.sh /tmp/production-deploy-bundle/apps/api/scripts/
          cp apps/api/scripts/seed-synthetic-smoke-user.sql /tmp/production-deploy-bundle/apps/api/scripts/
          chmod +x /tmp/production-deploy-bundle/apps/api/scripts/seed-synthetic-smoke-user.sh
          cp apps/api/migrations/*.sql /tmp/production-deploy-bundle/apps/api/migrations/
          cp apps/api/migrations/atlas.sum /tmp/production-deploy-bundle/apps/api/migrations/
          tar -czf "$GITHUB_WORKSPACE/production-deploy-bundle.tgz" -C /tmp/production-deploy-bundle .

      - name: Copy deploy bundle to production host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          source: production-deploy-bundle.tgz
          target: /tmp/

      - name: Sync production AI-provider configuration from GitHub secrets
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          envs: PRODUCTION_CLOUDFLARE_API_TOKEN,PRODUCTION_CLOUDFLARE_ACCOUNT_ID
          script: |
            set -euo pipefail
            if [ -z "${PRODUCTION_CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${PRODUCTION_CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "PRODUCTION_CLOUDFLARE_API_TOKEN / PRODUCTION_CLOUDFLARE_ACCOUNT_ID missing or empty" >&2
              exit 1
            fi
            sudo mkdir -p /opt/vocanova/production/secrets
            sudo chown "$(id -un)":"$(id -gn)" /opt/vocanova/production /opt/vocanova/production/secrets
            # Tighten before the first secret byte is written, not after:
            # the default 0755 from `mkdir` would leave a window in which
            # staging's deploy user could read this file.
            chmod 750 /opt/vocanova/production
            chmod 700 /opt/vocanova/production/secrets
            touch /opt/vocanova/production/secrets/api.env
            chmod 600 /opt/vocanova/production/secrets/api.env
            sed -i \
              -e '/^AI_PROVIDER=/d' \
              -e '/^AI_PROVIDER_API_KEY=/d' \
              -e '/^AI_PROVIDER_ACCOUNT_ID=/d' \
              -e '/^AI_PROVIDER_MODEL=/d' \
              -e '/^AI_FEATURES_ENABLED=/d' \
              /opt/vocanova/production/secrets/api.env
            {
              echo "AI_PROVIDER=cloudflare"
              echo "AI_PROVIDER_API_KEY=${PRODUCTION_CLOUDFLARE_API_TOKEN}"
              echo "AI_PROVIDER_ACCOUNT_ID=${PRODUCTION_CLOUDFLARE_ACCOUNT_ID}"
              echo "AI_PROVIDER_MODEL=@cf/meta/llama-3.1-8b-instruct-fp8-fast"
              echo "AI_FEATURES_ENABLED=true"
            } >> /opt/vocanova/production/secrets/api.env
            chmod 600 /opt/vocanova/production/secrets/api.env

      # Monitoring is optional-until-adopted, unlike the AI-provider sync
      # above: skip cleanly (do not block deploys, including unrelated
      # ones like T03's kill-switch verification) while these secrets
      # don't exist yet, but still fail closed on a PARTIAL state (one set,
      # one missing), which is the actual misconfiguration signal.
      # Sentry/uptime API code no-ops when SENTRY_DSN is unset (see
      # cmd/api/main.go), so an empty pair is safe, not silent-broken.
      - name: Sync production monitoring configuration from GitHub secrets
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_SENTRY_DSN: ${{ secrets.PRODUCTION_SENTRY_DSN }}
          PRODUCTION_MONITORING_TEST_TOKEN: ${{ secrets.PRODUCTION_MONITORING_TEST_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          envs: PRODUCTION_SENTRY_DSN,PRODUCTION_MONITORING_TEST_TOKEN
          script: |
            set -euo pipefail
            if [ -z "${PRODUCTION_SENTRY_DSN:-}" ] && [ -z "${PRODUCTION_MONITORING_TEST_TOKEN:-}" ]; then
              echo "PRODUCTION_SENTRY_DSN / PRODUCTION_MONITORING_TEST_TOKEN both unset - skipping (monitoring not yet adopted)"
              exit 0
            fi
            if [ -z "${PRODUCTION_SENTRY_DSN:-}" ] || [ -z "${PRODUCTION_MONITORING_TEST_TOKEN:-}" ]; then
              echo "PRODUCTION_SENTRY_DSN / PRODUCTION_MONITORING_TEST_TOKEN partially set - refusing a half-configured state" >&2
              exit 1
            fi
            sed -i \
              -e '/^SENTRY_DSN=/d' \
              -e '/^MONITORING_TEST_TOKEN=/d' \
              /opt/vocanova/production/secrets/api.env
            {
              echo "SENTRY_DSN=${PRODUCTION_SENTRY_DSN}"
              echo "MONITORING_TEST_TOKEN=${PRODUCTION_MONITORING_TEST_TOKEN}"
            } >> /opt/vocanova/production/secrets/api.env
            chmod 600 /opt/vocanova/production/secrets/api.env

      # Google OAuth is optional-until-adopted, same reasoning as the
      # monitoring sync above: skip cleanly while these secrets don't
      # exist, fail closed on a PARTIAL state. GOOGLE_OAUTH_ENABLED
      # itself is written by the config step below, gated on whether
      # this step actually wrote a client ID/secret pair.
      - name: Sync production Google OAuth configuration from GitHub secrets
        id: google_oauth
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          envs: PRODUCTION_GOOGLE_OAUTH_CLIENT_ID,PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET
          script: |
            set -euo pipefail
            if [ -z "${PRODUCTION_GOOGLE_OAUTH_CLIENT_ID:-}" ] && [ -z "${PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET both unset - skipping (OAuth not yet adopted)"
              exit 0
            fi
            if [ -z "${PRODUCTION_GOOGLE_OAUTH_CLIENT_ID:-}" ] || [ -z "${PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET partially set - refusing a half-configured state" >&2
              exit 1
            fi
            sed -i \
              -e '/^GOOGLE_OAUTH_CLIENT_ID=/d' \
              -e '/^GOOGLE_OAUTH_CLIENT_SECRET=/d' \
              /opt/vocanova/production/secrets/api.env
            {
              echo "GOOGLE_OAUTH_CLIENT_ID=${PRODUCTION_GOOGLE_OAUTH_CLIENT_ID}"
              echo "GOOGLE_OAUTH_CLIENT_SECRET=${PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET}"
            } >> /opt/vocanova/production/secrets/api.env
            chmod 600 /opt/vocanova/production/secrets/api.env

      # BASE_URL/OAUTH_REDIRECT_URI/etc. are not secrets - they're
      # non-sensitive config derived entirely from this workflow's own
      # production_web_host/production_api_host inputs - so they're
      # written here from workflow inputs rather than requiring a
      # separate founder pre-population step the way DATABASE_URL and
      # provider API keys do. Email magic-link and signups stay OFF
      # (VOC-032-DEP-07's production-tier equivalent) until real
      # credentials for those exist too; GOOGLE_OAUTH_ENABLED instead
      # tracks whether the Google OAuth sync step above actually found
      # a client ID/secret pair, so OAuth turns on automatically once
      # VOC-038-T03's credentials are adopted, with no separate flag
      # to remember to flip. AI stays on per its own sync step. Found
      # live during VOC-037-T06's first real deploy rehearsal (api
      # container looped on "BASE_URL is required" until this was
      # added).
      - name: Write production application configuration
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_WEB_HOST: ${{ inputs.production_web_host || 'production.vocanova.site' }}
          PRODUCTION_API_HOST: ${{ inputs.production_api_host || 'api-production.vocanova.site' }}
          PRODUCTION_SENTRY_RELEASE: sha-${{ steps.sha.outputs.short_sha }}
          PRODUCTION_NEW_USER_SIGNUP_ALLOWLIST: ${{ inputs.new_user_signup_allowlist }}
          PRODUCTION_GOOGLE_OAUTH_ENABLED: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID != '' && secrets.GOOGLE_OAUTH_CLIENT_SECRET != '' }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          envs: PRODUCTION_WEB_HOST,PRODUCTION_API_HOST,PRODUCTION_SENTRY_RELEASE,PRODUCTION_NEW_USER_SIGNUP_ALLOWLIST,PRODUCTION_GOOGLE_OAUTH_ENABLED
          script: |
            set -euo pipefail
            sed -i \
              -e '/^ENVIRONMENT=/d' \
              -e '/^BASE_URL=/d' \
              -e '/^OAUTH_REDIRECT_URI=/d' \
              -e '/^OAUTH_REDIRECT_ALLOWLIST=/d' \
              -e '/^SESSION_COOKIE_DOMAIN=/d' \
              -e '/^SESSION_COOKIE_SECURE=/d' \
              -e '/^SESSION_LIFETIME=/d' \
              -e '/^SENTRY_ENVIRONMENT=/d' \
              -e '/^SENTRY_RELEASE=/d' \
              -e '/^EMAIL_MAGIC_LINK_ENABLED=/d' \
              -e '/^GOOGLE_OAUTH_ENABLED=/d' \
              -e '/^NEW_USER_SIGNUP_ENABLED=/d' \
              -e '/^NEW_USER_SIGNUP_ALLOWLIST=/d' \
              /opt/vocanova/production/secrets/api.env
            {
              echo "ENVIRONMENT=production"
              # Port :8443 is required for these browser-facing values too:
              # live reproduction showed the unqualified host hits nginx's
              # 444 catch-all instead of production's real listener. This
              # matches the same Cloudflare/host-sharing finding already
              # documented in the health-check comment below.
              echo "BASE_URL=https://${PRODUCTION_API_HOST}:8443"
              echo "OAUTH_REDIRECT_URI=https://${PRODUCTION_API_HOST}:8443/api/v1/auth/oauth/google/callback"
              echo "OAUTH_REDIRECT_ALLOWLIST=https://${PRODUCTION_WEB_HOST}:8443/onboarding,https://${PRODUCTION_WEB_HOST}:8443/home"
              # Shared parent domain (e.g. ".vocanova.site"), NOT the bare
              # web hostname: the session/CSRF cookies are set by the API
              # host (api-X) but must also domain-match the web host (X) -
              # a sibling subdomain, not a child. A bare web hostname value
              # here means a real browser would reject the Set-Cookie from
              # the API host entirely. .env.example already documents this;
              # this line previously didn't follow its own documented
              # convention (found live via VOC-037-T03's rehearsal + PR
              # #276's review). staging's real host has always used the
              # correct ".vocanova.site" form, set directly by the founder.
              echo "SESSION_COOKIE_DOMAIN=.${PRODUCTION_WEB_HOST#*.}"
              echo "SESSION_COOKIE_SECURE=true"
              echo "SESSION_LIFETIME=720h"
              echo "SENTRY_ENVIRONMENT=production"
              echo "SENTRY_RELEASE=${PRODUCTION_SENTRY_RELEASE}"
              echo "EMAIL_MAGIC_LINK_ENABLED=false"
              echo "GOOGLE_OAUTH_ENABLED=${PRODUCTION_GOOGLE_OAUTH_ENABLED}"
              echo "NEW_USER_SIGNUP_ENABLED=false"
              echo "NEW_USER_SIGNUP_ALLOWLIST=${PRODUCTION_NEW_USER_SIGNUP_ALLOWLIST}"
            } >> /opt/vocanova/production/secrets/api.env
            chmod 600 /opt/vocanova/production/secrets/api.env

      - name: Deploy to production host
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          PRODUCTION_WEB_HOST: ${{ inputs.production_web_host || 'production.vocanova.site' }}
          PRODUCTION_API_HOST: ${{ inputs.production_api_host || 'api-production.vocanova.site' }}
          # The immutable per-commit tag, not the mutable `prod` tag, is
          # what production actually runs: DOC-11 §3's rollback model is
          # "redeploy the previous artifact by digest", which requires
          # the deployed tag to identify one specific build.
          PRODUCTION_IMAGE_SHA_TAG: ${{ steps.sha.outputs.short_sha }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_SSH_USER }}
          PRODUCTION_DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,PRODUCTION_WEB_HOST,PRODUCTION_API_HOST,PRODUCTION_IMAGE_SHA_TAG,STAGING_DEPLOY_USER,PRODUCTION_DEPLOY_USER
          script: |
            set -euo pipefail

            sudo mkdir -p /opt/vocanova/production
            sudo tar -xzf /tmp/production-deploy-bundle.tgz -C /opt/vocanova/production
            sudo chown -R "$(id -un)":"$(id -gn)" /opt/vocanova/production
            chmod 750 /opt/vocanova/production
            mkdir -p /opt/vocanova/production/secrets/nginx
            chmod 700 /opt/vocanova/production/secrets
            chmod 700 /opt/vocanova/production/secrets/nginx
            # Re-assert the file baseline on every deploy rather than
            # trusting whatever mode the founder-populated files were
            # created with; the rehearsal below fails the deploy if any
            # of them is wider than 0600.
            find /opt/vocanova/production/secrets -type f -exec chmod 600 {} +

            if ! command -v atlas >/dev/null 2>&1; then
              sudo curl -fsSL "https://release.ariga.io/atlas/atlas-linux-amd64-v1.2.0" -o /usr/local/bin/atlas
              sudo chmod +x /usr/local/bin/atlas
            fi

            cd /opt/vocanova/production
            sed -i "s/__PRODUCTION_WEB_HOST__/${PRODUCTION_WEB_HOST}/g" nginx/conf.d/10-production-web.conf
            sed -i "s/__PRODUCTION_API_HOST__/${PRODUCTION_API_HOST}/g" nginx/conf.d/20-api-production.conf

            export VOCANOVA_PRODUCTION_ROOT="/opt/vocanova/production"
            export PRODUCTION_IMAGE_TAG="sha-${PRODUCTION_IMAGE_SHA_TAG}"

            # Pre-flight cross-tier guard. `docker compose config` folds
            # env_file entries into `environment:` and drops their paths,
            # so the raw compose source is scanned as well - an env_file
            # pointing at staging renders completely clean otherwise.
            # The post-deploy rehearsal script performs the same check
            # plus the host-permission and negative-access ones; this
            # guard exists to fail before anything is started.
            compose_paths="$(
              {
                docker compose -f docker-compose.production.yml -p vocanova-production config
                sed 's/[[:space:]]*#.*$//' docker-compose.production.yml
              } | grep -oE "/opt/vocanova[^\"' :,}]*" | sort -u || true
            )"
            stray_paths="$(printf '%s\n' "$compose_paths" \
              | grep -v '^/opt/vocanova/production' | grep -v '^$' || true)"
            if [ -n "$stray_paths" ]; then
              echo "ERROR: production compose references paths outside /opt/vocanova/production:" >&2
              printf '%s\n' "$stray_paths" >&2
              exit 1
            fi
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f docker-compose.production.yml -p vocanova-production pull

            docker compose -f docker-compose.production.yml -p vocanova-production up -d postgres
            postgres_status=starting
            for attempt in $(seq 1 30); do
              postgres_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' vocanova-production-postgres 2>/dev/null || true)
              if [ "$postgres_status" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            if [ "$postgres_status" != "healthy" ]; then
              echo "ERROR: production Postgres did not become healthy within 60 seconds" >&2
              docker compose -f docker-compose.production.yml -p vocanova-production logs --no-color --tail=100 postgres >&2
              exit 1
            fi

            set -a
            . /opt/vocanova/production/secrets/api.env
            set +a
            postgres_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' vocanova-production-postgres)
            if [ -z "$postgres_ip" ]; then
              echo "ERROR: could not resolve production Postgres private IP" >&2
              exit 1
            fi
            migration_database_url=$(printf "%s" "$DATABASE_URL" | sed "s/@postgres:5432/@${postgres_ip}:5432/")
            if [ "$migration_database_url" = "$DATABASE_URL" ]; then
              echo "ERROR: DATABASE_URL does not target the expected Compose postgres service" >&2
              exit 1
            fi
            DATABASE_URL="$migration_database_url" sh /opt/vocanova/production/apps/api/scripts/migrate.sh
            unset migration_database_url

            # VOC-050-T00: ensure the synthetic smoke-test account
            # exists before the rest of the stack starts. The seed is
            # idempotent, so it runs on every deploy; it reads the
            # reserved identity from the api.env sourced above, which
            # is the same value the API itself refuses on every real
            # sign-in path. A seed failure aborts the deploy under
            # `set -e` before `up -d`, leaving the running containers
            # untouched - the same fail-closed shape as the migration
            # step above.
            DOCKER_COMPOSE_CMD="docker compose -f docker-compose.production.yml -p vocanova-production" \
              sh /opt/vocanova/production/apps/api/scripts/seed-synthetic-smoke-user.sh

            docker compose -f docker-compose.production.yml -p vocanova-production up -d

            # T06's rehearsal always runs and its output is always printed
            # in full. It is only allowed to NOT fail the deploy for the
            # one specific, disclosed, founder-waived finding recorded in
            # t06-production-provisioning-evidence.md's "Confirmed
            # residual risk" section (2026-08-02): staging's real deploy
            # identity, `ubuntu`, has independent pre-existing blanket
            # sudo via the standard %sudo group default, which INS-11
            # correctly cannot pass against. Any other failure (INS-9,
            # INS-10, or an INS-11 failure against any identity other
            # than the exact waived one) still fails the deploy - this is
            # not a blanket "ignore rehearsal failures" carve-out.
            set +e
            rehearsal_output="$(bash /opt/vocanova/production/infra/scripts/rehearse-production-secrets-boundary.sh \
              "$STAGING_DEPLOY_USER" \
              "$PRODUCTION_DEPLOY_USER" 2>&1)"
            rehearsal_exit=$?
            set -e
            printf '%s\n' "$rehearsal_output"
            if [ "$rehearsal_exit" -ne 0 ]; then
              # The waiver is intentionally hardcoded to the literal
              # account name "ubuntu", not the $STAGING_DEPLOY_USER
              # variable. The variable is whatever STAGING_SSH_USER
              # currently is - if that secret is ever repointed to a
              # different account (including via the account-migration
              # remediation t06-production-provisioning-evidence.md
              # itself discusses), an identically-shaped blanket-sudo
              # failure against the NEW account must NOT be silently
              # auto-waived by this carve-out; it needs a fresh founder
              # review. (Independent verification, PR #282, found this
              # exact gap when the exclusion was built from the variable
              # instead of the literal name - fixed here.)
              if [ "$STAGING_DEPLOY_USER" = "ubuntu" ]; then
                unwaived="$(printf '%s\n' "$rehearsal_output" | grep -E '^\s*(FAIL|ERROR):' \
                  | grep -vF "FAIL: ubuntu is NOT read-blocked from /opt/vocanova/production/secrets/api.env: ubuntu already has independent broad sudo" \
                  | grep -vF "FAIL: ubuntu is NOT traversal-blocked from /opt/vocanova/production: ubuntu already has independent broad sudo" \
                  | grep -vE '^FAIL: [0-9]+ production/staging secret boundary check\(s\) failed$' \
                  || true)"
              else
                unwaived="$rehearsal_output"
              fi
              if [ -n "$unwaived" ]; then
                echo "ERROR: rehearsal failed with finding(s) beyond the disclosed, founder-waived ubuntu blanket-sudo risk:" >&2
                printf '%s\n' "$unwaived" >&2
                exit 1
              fi
              echo "::warning::Production secrets-boundary rehearsal FAILED INS-11 only on the disclosed, founder-waived finding (ubuntu's independent blanket sudo — see t06-production-provisioning-evidence.md). Deploy continues; this is a known accepted risk, not a new regression."
            fi

      # Port :8443 (not the default 443) because production and staging
      # currently share one physical host (D00 supersession note, T06
      # evidence): staging's nginx already owns the host's port 443, so
      # production's nginx publishes on 8443 instead. Cloudflare proxies
      # 8443 to any proxied hostname without extra configuration (it's
      # one of Cloudflare's built-in alternate HTTPS ports), which is
      # exactly why this works with zero Cloudflare-side changes - but
      # every client (including these health checks) must include the
      # port explicitly. Found live: the first real deploy's poll steps
      # (unqualified :443) silently hit Cloudflare's 520 fallback instead
      # of production's actual nginx.
      - name: Poll production API health endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 \
                "https://${{ inputs.production_api_host || 'api-production.vocanova.site' }}:8443/healthz" > /dev/null; then
              echo "Production API health check passed on attempt $i/60"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: production API did not become healthy within 5 minutes" >&2
          exit 1

      - name: Poll production web endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(curl -sS --max-time 5 -o /dev/null -w "%{http_code}" \
                "https://${{ inputs.production_web_host || 'production.vocanova.site' }}:8443/" || echo "000")
            if [[ "$status" == 2* ]]; then
              echo "Production web health check passed on attempt $i/60 (status $status)"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: production web did not return 2xx within 5 minutes" >&2
          exit 1

      # VOC-038-T02: replaces the manual curl/SSH checks used ad hoc
      # during R2 with a scripted, repeatable suite. Expected
      # kill-switch state mirrors the "Write production application
      # configuration" step above (email/signups off, AI on).
      # EXPECT_OAUTH_ENABLED mirrors the same secrets-present condition
      # as GOOGLE_OAUTH_ENABLED there, instead of a hardcoded "false" -
      # found live on VOC-038-T03's first real dispatch after adopting
      # OAuth credentials: the real kill switch correctly flipped to
      # true, but this hardcoded expectation still said false, failing
      # the suite over a stale assumption rather than a real defect.
      # SMOKE_TEST_SESSION_COOKIE is intentionally unset here - no
      # founder-provisioned smoke-test account exists yet, so the
      # core-loop check runs as a non-fatal SKIP until one is.
      - name: Run production smoke-test suite
        env:
          EXPECT_MAGIC_LINK_ENABLED: "false"
          EXPECT_OAUTH_ENABLED: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID != '' && secrets.GOOGLE_OAUTH_CLIENT_SECRET != '' }}
          EXPECT_NEW_SIGNUPS_ENABLED: "false"
          EXPECT_AI_ENABLED: "true"
        run: |
          bash infra/scripts/smoke-test-production.sh \
            "https://${{ inputs.production_api_host || 'api-production.vocanova.site' }}:8443" \
            "https://${{ inputs.production_web_host || 'production.vocanova.site' }}:8443"
