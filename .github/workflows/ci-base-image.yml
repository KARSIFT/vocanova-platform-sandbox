name: CI base image

# Builds and publishes the shared Node+pnpm+Go image ci-web/ci-api use, so
# they don't reinstall those toolchains on every run. Simplified from
# kandev's ci-base-image.yml: one combined image, no Postgres mirroring, no
# desktop/Rust stage (not applicable to this stack).

on:
  push:
    branches: [main]
    paths:
      - .github/docker/ci-base/**
      - .github/workflows/ci-base-image.yml
      - apps/api/go.mod
      - pnpm-lock.yaml
      - .nvmrc
  pull_request:
    branches: [main]
    paths:
      - .github/docker/ci-base/**
      - .github/workflows/ci-base-image.yml
      - apps/api/go.mod
      - pnpm-lock.yaml
      - .nvmrc
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/karsift/vocanova-ci-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Publish on push to main (the default path) or manual dispatch (used
      # to seed a new tag from a feature branch, before the same branch's
      # ci-web/ci-api can pull it - otherwise a PR introducing a Dockerfile
      # change can never go green against its own new tag).
      - name: Log in to GHCR
        if: |
          github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          hash=$(cat \
              .github/docker/ci-base/Dockerfile \
              apps/api/go.mod \
              pnpm-lock.yaml \
              .nvmrc \
            | sha256sum | cut -c1-12)
          echo "image_tag=${hash}" >> "$GITHUB_OUTPUT"
          echo "Computed content hash: sha-${hash}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: .github/docker/ci-base/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          cache-from: type=gha,scope=ci-base
          cache-to: type=gha,scope=ci-base,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Summarize
        run: |
          {
            echo "### vocanova CI base image"
            echo ""
            echo "- image: \`${IMAGE_NAME}:sha-${IMAGE_TAG}\` / \`latest\`"
            echo "- pushed: \`${PUSHED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          PUSHED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
