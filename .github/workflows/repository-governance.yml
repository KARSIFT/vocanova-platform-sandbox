name: Repository Governance

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1, verified from the official repository.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        # actions/setup-python v5.6.0, verified from the official repository.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run repository-foundation unit tests
        run: python3 -m unittest discover -s tooling/governance/tests -p 'test_*.py' -v
      - name: Validate repository foundation
        run: python3 tooling/governance/validate_repository_foundation.py --repository-root .
      - name: Check governance shell syntax
        run: |
          bash -n scripts/governance/validate-governance.sh
          bash -n scripts/governance/classify-change-risk.sh
          bash -n scripts/governance/validate-monitoring-impact.sh
      - name: Validate existing governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/governance/validate-governance.sh --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            bash scripts/governance/validate-governance.sh
          fi
      - name: Classify change risk
        run: bash scripts/governance/classify-change-risk.sh
