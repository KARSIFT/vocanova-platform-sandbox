name: Repository Governance

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1, verified from the official repository.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        # actions/setup-python v7.0.0, verified from the official repository.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up Node.js for repository evidence validation
        # actions/setup-node v6.3.0, verified from the official repository.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
      - name: Validate agent-skill capture provenance with full history
        env:
          VOC112_REQUIRE_CAPTURE_HISTORY: "true"
        run: node --test scripts/foundation/voc112-navigation-benchmark.test.mjs
      - name: Run repository-foundation unit tests
        run: python3 -m unittest discover -s tooling/governance/tests -p 'test_*.py' -v
      - name: Validate repository foundation
        run: python3 tooling/governance/validate_repository_foundation.py --repository-root .
      - name: Check governance shell syntax
        run: |
          bash -n scripts/governance/validate-governance.sh
          bash -n scripts/governance/classify-change-risk.sh
          bash -n scripts/governance/validate-monitoring-impact.sh
      - name: Validate existing governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/governance/validate-governance.sh --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            bash scripts/governance/validate-governance.sh
          fi
      - name: Classify change risk
        run: bash scripts/governance/classify-change-risk.sh
