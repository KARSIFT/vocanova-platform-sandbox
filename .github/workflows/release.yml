name: release

# Cut a versioned checkpoint of `main`:
#   1. compute the next SemVer from the latest vX.Y.Z tag + package.json
#   2. bump package.json versions and regenerate CHANGELOG.md via git-cliff
#   3. open a release/vX.Y.Z PR and admin-merge it into main
#   4. push the annotated tag vX.Y.Z on the merged commit
#   5. publish a GitHub Release with git-cliff-generated notes
#   6. (optional) dispatch deploy-production.yml for the new tag
#
# Maintainer-dispatched only. The release diff is version + changelog only
# (no code), so the merge is admin (bypasses required checks / merge queue) —
# the same model as kdlbs/kandev's release.yml.
#
# Required repository secret:
#   RELEASE_PR_TOKEN — a GitHub App installation token or fine-grained PAT with
#   `contents: write` + `pull_requests: write` on this repo, added as a bypass
#   actor on the `main` branch ruleset (and any `v*` tag ruleset). GITHUB_TOKEN
#   cannot be used: PRs it opens do not start required-check workflows, and it
#   is not a ruleset bypass actor.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump"
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
      deploy:
        description: "Dispatch deploy-production for the new tag after publishing"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Compute version + regenerate CHANGELOG locally; do not push branch, tag, or release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: cut release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

      - name: Require main
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_REF" != "refs/heads/main" ]; then
            echo "The release workflow must be dispatched from main (got $CURRENT_REF)." >&2
            exit 1
          fi

      - name: Require RELEASE_PR_TOKEN for a real release
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PR_TOKEN:-}" ]; then
            echo "RELEASE_PR_TOKEN is not configured. Add it (see the header of this" >&2
            echo "workflow) or run again with dry_run = true." >&2
            exit 1
          fi

      - name: Install git-cliff
        env:
          CLIFF_VERSION: "2.10.1"
        run: |
          set -euo pipefail
          pipx install "git-cliff==${CLIFF_VERSION}"
          git-cliff --version

      - name: Configure git identity
        run: |
          git config user.name "vocanova release bot"
          git config user.email "release-bot@users.noreply.github.com"

      - name: Compute next version
        id: compute
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          LATEST_TAG="$(git tag --list 'v*' | python3 -c "
          import sys, re
          best = (0, 0, 0)
          for t in (l.strip() for l in sys.stdin if l.strip()):
              m = re.match(r'^v(\d+)\.(\d+)\.(\d+)$', t)
              if not m:
                  continue
              v = tuple(int(x) for x in m.groups())
              if v > best:
                  best = v
          print(f'{best[0]}.{best[1]}.{best[2]}')
          ")"
          BASELINE="$(python3 -c "
          a = tuple(int(x) for x in '$PKG_VERSION'.split('.'))
          b = tuple(int(x) for x in '$LATEST_TAG'.split('.'))
          print('$PKG_VERSION' if a >= b else '$LATEST_TAG')
          ")"
          IFS=. read -r MAJ MIN PAT <<<"$BASELINE"
          case "$BUMP" in
            patch) NEXT="${MAJ}.${MIN}.$((PAT + 1))" ;;
            minor) NEXT="${MAJ}.$((MIN + 1)).0" ;;
            major) NEXT="$((MAJ + 1)).0.0" ;;
            *) echo "Invalid bump '$BUMP'" >&2; exit 1 ;;
          esac
          TAG="v${NEXT}"
          echo "package.json version: $PKG_VERSION"
          echo "latest release tag:   ${LATEST_TAG:-<none>}"
          echo "baseline:             $BASELINE"
          echo "bump:                 $BUMP"
          echo "next version:         $NEXT ($TAG)"
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump package versions + regenerate CHANGELOG
        env:
          NEXT: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$NEXT" <<'PY'
          import json, sys
          nxt = sys.argv[1]
          for path in ("package.json", "apps/web/package.json"):
              with open(path) as fh:
                  data = json.load(fh)
              data["version"] = nxt
              with open(path, "w") as fh:
                  json.dump(data, fh, indent=2)
                  fh.write("\n")
          PY
          git-cliff --tag "$TAG" -o CHANGELOG.md
          echo "----- CHANGELOG.md (top) -----"
          head -n 40 CHANGELOG.md

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "Dry run — no branch, tag, or release will be pushed."
          git --no-pager diff --stat

      - name: Create + merge release PR
        id: release_pr
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          NEXT: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="release/$TAG"
          MSG="release: $TAG"
          git checkout -b "$BRANCH"
          git add package.json apps/web/package.json CHANGELOG.md
          git commit -m "$MSG"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git push -u origin "$BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"
          PR_URL="$(gh pr create --title "$MSG" --body "Automated release \`$TAG\`. Version bump + regenerated CHANGELOG only." --head "$BRANCH" --base main)"
          echo "Opened $PR_URL"
          gh pr merge "$PR_URL" --admin --squash --match-head-commit "$HEAD_SHA" --subject "$MSG" --body ""
          MERGE_SHA="$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid')"
          STATE="$(gh pr view "$PR_URL" --json state --jq '.state')"
          if [ "$STATE" != "MERGED" ] || [ -z "$MERGE_SHA" ]; then
            echo "Release PR did not merge (state=$STATE)." >&2
            exit 1
          fi
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Tag + publish GitHub Release
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          TAG: ${{ steps.compute.outputs.tag }}
          MERGE_SHA: ${{ steps.release_pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "Merge commit $MERGE_SHA is not on origin/main." >&2
            exit 1
          fi
          git tag -a "$TAG" -m "release: $TAG" "$MERGE_SHA"
          git push origin "refs/tags/$TAG"
          git-cliff --tag "$TAG" --latest --strip all -o /tmp/release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md

      - name: Dispatch deploy-production
        if: ${{ !inputs.dry_run && inputs.deploy }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production.yml --ref "$TAG"
          echo "Dispatched deploy-production for $TAG."
          echo "Track it: gh run list --workflow=deploy-production.yml"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          {
            echo "## Released $TAG"
            echo ""
            echo "- Tag: [\`$TAG\`](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
            echo "- Deploy dispatched: ${{ inputs.deploy }}"
          } >> "$GITHUB_STEP_SUMMARY"
