name: Temporary WebKit session diagnostic

# Temporary investigation on the delivery branch only; remove before merging.
# Synthetic mock data only. These diagnostic outcomes do not replace the full
# accessibility workflow or any release acceptance check.
on:
  push:
    branches: [codex/frontend-complete-coverage-20261106]
    paths:
      - ".github/workflows/vocanova-webkit-diagnostic.yml"
      - ".github/diagnostics/**"
      - "apps/web/src/lib/csrf.ts"
      - "apps/web/tests/lib/csrf.test.ts"

permissions:
  contents: read

concurrency:
  group: webkit-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-diagnostic:
    name: Temporary WebKit mobile-360 session diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      VOCANOVA_TEST_BROWSER: webkit
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.14.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client + design tokens
        run: pnpm run build:packages

      - name: Build web production bundle against the synthetic API
        env:
          API_BASE_URL: "http://127.0.0.1:8080"
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8080"
        run: pnpm --filter @vocanova/web build

      - name: Install pinned WebKit and system dependencies
        run: pnpm --filter @vocanova/web exec playwright install --with-deps webkit

      - name: Diagnose the original session recovery test
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p .work/webkit-diagnostic
          set -o pipefail
          pnpm --filter @vocanova/web exec playwright test tests/e2e/sentence-feedback-pending.spec.ts --config playwright.cross-browser.config.ts --grep "failed session recovery" --project mobile-360 --repeat-each 5 --retries 0 --workers 1 --trace on --output test-results/webkit-diagnostic-original 2>&1 | tee .work/webkit-diagnostic/original.log

      - name: Diagnose instrumented session cookie reads
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p .work/webkit-diagnostic
          set -o pipefail
          pnpm --filter @vocanova/web exec playwright test --config ../../.github/diagnostics/sentence-cookie-read-diagnostic.config.ts --project mobile-360 --repeat-each 2 --workers 1 --trace on --output test-results/webkit-diagnostic-instrumented 2>&1 | tee .work/webkit-diagnostic/instrumented.log

      - name: Preserve all synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webkit-session-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/webkit-diagnostic/
            apps/web/test-results/webkit-diagnostic-original/
            apps/web/test-results/webkit-diagnostic-instrumented/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
