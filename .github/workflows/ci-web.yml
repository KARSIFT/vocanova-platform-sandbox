name: ci-web

# Lint, typecheck, unit-test, and build the web app plus its two workspace
# packages (design-tokens, api-client). Required on every PR into main.
#
# Runs inside the shared vocanova-ci-base image (Node/pnpm preinstalled,
# published by ci-base-image.yml) instead of reinstalling those toolchains
# every run. Pinned by content-hash tag, not :latest, for reproducibility -
# bump this alongside any Dockerfile/toolchain-version change and confirm
# ci-base-image.yml has actually published it first (see #1146's PR
# description for why that has to happen in that order).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-web-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a merge-queue run - its ref is unique per queue entry, so
  # the queue reads a cancelled check as a failure and ejects the entry.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  ci-web:
    name: ci-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/karsift/vocanova-ci-base:sha-e2b0adde7385
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # scripts/foundation/*.test.mjs shells out to `docker` for real
      # container-content assertions; the CLI alone has no daemon without
      # this socket mount (docker-outside-of-docker against the runner's
      # own daemon).
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      # actions/checkout v7.0.1, pinned to the immutable commit documented at
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design-tokens + api-client packages
        run: pnpm run build:packages

      - name: Validate workspace layout
        run: pnpm run validate:workspace

      - name: Repo foundation checks (deploy config, monitoring, tokens, etc.)
        run: node --test scripts/foundation/*.test.mjs

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:web && pnpm run lint:packages

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit test (packages)
        run: pnpm --filter @vocanova/api-client test

      - name: Unit test (web middleware)
        run: pnpm --filter @vocanova/web test:middleware

      - name: Build @vocanova/web
        run: pnpm run build:web
