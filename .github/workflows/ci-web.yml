name: ci-web

# Lint, typecheck, unit-test, and build the web app plus its two workspace
# packages (design-tokens, api-client). Required on every PR into main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-web:
    name: ci-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1, pinned to the immutable commit documented at
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node v7.0.0, pinned to the immutable commit documented
      # at https://github.com/actions/setup-node/releases/tag/v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.14.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design-tokens + api-client packages
        run: pnpm run build:packages

      - name: Validate workspace layout
        run: pnpm run validate:workspace

      - name: Repo foundation checks (deploy config, monitoring, tokens, etc.)
        run: node --test scripts/foundation/*.test.mjs

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:web && pnpm run lint:packages

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit test (packages)
        run: pnpm --filter @vocanova/api-client test

      - name: Unit test (web middleware)
        run: pnpm --filter @vocanova/web test:middleware

      - name: Build @vocanova/web
        run: pnpm run build:web
