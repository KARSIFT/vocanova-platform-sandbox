name: operational-failure-monitoring

# Turns terminal failures in the repository's deployment and
# behavioral-synthetic gates into a plain, deduplicated GitHub issue.
#
# This observer is deliberately separate from the observed workflows so it also
# sees cancellation, timeout, and failures that happen before an inline failure
# handler could run. It never reads job logs or failure output. The issue body is
# built only from allowlisted workflow/conclusion values and GitHub's canonical
# run URL.

on:
  workflow_run:
    workflows:
      - scheduled-synthetics
      - deploy-staging
      - deploy-production
    types:
      - completed

permissions:
  contents: read
  actions: read

# Serialize the list-then-create deduplication transaction. A constant group is
# intentional: failures from different observed workflows must not race while
# checking the open-issue marker index.
concurrency:
  group: operational-failure-monitoring
  cancel-in-progress: false

jobs:
  observe:
    name: open governed issue for operational failure
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default-branch observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Fail closed if the App identity is unavailable. GITHUB_TOKEN-created
      # issue events do not start the downstream issue-to-plan workflow.
      - name: Require automation GitHub App credentials
        env:
          KARSIFT_BOT_APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
          KARSIFT_BOT_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KARSIFT_BOT_APP_ID:-}" ] || [ -z "${KARSIFT_BOT_PRIVATE_KEY:-}" ]; then
            echo "Automation GitHub App credentials are required" >&2
            exit 1
          fi

      # Issues write only — matches the App installation grant (VOC-098-D00).
      # Bounded Actions jobs metadata for classify-deploy-concurrency-cancel.sh
      # uses the job GITHUB_TOKEN (actions: read at the workflow permissions floor).
      - name: Mint issue-writer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Classify benign deploy concurrency supersession
        id: classify-cancel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FAILURE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          FAILURE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FAILURE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if infra/scripts/classify-deploy-concurrency-cancel.sh; then
            echo "skip_issue=true" >> "$GITHUB_OUTPUT"
            echo "Benign concurrency-superseded deploy cancellation; skipping issue creation"
          else
            echo "skip_issue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or deduplicate sanitized operational issue
        if: steps.classify-cancel.outputs.skip_issue != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FAILURE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          FAILURE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FAILURE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: infra/scripts/open-failure-issue.sh
