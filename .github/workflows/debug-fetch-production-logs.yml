name: debug-fetch-production-logs

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fetch recent api + web logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/vocanova/production
            echo "===== web (last 15m) ====="
            docker compose -f docker-compose.production.yml -p vocanova-production logs --no-color --since=15m web | tail -300
            echo "===== api (last 15m) ====="
            docker compose -f docker-compose.production.yml -p vocanova-production logs --no-color --since=15m api | tail -300
