name: pipeline

# Thin file. All real logic lives in KARSIFT/karsift-ai-infra's reusable
# workflows - this just wires triggers to them. Runs alongside (not instead
# of) this repo's own governance/risk-classification workflows, if any.
#
# `plan` turns a request (free text, an existing document, or a GitHub issue's
# whole thread) into a DRAFT change package (planner role, see plan.yml).
# Independent plan review and merge-gate policy decide whether the exact draft
# may merge; `adopt` then records adoption authority and opens the real per-task
# tracking issues. A `reconcile` dispatch safely repairs the handoff if that
# merge event was missed. `plan-from-issue` is what makes "anyone (a human, or
# another agent - e.g. one that reads application logs and notices a bug) just
# opens an issue" a valid way in: it auto-drafts a package from that issue,
# asking a clarifying question back on the issue itself if there isn't enough
# to go on yet, but a bare issue never becomes implementation authority on its
# own. Once a package is adopted, `implement` (dispatched per task) and
# `auto-advance` carry on from there.
#
# Copy this file into a project repo and fill in:
#   - auto_merge_enabled, only once you have real evidence for this project's loop
#   - integration_branch below - "develop" if this project splits develop/main,
#     "main" if it's GitHub-flow-only (a single long-lived branch). Get this
#     wrong and the very first checkout step fails outright.
#   - id_prefix - appears TWICE (the workflow_dispatch default, and
#     plan-from-issue's hardcoded value) - keep both in sync, e.g. "VOC"
#   - your project's own PR-body convention for "Risk classification: R#" and
#     "Package path: `...`" if it differs from the defaults this template assumes
#
# PRIVATE REPO + GitHub Free org plan: org-level secrets (ANTHROPIC_API_KEY,
# OPENAI_API_KEY, etc.) silently do NOT reach private repos on a Free org plan,
# even when the secret's visibility is set to "All repositories" and the GitHub
# API reports it as configured for this repo - jobs just see an empty value
# with no error at workflow-definition time, only a runtime "Secret X is
# required, but not provided" failure. Confirmed on vocanova-platform-sandbox's
# first real run. If this repo is private and org secrets aren't reaching it,
# set the same secret again at the repo level (`gh secret set ANTHROPIC_API_KEY
# --repo OWNER/REPO`, likewise for OPENAI_API_KEY) rather than assuming the
# org-level one will work. Public repos and Team/Enterprise-plan orgs are
# unaffected.

on:
  pull_request:
    # Draft-aware merge-gate must re-evaluate an unchanged exact SHA when its
    # evidence is complete and the PR becomes ready for review.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  schedule:
    - cron: "0 * * * *"
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed]
  check_run:
    types: [completed]
  # GitHub suppresses check_run recursion for checks created by Actions.
  # Observe the external prerequisite workflows directly instead.
  workflow_run:
    workflows: [deploy-staging, scheduled-synthetics, controlled-signup-oauth-e2e, Repository Governance, Governance policy, accessibility, lighthouse]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: "Which reusable workflow to run"
        required: true
        type: choice
        options: [implement, plan, reconcile, reconcile-release, reconcile-production-change, reconcile-live-evidence, recover-integration-push, recover-promotion-pr-checks]
        default: implement
      change_id:
        description: 'implement only: adopted package to implement from, e.g. "VOC-007"'
        required: false
        type: string
      package_path:
        description: 'implement only: path to the package directory, e.g. "specs/changes/VOC-007-some-slug"'
        required: false
        type: string
      task_id:
        description: "implement only: task ID from the package's task list"
        required: false
        type: string
      issue_number:
        description: "implement or reconcile-production-change: GitHub issue carrying task authority"
        required: false
        type: string
      attempt:
        description: "implement only: 1 or 2"
        required: false
        type: string
        default: "1"
      existing_pr_number:
        description: "implement only: existing open implementation PR to resume at attempt 2"
        required: false
        type: string
      request:
        description: "plan only: free-text description of the change package to draft"
        required: false
        type: string
      source_document_path:
        description: "plan only: path to an existing document in the repo to draft from, instead of/alongside request"
        required: false
        type: string
      id_prefix:
        description: 'plan only: package ID prefix, e.g. "VOC"'
        required: false
        type: string
        default: "VOC"
      plan_pr_number:
        description: "reconcile only: merged plan PR whose adoption/roster handoff must be repaired"
        required: false
        type: string
      release_issue_number:
        description: "reconcile-release only: release audit issue whose promotion handoff must be repaired"
        required: false
        type: string
      live_evidence_mode:
        description: "reconcile-live-evidence only: poll, observe one run, or dispatch the declared workflow"
        required: false
        type: choice
        options: [reconcile, observe, dispatch]
        default: reconcile
      live_evidence_run_id:
        description: "reconcile-live-evidence observe only: successful Actions run id"
        required: false
        type: string
      live_evidence_pr_number:
        description: "reconcile-live-evidence dispatch and recover-promotion-pr-checks: target PR number"
        required: false
        type: string
      promotion_pr_number:
        description: "recover-promotion-pr-checks: target promotion PR number"
        required: false
        type: string

# Read-only verifier dispatch lives on pipeline-verify.yml (VOC-126) so this
# workflow_dispatch block can include existing_pr_number without exceeding
# GitHub's 25-input maximum.

# Explicit floor for the reusable jobs below that do not declare narrower
# job-level permissions. Most call karsift-ai-infra workflows with
# `secrets: inherit`; read-only verifier dispatch lives on pipeline-verify.yml
# (VOC-126). Without
# an explicit workflow or job floor, reusable callers silently
# inherit whatever the repo's own default_workflow_permissions setting
# grants, and a reusable workflow call can never get MORE access than its
# caller has regardless of what the called workflow's own job declares.
# This union covers every permission any called workflow
# (implement/adopt/release/merge-gate/review/remediate/plan/auto-advance)
# actually needs - added 2026-08-08 specifically so this repo's
# default_workflow_permissions could be safely tightened from "write" to
# "read" without breaking the pipeline; do not narrow this without
# re-checking every called reusable workflow's own job-level permissions
# first. Job-level Actions-write exceptions are limited to live-evidence dispatch
# and exact-SHA recovery in recover-integration-push, merge-gate, and release.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

# A synchronize event supersedes every older pipeline for the same PR. Cancel
# the older run to avoid duplicate CI/reviewer cost; the exact-SHA inputs below
# remain the correctness boundary if cancellation races with an active job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  # Hourly secondary wake for an integration merge whose original post-merge
  # recovery attempt timed out or was interrupted. The reusable recovery is
  # exact-SHA bound and serialized. Its read-only preflight is a mutation-free
  # no-op once every workflow selected by the integration tip's path policy has
  # completed successfully.
  resolve-integration-recovery-target:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'recover-integration-push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      recovery_needed: ${{ steps.target.outputs.recovery_needed }}
    steps:
      - name: Resolve current integration head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/develop" --jq .object.sha)
          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Current integration head is unavailable; refusing recovery." >&2
            exit 1
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

          changed_paths=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/commits/$target_sha?per_page=100" |
            jq '[.[] | .files[]?.filename]')
          deploy_required=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              */*) ;;
              *) deploy_required=true ;;
            esac
            case "$changed_path" in
              apps/*|packages/*|infra/*|tests/staging-e2e/*|.github/workflows/deploy-staging.yml|scripts/foundation/voc111-deploy-staging-paths.test.mjs)
                deploy_required=true
                ;;
            esac
          done < <(jq -r '.[]' <<<"$changed_paths")

          workflow_runs=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/runs?head_sha=$target_sha&per_page=100")
          has_successful_run() {
            local workflow_path=".github/workflows/$1"
            jq -e --arg path "$workflow_path" \
              'any(.[] | .workflow_runs[]?; .path == $path and .status == "completed" and .conclusion == "success")' \
              >/dev/null <<<"$workflow_runs"
          }
          recovery_needed=false
          if ! has_successful_run repository-governance.yml ||
             { [ "$deploy_required" = true ] && ! has_successful_run deploy-staging.yml; }; then
            recovery_needed=true
          fi
          echo "recovery_needed=$recovery_needed" >> "$GITHUB_OUTPUT"

  recover-integration-push:
    needs: resolve-integration-recovery-target
    if: >-
      needs.resolve-integration-recovery-target.result == 'success' &&
      needs.resolve-integration-recovery-target.outputs.target_sha != '' &&
      ((github.event_name == 'schedule' && needs.resolve-integration-recovery-target.outputs.recovery_needed == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'recover-integration-push'))
    uses: KARSIFT/karsift-ai-infra/.github/workflows/recover-actions-checks.yml@main
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    with:
      recovery_mode: integration_push
      target_sha: ${{ needs.resolve-integration-recovery-target.outputs.target_sha }}
      branch_ref: develop
      timeout_seconds: "1800"
    secrets:
      KARSIFT_BOT_APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
      KARSIFT_BOT_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

  implement:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'implement'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/implement.yml@main
    with:
      change_id: ${{ inputs.change_id }}
      package_path: ${{ inputs.package_path }}
      task_id: ${{ inputs.task_id }}
      issue_number: ${{ inputs.issue_number }}
      attempt: ${{ inputs.attempt }}
      integration_branch: "develop"   # "main" for a GitHub-flow-only project
      existing_pr_number: ${{ inputs.existing_pr_number }}
    secrets: inherit

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/plan.yml@main
    with:
      request: ${{ inputs.request }}
      source_document_path: ${{ inputs.source_document_path }}
      id_prefix: ${{ inputs.id_prefix }}
      integration_branch: "develop"   # match the value used for implement, above
    secrets: inherit

  # Lets ANYONE (or any other agent, authenticated however it authenticates)
  # kick off planning just by opening an issue - no manual workflow_dispatch
  # needed. Gated on the issue carrying NO karsift:* label at open time,
  # since this system's own issue-creation (adopt.yml's task issues,
  # release.yml's release-audit issues) always labels what it opens - see
  # those files' own comments. An unlabeled issue is, by construction,
  # something this system didn't create itself.
  #
  # Also fires on a later comment, but only if the issue is currently labeled
  # `karsift:needs-info` (the planner asked a clarifying question and is
  # waiting - see plan.yml) AND the comment isn't from a bot account, so the
  # planner's own posted question doesn't re-trigger itself in a loop. This
  # is deliberately NOT restricted to human commenters specifically - a
  # human replying and another agent (e.g. one that read a log and is
  # supplying the detail the planner asked for) replying both work exactly
  # the same way, through the same issue thread.
  plan-from-issue:
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened' && toJSON(github.event.issue.labels) == '[]') ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'karsift:needs-info') && github.event.comment.user.type != 'Bot')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/plan.yml@main
    with:
      source_issue_number: ${{ github.event.issue.number }}
      id_prefix: "VOC"   # match the value used for the workflow_dispatch plan job, above
      integration_branch: "develop"   # match the value used for implement, above
    secrets: inherit

  # The other half of plan.yml's split: records adoption authority and opens
  # the ordered per-task tracking issues (and, if this package traces back to
  # an originating issue, closes the loop on it) once a "plan/"-branch PR merges
  # with passing plan review and governance validation. See adopt.yml's header
  # comment for why this is a separate step from drafting rather than at PR-open
  # time. Use `reconcile` dispatch if the merge event or adoption run was missed.
  adopt:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'plan/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile' && inputs.plan_pr_number != '')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/adopt.yml@main
    with:
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_pr_number || github.event.pull_request.number }}
    secrets: inherit

  ready-for-review-reuse:
    if: |
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'recover-promotion-pr-checks')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/ready-for-review-reuse.yml@main
    with:
      pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.promotion_pr_number }}
      expected_head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # Recovery always takes the full CI path, so base-SHA reuse metadata is
      # intentionally absent instead of falsely identifying the develop tip as
      # both the promotion PR head and base.
      expected_base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      event_action: ${{ github.event_name == 'pull_request' && github.event.action || 'recovery' }}
      current_run_id: ${{ github.run_id }}

  ci:
    needs: [ready-for-review-reuse]
    if: |
      always() &&
      (
        (github.event_name == 'pull_request' && github.event.action != 'closed') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'recover-promotion-pr-checks')
      )
    uses: KARSIFT/karsift-ai-infra/.github/workflows/ci.yml@main
    with:
      # GitHub rulesets evaluate the newest required `ci / ci` context. Keep
      # that context successful on the optimized path without rerunning the
      # application checks; merge-gate still revalidates the prior run.
      reuse_evidence: ${{ needs.ready-for-review-reuse.outputs.outcome == 'reuse-evidence' }}

  # VOC-110-T00: merge-gating production Docker boot/HTTP smoke for changes
  # that can affect the shipped @vocanova/web standalone artifact. Builds
  # apps/web/Dockerfile locally (no registry push, no repository secrets),
  # starts the image, requires HTTP 2xx from `/`, verifies the container stays
  # running, and always cleans up. Any repo-root file is treated as relevant
  # so Docker-context controls such as .dockerignore fail closed; the gate's
  # own workflow/test paths are also relevant. Other plan/docs-only diffs take
  # a cheap success path without building an image.
  web-container-runtime:
    name: web container runtime
    needs: [ready-for-review-reuse]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect web-runtime-relevant changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq \
            '^([^/]+$|apps/web/|packages/|\.github/workflows/pipeline\.yml|scripts/foundation/voc110-web-container-runtime\.test\.mjs)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no web runtime surface changed
        if: steps.paths.outputs.relevant != 'true'
        run: |
          echo "No web-runtime, root-context, or gate-definition changes — skipping Docker runtime smoke."

      - name: Build, boot, and HTTP-smoke the production web image
        if: steps.paths.outputs.relevant == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          image_tag="vocanova-web:pr-${PR_NUMBER}-${RUN_ID}"
          container_name="vocanova-web-runtime-${RUN_ID}"
          host_port=13000

          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            docker rmi -f "$image_tag" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker version
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8080 \
            -t "$image_tag" .

          docker run -d --name "$container_name" \
            --add-host=host.docker.internal:host-gateway \
            -e API_BASE_URL=http://host.docker.internal:8080 \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -p "${host_port}:3000" \
            "$image_tag"

          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name" 2>/dev/null || echo false)" != "true" ]; then
              echo "Container exited before HTTP smoke succeeded" >&2
              docker logs --tail=100 "$container_name" >&2 || true
              exit 1
            fi
            status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:${host_port}/" || true)
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 300 ]; then
              echo "Root route returned HTTP ${status_code}"
              break
            fi
            sleep 2
          done

          if [ "${status_code:-0}" -lt 200 ] || [ "${status_code:-0}" -ge 300 ]; then
            echo "Root route did not return HTTP 2xx within 180s (last status: ${status_code:-none})" >&2
            docker logs --tail=100 "$container_name" >&2 || true
            exit 1
          fi

          if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
            echo "Container is not running after successful HTTP smoke" >&2
            exit 1
          fi

  # Planning PRs (head branch prefixed "plan/" by plan.yml) create a package
  # rather than implementing one, so they never carry the "Package path:"
  # line this job requires - the startsWith guard below skips this (and
  # review/remediate, which depend on it) for those PRs instead of failing a
  # check that would otherwise block merge-gate. merge-gate.yml itself parses
  # the plan package risk declaration and fails closed when it cannot determine
  # a risk class.
  #
  # Planning PRs get their OWN review instead (the `plan-review` job below),
  # not this one - added 2026-08-14. Before this, a planning PR's verdict
  # stayed permanently PENDING (nothing ever reviewed it), so merge-gate could
  # never see a passing verdict. See plan-review's own job comment and
  # karsift-ai-infra/.github/workflows/plan-review.yml for what it checks.
  extract-package-path:
    needs: [ready-for-review-reuse]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      startsWith(github.head_ref, 'agent/') &&
      needs.ready-for-review-reuse.outputs.outcome != 'reuse-evidence'
    runs-on: ubuntu-latest
    outputs:
      package_path: ${{ steps.extract.outputs.package_path }}
    steps:
      # PR_BODY goes through env:, never ${{ }}-interpolated directly into
      # the script - a PR body is text anyone who can open a PR controls,
      # and splicing it raw into a bash source before bash parses it is a
      # script-injection vector (a body containing a backtick is enough).
      - name: Parse package path from PR body
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          path=$(echo "$PR_BODY" | grep -oP '(?<=Package path: `)[^`]+')
          if [ -z "$path" ]; then
            echo "No 'Package path: \`...\`' line found in the PR body - review cannot run without it." >&2
            exit 1
          fi
          echo "package_path=$path" >> "$GITHUB_OUTPUT"

  review:
    needs: [ready-for-review-reuse, ci, extract-package-path]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      startsWith(github.head_ref, 'agent/') &&
      needs.ci.result == 'success' &&
      needs.extract-package-path.result == 'success' &&
      needs.ready-for-review-reuse.outputs.outcome != 'reuse-evidence'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      package_path: ${{ needs.extract-package-path.outputs.package_path }}
      integration_branch: "develop"   # match the value used for implement, above
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  # Independent review for a DRAFT change-package proposal (a "plan/"-branch
  # PR) - added 2026-08-14. Runs instead of `review` (never both - the two jobs' `if`
  # conditions are mutually exclusive on head_ref prefix), and posts the same
  # "**Independent verification - bound to commit ...**" / "VERDICT: ..."
  # comment shape, so merge-gate.yml's existing verdict-parsing (unchanged)
  # picks it up. `needs: ci` only, not extract-package-path, since a plan PR
  # has no "Package path:" line to extract - plan-review.yml resolves the
  # package path itself from the PR body's "New package directory: `...`"
  # line (the one plan.yml always writes).
  plan-review:
    needs: [ready-for-review-reuse, ci]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      startsWith(github.head_ref, 'plan/') &&
      needs.ci.result == 'success' &&
      needs.ready-for-review-reuse.outputs.outcome != 'reuse-evidence'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/plan-review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  # Runs after ci and every review. A no-op unless ci failed outright or the
  # review verdict is FAIL - then it either re-dispatches the implementer
  # once (with the failure details attached) or, if that retry already
  # happened, escalates to the authority issue instead of trying a third
  # time. See remediate.yml for the exact rule.
  #
  # `needs: [ci, review, ...]` + `always()` is required because review.yml
  # never runs at all when ci fails (review's own `needs: [ci, ...]` has no
  # always() guard, so it's skipped by default) - without depending on ci
  # directly and forcing this job to run regardless, a plain CI failure
  # (no reviewer verdict ever produced) left a PR permanently stuck with no
  # automatic retry. Found live: gpt-5.3-codex's first two implement
  # attempts on vocanova-platform-sandbox's VOC-018-T02 both failed CI
  # outright and needed a human to notice and push a fix by hand.
  remediate:
    needs: [ci, review, extract-package-path]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.head_ref, 'agent/') &&
      needs.extract-package-path.result == 'success' &&
      needs.ci.result != 'skipped' && needs.ci.result != 'cancelled'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/remediate.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      package_path: ${{ needs.extract-package-path.outputs.package_path }}
      integration_branch: "develop" # match the value used for implement, above
      ci_failed: ${{ needs.ci.result == 'failure' }}
      review_job_failed: ${{ needs.review.result == 'failure' }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  # `needs: [review, plan-review]` + the `always()` guard below fixes a real
  # race: on a plain `pull_request` event this job used to run with no
  # dependency on `review` at all, so it evaluated in parallel with (not
  # after) review - and since `ci` finishes faster than a full
  # independent-review pass, merge-gate's report-status routinely captured
  # verdict=PENDING before review had posted anything, then never got
  # another chance to look again (no further `pull_request` event fires
  # unless something pushes a new commit). Auto-merge was structurally
  # unable to fire on a normal single-commit PR - discovered on
  # vocanova-platform-sandbox's first real attempt to exercise
  # `auto_merge_enabled`. `always()` is required because a job depending on
  # a *skipped* job is by default also skipped - and on any given event
  # exactly one of `review`/`plan-review` runs (agent/ vs plan/ head_ref)
  # while the other is always skipped - all of that must still reach merge-gate
  # so its status comment actually posts,
  # rather than requiring either job's specific 'success' result.
  #
  # plan-review added to this needs/if 2026-08-14 - before this, merge-gate ran for
  # planning PRs with no review dependency at all, which was harmless only
  # because no review verdict could ever exist for them anyway (permanently
  # PENDING). Now that plan-review can produce a real PASS, merge-gate must
  # wait for it the same way it already waits for `review`, or it would
  # again risk capturing a stale PENDING before plan-review finishes.
  merge-gate:
    needs: [ready-for-review-reuse, ci, web-container-runtime, review, plan-review]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      needs.web-container-runtime.result == 'success' &&
      (needs.review.result == 'success' || needs.review.result == 'skipped') &&
      (needs.plan-review.result == 'success' || needs.plan-review.result == 'skipped')
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    uses: KARSIFT/karsift-ai-infra/.github/workflows/merge-gate.yml@main
    with:
      auto_merge_enabled: "true"      # proven live on this repo (VOC-012, VOC-014) for this project's loop
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
      reuse_outcome: ${{ needs.ready-for-review-reuse.outputs.outcome }}
      reuse_prior_run_id: ${{ needs.ready-for-review-reuse.outputs.prior_run_id }}
      current_ci_result: ${{ needs.ci.result }}
    secrets: inherit

  # A production-target task is an explicit exception to the normal integration
  # carrier. Reconcile its exact reviewed merge before release evaluation. The
  # ordinary issue-close trigger skips unrelated/integration tasks; an explicit
  # retry is strict and fails closed.
  reconcile-production-change:
    if: |
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile-production-change' && inputs.issue_number != '')
    permissions:
      contents: write
      issues: read
      pull-requests: read
    uses: KARSIFT/karsift-ai-infra/.github/workflows/reconcile-production-change.yml@main
    with:
      authority_issue_number: ${{ github.event.issue.number || fromJSON(inputs.issue_number) }}
      integration_branch: "develop"
      production_branch: "main"
      skip_ineligible: ${{ github.event_name == 'issues' }}
    secrets:
      KARSIFT_BOT_APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
      KARSIFT_BOT_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

  # Promotes only after every roster task has a valid App-authored marker for
  # its exact merged caller PR. Issue closure and terminal checks are wake-up
  # hints, not completion authority. `reconcile-release` retries convergence.
  # After a successful promotion merge, `develop` is advanced to that exact merge
  # SHA before the release audit closes. Deploy is out of scope - see
  # release.yml's header comment.
  release:
    needs: [merge-gate, reconcile-production-change]
    if: |
      always() &&
      (needs.reconcile-production-change.result == 'success' || needs.reconcile-production-change.result == 'skipped') && (
        (github.event_name == 'issues' && github.event.action == 'closed') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile-release' && inputs.release_issue_number != '') ||
        (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop') ||
        (github.event_name == 'check_run' && github.event.action == 'completed' &&
          github.event.check_run.pull_requests[0] != null &&
          github.event.check_run.pull_requests[0].base.ref == 'main' &&
          github.event.check_run.pull_requests[0].head.ref == 'develop') ||
        (github.event_name == 'workflow_run' && github.event.action == 'completed')
      )
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: KARSIFT/karsift-ai-infra/.github/workflows/release.yml@main
    with:
      release_issue_number: ${{ inputs.release_issue_number }}
      integration_branch: "develop"   # match the value used elsewhere in this file
      production_branch: "main"
    secrets: inherit

  # Fills the gap between adoption and release: dispatches the NEXT task in an
  # adopted package's roster once a valid App marker proves the current task's
  # exact reviewed caller PR merged. The issue-close event only wakes evaluation;
  # closed state alone cannot advance. Routine task-to-task progression needs no
  # further per-task human trigger. For
  # operator-owned / live-actions next tasks it prepares a deterministic
  # evidence-carrier PR instead of starting implement.yml (VOC-102). A
  # no-op on the package's last task (release's serialized convergence
  # evaluator above handles that transition instead) or if the next task is already
  # dispatched/done. Runs on the same `issues: closed` event as `release`
  # above - both are safe to fire together, since each package/task can
  # only ever be in the "next task exists" or "roster complete" state, never
  # both, so exactly one of the two actually does something per event.
  auto-advance:
    needs: [reconcile-production-change]
    if: |
      always() &&
      github.event_name == 'issues' && github.event.action == 'closed' &&
      needs.reconcile-production-change.result == 'success'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/auto-advance.yml@main
    with:
      integration_branch: "develop"   # match the value used elsewhere in this file
    # Explicit allowlist: ordinary-task progression needs the active Cursor
    # implementer, while operator/fail-closed jobs use only the App.
    # Do not expose unrelated repository secrets to this reusable workflow.
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      KARSIFT_BOT_APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
      KARSIFT_BOT_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

  # Polls Actions metadata against declared live-evidence contracts while a
  # task PR is waiting for operator-owned proof. The hourly run both qualifies
  # matching evidence and handles bounded timeout escalation. Explicit manual
  # observe/dispatch inputs are available for controlled operator recovery.
  # There is deliberately no catch-all workflow_run trigger: that shape can
  # observe this pipeline's own runs and create a recursive, wasteful loop.
  live-evidence-reconcile:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile-live-evidence')
    # A called workflow cannot elevate beyond its caller. Keep the workflow-wide
    # floor at Actions read and grant write only to this operator-owned job so it
    # can dispatch the single workflow/input pair declared by a reviewed contract.
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    uses: KARSIFT/karsift-ai-infra/.github/workflows/live-evidence-reconcile.yml@main
    with:
      mode: ${{ github.event_name == 'schedule' && 'reconcile' || inputs.live_evidence_mode }}
      workflow_run_id: ${{ inputs.live_evidence_run_id }}
      pr_number: ${{ inputs.live_evidence_pr_number }}
    # Pass only the two operator identity inputs declared by the reusable
    # workflow. Do not expose the caller's unrelated deploy/OAuth secrets.
    secrets:
      KARSIFT_BOT_APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
      KARSIFT_BOT_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
