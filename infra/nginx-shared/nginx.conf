# infra/nginx-shared/nginx.conf
#
# VOC-067-T02: main config for the shared public edge (one nginx process
# on host 80/443 for both staging and production).
#
# Package: VOC-067 (shared nginx edge)
# Authority: VOC-067-DEP-00 / DEP-01 (dedicated shared-edge compose;
#            per-tier vhost trees; single default_server catch-all).
#
# Tier vhost fragments stay in their own host/repo trees:
#   staging:    /opt/vocanova/infra/nginx/conf.d/     (repo: infra/nginx/conf.d/)
#   production: /opt/vocanova/production/nginx/conf.d/ (repo: infra/nginx-production/conf.d/)
#
# This file mounts at /etc/nginx/nginx.conf inside vocanova-shared-edge-nginx.
# Shared http{} directives (real-ip, TLS defaults, Docker DNS, catch-all)
# live under nginx-shared/conf.d/ and load once. Tier trees supply only
# hostname-specific server blocks (10-*.conf / 20-*.conf) so 00/01/02/05
# fragments are not duplicated when both tiers load into one process.
#
# Validation (from repo root, with disposable certs — see infra/README.md):
#   VOCANOVA_PRODUCTION_NGINX_CONF=$PWD/infra/nginx-production/conf.d \
#   VOCANOVA_PRODUCTION_NGINX_CERT=$PWD/infra/secrets/nginx/cert.pem \
#   VOCANOVA_PRODUCTION_NGINX_KEY=$PWD/infra/secrets/nginx/key.pem \
#   docker compose -f infra/docker-compose.shared-edge.yml config

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip         on;
    gzip_vary    on;
    gzip_types   text/plain text/css application/json application/javascript
                 text/javascript application/xml text/xml image/svg+xml;

    include /etc/nginx/conf.d/shared/*.conf;
    include /etc/nginx/conf.d/staging/10-*.conf;
    include /etc/nginx/conf.d/staging/20-*.conf;
    include /etc/nginx/conf.d/production/10-*.conf;
    include /etc/nginx/conf.d/production/20-*.conf;
}
