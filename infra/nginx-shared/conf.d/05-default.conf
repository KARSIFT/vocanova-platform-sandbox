# infra/nginx-shared/conf.d/05-default.conf
#
# VOC-067-T02: single catch-all default_server for the shared edge.
# Only one default_server may exist across staging + production vhosts
# (VOC-067-DEP-01). Tier trees no longer declare their own catch-all
# when loaded by infra/nginx-shared/nginx.conf.
#
# VOC-066: exact-match /healthz is the Docker HEALTHCHECK probe; every
# other unrecognized-Host path still gets 444 (VOC-032-D03 hardening).
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/staging/cert.pem;
    ssl_certificate_key /etc/nginx/certs/staging/key.pem;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}
