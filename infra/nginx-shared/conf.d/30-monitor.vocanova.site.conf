# infra/nginx-shared/conf.d/30-monitor.vocanova.site.conf
#
# VOC-081-T02: monitor.vocanova.site — Uptime Kuma reverse proxy on the shared edge.
# Authority: VOC-081-DEP-01 (repository-owned shared conf.d; supersedes the stale
#            host-only /opt/vocanova/production/nginx/conf.d/30-monitor.conf).
# Access:    VOC-081-DEP-00 — Cloudflare Access gates the public hostname before
#            traffic reaches this origin (see infra/monitoring/access-policy.md).
# Network:   upstream vocanova-uptime-kuma:3001 over vocanova-monitoring-net
#            (VOC-081-D01; no public host publish on port 3001).
#
# Loaded by infra/nginx-shared/nginx.conf → include /etc/nginx/conf.d/shared/*.conf
# Cloudflare real-IP restoration is inherited from 00-cloudflare-real-ip.conf.

map $http_upgrade $monitor_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name monitor.vocanova.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitor.vocanova.site;

    ssl_certificate     /etc/nginx/certs/production/cert.pem;
    ssl_certificate_key /etc/nginx/certs/production/key.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        set $upstream_kuma http://vocanova-uptime-kuma:3001;
        proxy_pass $upstream_kuma;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $monitor_connection_upgrade;

        proxy_read_timeout 86400;
    }
}
