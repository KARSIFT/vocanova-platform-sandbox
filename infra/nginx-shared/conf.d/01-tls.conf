# infra/nginx/conf.d/01-tls.conf
#
# VOC-032-T05: shared TLS settings for every `listen 443 ssl` server
# block in this conf.d directory (these directives are valid at http
# context and apply to all ssl server blocks that don't override
# them, so they're defined once here rather than repeated in
# 05-default.conf / 10-staging-web.conf / 20-api-staging.conf).
#
# ASSUMPTION FLAGGED FOR THE FOUNDER (per this task's own
# instructions - VOC-032-T05, tasks.md): this configuration assumes
# Cloudflare's "Full (strict)" SSL/TLS mode - i.e. Cloudflare
# terminates the client-facing TLS connection and re-encrypts to
# this origin, validating the origin certificate mounted at
# tier-specific /etc/nginx/certs/{staging,production}/cert.pem mounts
# (VOC-032-DEP-01, Cloudflare Origin CA
# certificate). If the founder instead wants "Flexible" (Cloudflare
# to origin over plaintext HTTP - not recommended, defeats the
# purpose of terminating TLS here at all) or a different mode, that
# is a VOC-032-DEP-01 follow-up decision, not something this file
# silently assumes past this flag.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
