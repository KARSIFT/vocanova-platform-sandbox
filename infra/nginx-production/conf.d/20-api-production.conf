server {
    listen 80;
    server_name __PRODUCTION_API_HOST__;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __PRODUCTION_API_HOST__;

    ssl_certificate     /etc/nginx/certs/production/cert.pem;
    ssl_certificate_key /etc/nginx/certs/production/key.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        set $upstream_api http://vocanova-production-api:8080;
        proxy_pass $upstream_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies share the parent domain; forward only this tier's own
        # session/CSRF cookies and the host-only OAuth state cookie by exact
        # name. An absent cookie arrives with an empty value.
        proxy_set_header Cookie "vocanova_production_session=$cookie_vocanova_production_session; vocanova_production_csrf=$cookie_vocanova_production_csrf; vocanova_oauth_state=$cookie_vocanova_oauth_state";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
