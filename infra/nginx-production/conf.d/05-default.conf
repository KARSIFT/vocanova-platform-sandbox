# infra/nginx-production/conf.d/05-default.conf
#
# Retained for rollback reference only (VOC-067-T04 retired the per-tier
# production nginx cutover bridge). The shared edge loads only this tree's
# 10-*.conf / 20-*.conf vhosts — not this file — via
# infra/nginx-shared/nginx.conf.
#
# VOC-066: exact-match /healthz is the Docker HEALTHCHECK probe; every other
# unrecognized-Host path still gets 444.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/production/cert.pem;
    ssl_certificate_key /etc/nginx/certs/production/key.pem;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}
