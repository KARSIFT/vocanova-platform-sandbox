# infra/nginx-production/conf.d/05-default.conf
#
# VOC-067-T02: catch-all for the temporary production nginx cutover bridge
# (host 8081/8443) while Cloudflare still remaps to origin :8443. The shared
# edge's single default_server lives in infra/nginx-shared/conf.d/05-default.conf
# and is the only catch-all loaded into vocanova-shared-edge-nginx (that
# process includes only this tree's 10-*.conf / 20-*.conf, not this file).
#
# VOC-066: exact-match /healthz is the Docker HEALTHCHECK probe; every other
# unrecognized-Host path still gets 444.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/production/cert.pem;
    ssl_certificate_key /etc/nginx/certs/production/key.pem;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}
