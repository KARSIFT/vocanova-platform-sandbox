# infra/nginx/nginx.conf
#
# VOC-032-T05: nginx reverse-proxy main configuration for the
# staging host.
#
# Package: VOC-032 (Begin Milestone R1 - Staging Readiness)
# Task:    VOC-032-T05
# Risk:    R3 (per docs/governance/change-risk-classification.md; this
#          file is in the `infra/` path-class, which the classifier
#          floors at R3).
# Authority: VOC-032 change package (adopted 2026-07-28;
#            specs/changes/VOC-032-begin-milestone-r1-staging-readiness-docs-product/).
# Depends on: T04 (infra/docker-compose.yml), which mounts this file
#             read-only at /etc/nginx/nginx.conf inside the `nginx`
#             service, replacing the base nginx:1.27-alpine image's
#             default configuration entirely.
#
# This file mirrors the image's own default nginx.conf structure
# (events{} + http{} with the standard mime/log/gzip defaults) so the
# only material change from stock nginx is (a) logging to stdout/
# stderr, which is what `docker compose logs` expects, and (b)
# including infra/nginx/conf.d/*.conf, which is where the actual
# Cloudflare real-IP restoration and the two staging server blocks
# live (VOC-032-D03: staging.vocanova.site / api-staging.vocanova.site).
#
# Cross-references:
#   * infra/nginx/conf.d/00-cloudflare-real-ip.conf - restores the
#     real client IP from Cloudflare's CF-Connecting-IP header, scoped
#     to Cloudflare's published ranges only (VOC-032-R01 mitigation).
#   * infra/nginx/conf.d/10-staging-web.conf - staging.vocanova.site
#     routes to the `web` service.
#   * infra/nginx/conf.d/20-api-staging.conf - api-staging.vocanova.site
#     routes to the `api` service.
#   * infra/docker-compose.yml (T04) - mounts this file and conf.d/,
#     plus the TLS cert/key this conf.d expects at
#     /etc/nginx/certs/{cert,key}.pem (VOC-032-DEP-01, founder-
#     provisioned; infra/nginx/generate-dev-cert.sh substitutes a
#     self-signed pair for local validation per VOC-032-TEST-12).
#
# Validation (VOC-032-TEST-12):
#   docker run --rm \
#     -v $(pwd)/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
#     -v $(pwd)/infra/nginx/conf.d:/etc/nginx/conf.d:ro \
#     -v $(pwd)/infra/secrets/nginx/cert.pem:/etc/nginx/certs/cert.pem:ro \
#     -v $(pwd)/infra/secrets/nginx/key.pem:/etc/nginx/certs/key.pem:ro \
#     nginx:1.27-alpine nginx -t

# No explicit `user` directive: the nginx:1.27-alpine base image's
# entrypoint already runs the worker processes as its own unprivileged
# `nginx` user; overriding it here would require this file to also
# know the image's internal UID/GID, which is the image's own
# concern, not this config's.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Standard combined-ish log format; kept close to the stock nginx
    # default so any future log-shipping tooling recognizes the
    # format without a custom parser.
    log_format main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

    # Logging to stdout/stderr (not a file) so `docker compose logs
    # nginx` is the single place the founder looks, matching every
    # other service in infra/docker-compose.yml (VOC-032-D01's
    # x-logging default applies to the container's stdout/stderr,
    # which these two lines feed).
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip         on;
    gzip_vary    on;
    gzip_types   text/plain text/css application/json application/javascript
                 text/javascript application/xml text/xml image/svg+xml;

    # Cloudflare real-IP restoration (VOC-032-R01) and the two
    # staging server blocks (VOC-032-D03) live under conf.d/. Both
    # bare directives (real-ip) and full `server {}` blocks are valid
    # directly inside this `http` context, so one `include` covers
    # both kinds of file.
    include /etc/nginx/conf.d/*.conf;
}
