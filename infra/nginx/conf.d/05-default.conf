# infra/nginx/conf.d/05-default.conf
#
# VOC-032-T05: explicit default/catch-all server blocks.
#
# Without an explicit `default_server`, nginx silently picks the
# first server block it loads for a given listen address:port as the
# fallback for any request whose Host header (or SNI name, for TLS)
# doesn't match a more specific server_name - which would make an
# arbitrary/absent Host header quietly route into whichever of
# staging.vocanova.site or api-staging.vocanova.site happened to load
# first. That's an accident waiting to happen, not a deliberate
# routing decision, so this file marks an explicit default that
# rejects anything not addressed to one of the two real hostnames
# (VOC-032-D03) with 444 (nginx's own "close the connection without a
# response" status - not a real HTTP status, but the standard nginx
# idiom for "we will not dignify this request with a response").
#
# The 443 default still needs a certificate (nginx requires at least
# one server block per listen address:port to declare
# ssl_certificate/ssl_certificate_key), so it uses the same
# Cloudflare origin cert/key mounted for the two real server blocks
# (VOC-032-DEP-01) - a TLS handshake for an unrecognized SNI name
# still completes (using this cert), then the request itself is
# rejected at the HTTP layer.
#
# VOC-066: exact-match /healthz on the default server is the
# deliberate Docker HEALTHCHECK probe path. VOC-067-T02: the live
# shared edge loads catch-all + /healthz from infra/nginx-shared/conf.d/
# instead of this file (only 10-/20- vhosts load from this tree).
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/staging/cert.pem;
    ssl_certificate_key /etc/nginx/certs/staging/key.pem;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}
