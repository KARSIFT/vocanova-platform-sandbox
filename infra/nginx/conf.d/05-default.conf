# infra/nginx/conf.d/05-default.conf
#
# VOC-067-T02: intentionally empty of server blocks. The live shared edge
# (infra/nginx-shared/nginx.conf) loads only this tree's 10-*.conf / 20-*.conf
# vhosts; the single default_server catch-all + /healthz probe lives in
# infra/nginx-shared/conf.d/05-default.conf (VOC-067-DEP-01: only one
# default_server across the combined set). Keeping listen … default_server
# here would reintroduce a dual-default_server collision if includes were
# ever widened to staging/*.conf.
#
# Historical note: VOC-032-T05 / VOC-066 originally declared the catch-all
# in this file for the per-tier staging nginx container, which T02 removed
# from infra/docker-compose.yml.
