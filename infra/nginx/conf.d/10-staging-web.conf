# infra/nginx/conf.d/10-staging-web.conf
#
# VOC-032-T05: staging.vocanova.site -> the `web` service
# (infra/docker-compose.yml, T04), per VOC-032-D03's staging
# subdomain proposal.
#
# Plain-80 requests redirect to 443 (DOC-11 §1 "TLS everywhere");
# 443 terminates TLS using the Cloudflare origin certificate
# (VOC-032-DEP-01) and reverse-proxies to the web container's
# internal address (http://web:3000, matching T04's compose network
# - `web` is not published to the host, only reachable through
# nginx). Security headers (X-Content-Type-Options, X-Frame-Options,
# Referrer-Policy) are set on every response, including error
# responses (`always`), per this task's own acceptance criteria.
server {
    listen 80;
    server_name staging.vocanova.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.vocanova.site;

    ssl_certificate     /etc/nginx/certs/staging/cert.pem;
    ssl_certificate_key /etc/nginx/certs/staging/key.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # The upstream is set via a variable (rather than a bare
        # `proxy_pass http://web:3000;`) so nginx re-resolves the
        # `web` Compose service name through Docker's embedded DNS
        # on each request (02-docker-dns.conf) instead of caching
        # whatever IP it had at config-load time.
        set $upstream_web http://vocanova-web:3000;
        proxy_pass $upstream_web;

        # Standard reverse-proxy headers: Host lets the Next.js
        # server see the original hostname; X-Real-IP/X-Forwarded-For
        # carry the already-restored real client IP ($remote_addr,
        # which 00-cloudflare-real-ip.conf has substituted from
        # CF-Connecting-IP when the request genuinely came via
        # Cloudflare); X-Forwarded-Proto tells the app the original
        # request was HTTPS even though this proxy_pass itself is
        # plain HTTP on the internal compose network.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
