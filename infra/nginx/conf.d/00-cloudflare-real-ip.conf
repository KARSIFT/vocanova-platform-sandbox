# infra/nginx/conf.d/00-cloudflare-real-ip.conf
#
# VOC-032-T05: restores the real client IP from Cloudflare's
# `CF-Connecting-IP` header, scoped ONLY to Cloudflare's published
# edge IP ranges (VOC-032-R01 mitigation, impact-analysis.md).
#
# Why this matters: `apps/api/business/auth`'s existing IP-based
# rate limiting reads `$remote_addr` (via the api service's own
# request-IP extraction, which the api container trusts because
# nginx is the only path in). If `set_real_ip_from` were scoped to
# `0.0.0.0/0` (or omitted `real_ip_header` scoping entirely), a
# request that connects DIRECTLY to the origin server's IP -
# bypassing Cloudflare entirely - could set an arbitrary
# `CF-Connecting-IP` header and nginx would blindly trust it,
# spoofing the client IP the rate limiter sees. Scoping
# `set_real_ip_from` to only Cloudflare's published ranges is what
# prevents that: nginx only substitutes `CF-Connecting-IP` for
# `$remote_addr` when the TCP connection's peer address is itself one
# of these ranges (i.e., the request genuinely arrived via a
# Cloudflare edge node). A direct connection to the origin has a
# peer address outside every range below, so nginx leaves
# `$remote_addr` as the true (attacker-controlled, but not spoofable
# beyond that) connecting IP instead - it can never become a
# forged arbitrary CF-Connecting-IP value. This is the exact
# confirmation VOC-032-R01 and VOC-032-TEST-13 ask for.
#
# Source: Cloudflare's published IP ranges
# (https://www.cloudflare.com/ips-v4 and .../ips-v6), captured at
# VOC-032-T05 draft time (2026-07-29). These ranges change
# infrequently but are NOT guaranteed permanent - re-sync this file
# against the URLs above if Cloudflare ever announces a range
# change, and prefer automating that sync in a future package
# rather than relying on someone remembering to do it by hand.
#
# real_ip_header names which incoming header carries the original
# client IP; Cloudflare always sets CF-Connecting-IP on requests it
# proxies (this is more reliable than the generic
# X-Forwarded-For, which can carry a comma-separated chain from
# multiple untrusted intermediate proxies).
real_ip_header CF-Connecting-IP;

# IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/29;
