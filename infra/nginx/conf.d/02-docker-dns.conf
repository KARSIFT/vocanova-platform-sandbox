# infra/nginx/conf.d/02-docker-dns.conf
#
# VOC-032-T05: use Docker's embedded DNS resolver (always at
# 127.0.0.11 on a user-defined bridge network - infra/docker-
# compose.yml's `vocanova-net`, T04) instead of nginx's default
# behavior of resolving each `proxy_pass` hostname once, at config
# load/reload time, and caching that IP indefinitely.
#
# Why this matters here specifically: 10-staging-web.conf and
# 20-api-staging.conf's `proxy_pass` targets (`web`, `api`) are
# Docker Compose service names, not stable IPs - a container
# restart (a routine `T07` deploy, or Docker restarting a crashed
# container per its `unless-stopped` policy) can get a new internal
# IP on the `vocanova-net` bridge network. Combined with putting the
# proxy_pass target in a variable (see both server configs' `set
# $upstream_*` lines), this makes nginx re-resolve the hostname via
# Docker's DNS on every request instead of caching a possibly-stale
# IP - the standard fix for the well-known "nginx proxies to a dead
# container after a Docker Compose restart" failure mode. `valid=10s`
# caps the DNS lookups nginx will actually issue during real traffic.
resolver 127.0.0.11 valid=10s;
