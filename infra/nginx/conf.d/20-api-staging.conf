# infra/nginx/conf.d/20-api-staging.conf
#
# VOC-032-T05: api-staging.vocanova.site -> the `api` service
# (infra/docker-compose.yml, T04), per VOC-032-D03's staging
# subdomain proposal.
#
# Same shape as 10-staging-web.conf (plain-80 redirect, TLS
# termination at nginx via the Cloudflare origin certificate,
# security headers on every response), proxying instead to the api
# container's internal address (http://api:8080). The api's own
# `/healthz` (T00) is reachable through this same server block -
# no special-casing needed since it's an unauthenticated route the
# api service itself already exposes.
server {
    listen 80;
    server_name api-staging.vocanova.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-staging.vocanova.site;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # See 02-docker-dns.conf: resolving through a variable keeps
        # nginx from caching a stale `api` container IP across
        # restarts.
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api;

        # Same rationale as 10-staging-web.conf: Host/X-Real-IP/
        # X-Forwarded-For/X-Forwarded-Proto let the api's own
        # request-IP extraction and any absolute-URL construction
        # (BASE_URL is already an absolute https:// value from
        # apps/api/.env.example, so this is defense-in-depth, not
        # load-bearing for URL construction) see the true client and
        # scheme rather than nginx's own internal proxy hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
