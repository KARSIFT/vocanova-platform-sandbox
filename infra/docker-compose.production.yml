# infra/docker-compose.production.yml
#
# VOC-037-T06: production stack for the shared host, per
# VOC-037-D00 (Option A-modified: same physical host as staging,
# fully isolated by directory tree, compose project, secrets, and
# deploy user) and VOC-037-D01's corrected 4A mechanism.
#
# Two properties of this file are load-bearing for that isolation
# and must not be "simplified" away:
#
#   1. No service declares a `build:` block. The compose file is
#      deployed to /opt/vocanova/production/, so a relative build
#      context (`..`, `../apps/api`) would resolve into
#      /opt/vocanova/ - i.e. straight into staging's tree. Images
#      are built and pushed by .github/workflows/deploy-production.yml
#      and consumed here by immutable tag only.
#   2. Every path is anchored at ${VOCANOVA_PRODUCTION_ROOT}, which
#      defaults to /opt/vocanova/production and never points at
#      staging's /opt/vocanova/infra.
#
# Resource limits are the shared-host contention mitigation D00
# required. The host is 2 vCPU / 4 GB and now runs both tiers, so
# the two compose files' memory limits are budgeted together:
# production caps at ~1.9 GB and staging at ~1.4 GB, leaving
# headroom for the host itself. Raising a limit here without
# lowering staging's oversubscribes the host.
#
# Public HTTPS: vocanova-shared-edge-nginx on host 80/443
# (infra/docker-compose.shared-edge.yml). VOC-079-T01: web API_BASE_URL and
# deploy-emitted OAuth/browser URLs use canonical HTTPS :443 (no :8443
# qualification). This compose still keeps a temporary production nginx
# cutover bridge on host 8081/8443 until VOC-079-T02 retires it after
# cloudflare_remap_api_status: absent (VOC-067-AC-06 / TEST-06; missing
# token is not a pass). Retiring the bridge before that gate recreates
# issue #485.
name: vocanova-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vocanova-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocanova
      POSTGRES_DB: vocanova
    env_file:
      - path: ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/postgres.env
        required: false
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocanova -d vocanova"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.00
    networks:
      - vocanova-production-net
    logging: *default-logging

  api:
    image: ghcr.io/karsift/vocanova-api:${PRODUCTION_IMAGE_TAG:-prod}
    container_name: vocanova-production-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/api.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 1.00
    networks:
      - vocanova-production-net
    logging: *default-logging

  web:
    # NEXT_PUBLIC_API_BASE_URL is inlined into the client bundle at
    # image-build time by deploy-production.yml, not here; there is
    # no runtime equivalent to set.
    image: ghcr.io/karsift/vocanova-web:${PRODUCTION_IMAGE_TAG:-prod}
    container_name: vocanova-production-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # NOT the internal http://api:8080 address: middleware.ts's
      # getApiBaseURL() prefers API_BASE_URL over NEXT_PUBLIC_API_BASE_URL
      # when running server-side, and that internal call is what actually
      # backs every /onboarding, /home, etc. auth check. Found live on
      # VOC-038-T03's first real founder sign-in: OAuth completed, a
      # valid non-revoked session existed in the database, and the
      # browser correctly sent the session cookie on the post-redirect
      # request (confirmed in DevTools Network tab) - yet middleware
      # still 307'd back to /signin, meaning its internal fetch to
      # http://api:8080/api/v1/me was failing even though a plain `wget`
      # to the same address from inside this same container succeeded.
      # Using the same public HTTPS URL the browser itself already uses
      # (proven reachable end-to-end) removes that unverified internal
      # code path entirely instead of debugging it blind.
      API_BASE_URL: https://api-production.vocanova.site
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 1.00
    networks:
      - vocanova-production-net
    logging: *default-logging

  # VOC-067-T02 temporary cutover bridge: publish 8081/8443 only while
  # Cloudflare still remaps production hostnames to origin :8443, or until
  # T05 records cloudflare_remap_api_status: absent. Primary public path is
  # shared-edge on 80/443; do not treat this service as the steady-state
  # edge. Cert paths match shared-edge production mounts
  # (/etc/nginx/certs/production/) so the same conf.d tree loads in both.
  nginx:
    image: nginx:1.27-alpine
    container_name: vocanova-production-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/nginx/cert.pem:/etc/nginx/certs/production/cert.pem:ro
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/nginx/key.pem:/etc/nginx/certs/production/key.pem:ro
    healthcheck:
      # Default-server /healthz probe (VOC-066); bare / returns 444.
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    cpus: 0.50
    networks:
      - vocanova-production-net
    logging: *default-logging

volumes:
  production-postgres-data:
    name: vocanova-production-postgres-data

networks:
  vocanova-production-net:
    name: vocanova-production-net
    driver: bridge
