# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Used by .github/workflows/release.yml to regenerate CHANGELOG.md and to
# render the GitHub Release notes for each vX.Y.Z tag. Commit grouping keys
# off Conventional Commit prefixes, which .github/workflows/pr-title.yml
# already enforces on every squash-merged PR title.

[changelog]
header = """# Changelog

All notable changes to the Vocanova platform. This file is regenerated by
`.github/workflows/release.yml`; do not edit released sections by hand.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[remote.github]
owner = "KARSIFT"
repo = "vocanova-platform-sandbox"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/KARSIFT/vocanova-platform-sandbox/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^release", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
]
tag_pattern = "v[0-9]*"
sort_commits = "newest"
